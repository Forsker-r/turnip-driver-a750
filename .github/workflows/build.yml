# =============================================================================
# turnip-driver-a750 — Snapdragon 8 Gen 3 / Adreno 750 (FD750 / a7xx_gen3)
# %100 Resmî Mesa Upstream Turnip Derleme Hattı — Kusursuzlaştırılmış Sürüm
#
# KAYNAK: https://gitlab.freedesktop.org/mesa/mesa.git (yalnızca resmî upstream)
# TOOLCHAIN: https://dl.google.com/android/repository (yalnızca resmî NDK)
#
# GARANTİLER:
#   * Hiçbir yama/patch uygulanmaz (git apply / patch / sed / awk / python YOK)
#   * Mesa kaynak ağacında tek bir dosya bile değiştirilmez
#   * Kaynak yalnızca resmî Mesa upstream GitLab deposundan alınır
#   * Toolchain yalnızca resmî Android NDK'dan (dl.google.com) alınır
#   * Runtime davranış ayarları (TU_DEBUG, TU_AUTOTUNE_ALGO, TU_GMEM,
#     FD_DEV_FEATURES, driconf) build artifact'ına GÖMÜLMEZ
#   * Paketlemeden önce binary doğrulaması: AArch64 + ELF DYN + yalnızca
#     bionic bağımlılıkları (Turnip md §5.2 paket doğrulama tablosu)
#   * Meson parametre çekirdeği kanıtlanmış build parametrelerinden gelir
#     (Turnip md §6.4 + docs/android.rst — B4 kaynağı)
#   * EK-1 Patch Araştırma Listesi'ndeki hiçbir madde bu workflow'a sızmamıştır
#
# REFERANS DOKÜMANLAR:
#   * snapdragon-8-gen-3-turnip-teknik-dokumantasyon.md  (→ "Turnip md")
#   * snapdragon_8_gen_3_cpu_gpu_teknik_dokumantasyon.md (→ "CPU/GPU md")
# =============================================================================

name: build-turnip-a750-upstream

on:
  push:
    branches: [ main ]
  # workflow_dispatch ZORUNLU DEĞİLDİR: push tetikleyicisi otomatik başlatır.
  # workflow_dispatch yalnızca "Run workflow" düğmesiyle girdi seçerek
  # manuel çalıştırma / LTO denemesi / NDK yükseltme için kullanılır.
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: >-
          Mesa kaynağı: 'stable' (otomatik en son resmî stable tag) |
          'main' (bleeding-edge; Turnip md §10.2 '-devel taban' riski) |
          doğrudan tag (örn. mesa-26.2.4)
        required: false
        default: "stable"
        type: string
      ndk_version:
        description: >-
          Resmî Android NDK sürümü.
          Varsayılan 'r26d' — Turnip md §6.4/§6.1'de kanıtlanmış (bionic+KGSL).
          Resmî güncel alternatif: 'r30'.
        required: false
        default: "r26d"
        type: string
      ndk_sha1:
        description: >-
          NDK zip SHA1 doğrulama (developer.android.com/ndk/downloads resmî değeri;
          boş bırakılırsa SHA1 kontrolü atlanır ve uyarı basılır).
          r26d Linux SHA1: 5107f898313790e449e87eee2183d9a20602dee9
        required: false
        default: ""
        type: string
      enable_lto:
        description: >-
          Thin LTO aktifleştir. Varsayılan KAPALI — dokümanda LTO kanıtı
          yoktur (Turnip md §6.4); cihaz testi olmadan performans iddiası
          üretilmez. Açmak için prompt alan 4 kuralı geçerlidir.
        required: false
        default: false
        type: boolean
  # OPSİYONEL haftalık otomatik derleme — etkinleştirmek için # kaldırın:
  # schedule:
  #   - cron: "0 4 * * 1"   # her Pazartesi 04:00 UTC

# Paralel çalışmaları iptal et (ana dal için en son build geçerlidir)
concurrency:
  group: build-turnip-a750-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # GitHub Release için; yalnızca release adımında kullanılır

env:
  # --- YALNIZCA RESMİ KAYNAKLAR (VERİ KAYNAĞI GÜVENLİĞİ KURALI) ---------
  MESA_REPO: "https://gitlab.freedesktop.org/mesa/mesa.git"
  NDK_URL_BASE: "https://dl.google.com/android/repository"
  # --- Turnip md §6.4 KANITLANMIŞ cross-file / platform değerleri ----------
  CROSS_API: "34"           # aarch64-linux-android34-clang
  PLATFORM_SDK_VERSION: "36"
  ADPKG_MIN_API: "29"       # libadrenotools memfd desteği: Android 10+ (API 29)

jobs:
  build:
    name: "Turnip A750 — Pure Upstream Mesa (freedreno/KGSL, aarch64)"
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # -----------------------------------------------------------------------
      # ADIM 1 — Girdileri ortam değişkenlerine aktar
      # -----------------------------------------------------------------------
      - name: "1/15 · Girdiler: workflow parametrelerini ortam değişkenlerine aktar"
        run: |
          set -euo pipefail
          {
            echo "MESA_REF=${{ inputs.mesa_ref || 'stable' }}"
            echo "NDK_VERSION=${{ inputs.ndk_version || 'r26d' }}"
            echo "NDK_SHA1=${{ inputs.ndk_sha1 || '' }}"
            echo "ENABLE_LTO=${{ inputs.enable_lto || 'false' }}"
          } >> "$GITHUB_ENV"
          echo "=== Derleme parametreleri ==="
          echo "  mesa_ref  : ${{ inputs.mesa_ref  || 'stable' }}"
          echo "  ndk       : ${{ inputs.ndk_version || 'r26d' }} (sha1 kontrolü: ${{ inputs.ndk_sha1 != '' && 'VAR' || 'YOK — uyarı basılacak' }})"
          echo "  lto       : ${{ inputs.enable_lto || 'false' }}"
          echo "  runner    : ubuntu-latest"

      # -----------------------------------------------------------------------
      # ADIM 2 — Bu deponun checkout'u (Mesa kaynağı DEĞİLDİR)
      # -----------------------------------------------------------------------
      - name: "2/15 · Checkout: turnip-driver-a750 deposu"
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # ADIM 3 — Derleme bağımlılıklarını kur
      # Mesa kaynak ağacına HİÇBİR araç sokulmaz
      # -----------------------------------------------------------------------
      - name: "3/15 · Bağımlılıklar: meson/ninja/python modülleri ve doğrulama araçları"
        run: |
          set -euo pipefail
          echo "::group::APT güncelle ve gerekli paketleri kur"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            ccache \
            curl \
            flex \
            bison \
            gettext \
            git \
            glslang-tools \
            jq \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            unzip \
            xz-utils \
            zip \
            zstd \
            file \
            binutils
          echo "::endgroup::"

          echo "::group::Python derleme araçları (meson, mako, pyyaml, packaging)"
          python3 -m pip install --upgrade pip --quiet
          python3 -m pip install "meson>=1.4.0" "mako>=1.2.0" "pyyaml" "packaging" --quiet
          echo "meson  : $(meson --version)"
          echo "ninja  : $(ninja --version)"
          echo "glslang: $(glslangValidator --version 2>&1 | head -1)"
          echo "ccache : $(ccache --version | head -1)"
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      # ADIM 4 — NDK önbelleği
      # -----------------------------------------------------------------------
      - name: "4/15 · Cache: resmî Android NDK arşivi/dizini"
        uses: actions/cache@v4
        with:
          path: ~/android-ndk
          key: ndk-linux-${{ env.NDK_VERSION }}-v1

      # -----------------------------------------------------------------------
      # ADIM 5 — Resmî NDK indir, doğrula, aç
      # Kaynak: dl.google.com (resmî Google NDK dağıtım kanalı)
      # -----------------------------------------------------------------------
      - name: "5/15 · Toolchain: resmî Android NDK indir, SHA1 doğrula ve aç (dl.google.com)"
        run: |
          set -euo pipefail
          NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          URL="${NDK_URL_BASE}/${NDK_ZIP}"
          NDK_ROOT="$HOME/android-ndk"
          mkdir -p "$NDK_ROOT"

          if [ ! -d "${NDK_ROOT}/android-ndk-${NDK_VERSION}" ]; then
            echo "::group::Resmî NDK indiriliyor: ${URL}"
            curl -fSL --retry 3 --retry-delay 5 \
              -o "$RUNNER_TEMP/${NDK_ZIP}" \
              "$URL"
            echo "::endgroup::"

            # SHA1 doğrulaması (resmî developer.android.com/ndk/downloads değeri)
            if [ -n "${NDK_SHA1}" ]; then
              echo "::group::SHA1 doğrulaması"
              echo "${NDK_SHA1}  ${RUNNER_TEMP}/${NDK_ZIP}" | sha1sum -c - \
                || { echo "::error::NDK SHA1 doğrulaması BAŞARISIZ — arşiv beklenen değerle eşleşmiyor; job durduruluyor."; exit 1; }
              echo "SHA1 doğrulaması TAMAM"
              echo "::endgroup::"
            else
              echo "::warning::ndk_sha1 girdisi boş — SHA1 doğrulaması atlandı. Resmî SHA1 değerini developer.android.com/ndk/downloads sayfasından alarak girdi olarak sağlayabilirsiniz."
            fi

            echo "::group::NDK açılıyor"
            unzip -q "$RUNNER_TEMP/${NDK_ZIP}" -d "$NDK_ROOT"
            rm -f "$RUNNER_TEMP/${NDK_ZIP}"
            echo "::endgroup::"
          else
            echo "NDK önbellekten kullanılıyor: ${NDK_ROOT}/android-ndk-${NDK_VERSION}"
          fi

          NDK_DIR="${NDK_ROOT}/android-ndk-${NDK_VERSION}"
          [ -f "${NDK_DIR}/source.properties" ] \
            || { echo "::error::NDK dizini beklendiği gibi değil: ${NDK_DIR}"; exit 1; }

          NDK_REV=$(grep "^Pkg.Revision=" "${NDK_DIR}/source.properties" | cut -d= -f2)
          echo "NDK Revision: ${NDK_REV}"
          echo "NDK_DIR=${NDK_DIR}" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # ADIM 6 — ccache önbelleği
      # -----------------------------------------------------------------------
      - name: "6/15 · Cache: ccache derleyici nesne önbelleği"
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          # Mesa sürümüne bağlı anahtar — sürüm değişince cache geçersizleşir
          key: ccache-turnip-a750-${{ env.NDK_VERSION }}-${{ env.MESA_REF }}-${{ github.run_id }}
          restore-keys: |
            ccache-turnip-a750-${{ env.NDK_VERSION }}-${{ env.MESA_REF }}-
            ccache-turnip-a750-${{ env.NDK_VERSION }}-

      # -----------------------------------------------------------------------
      # ADIM 7 — Dinamik stable tag tespiti
      # Kaynak: Turnip md §1.4 (sürüm tablosu), §10.2 (-devel taban riski),
      #         §7.1 (tüm kritik 26.x özellikleri stable'a düşmüş durumda)
      # -----------------------------------------------------------------------
      - name: "7/15 · Sürüm tespiti: en son resmî Mesa stable tag (dinamik, rc dışlama)"
        run: |
          set -euo pipefail
          TAG=""

          if [ "${MESA_REF}" = "stable" ]; then
            echo "::group::GitLab Releases API ile stable tag tespiti"
            # Birincil yol: Resmî GitLab Releases API
            API="https://gitlab.freedesktop.org/api/v4/projects/mesa%2Fmesa/releases?per_page=50"
            TAG="$(curl -fsSL --retry 3 --retry-delay 5 "${API}" \
              | jq -r '[.[].tag_name | select(test("^mesa-[0-9]+\\.[0-9]+\\.[0-9]+$"))] | .[0]' \
              || true)"

            # Fallback yol: git ls-remote (GitLab bot-doğrulama engelinde devreye girer)
            if [ -z "${TAG}" ]; then
              echo "::warning::GitLab Releases API yanıt vermedi — git ls-remote fallback kullanılıyor."
              TAG="$(git ls-remote --tags --refs "${MESA_REPO}" \
                | awk -F/ '{print $NF}' \
                | grep -E '^mesa-[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V \
                | tail -n1 \
                || true)"
            fi
            echo "::endgroup::"

          elif [ "${MESA_REF}" = "main" ]; then
            echo "::warning::'main' seçildi — Turnip md §10.2 '-devel taban' regresyon riski kullanıcıya aittir (örnek: v26.0.0_R3 CB perf regresyonu, v24.1.0_R18 KHR_8bit_storage geri çekilmesi)."
            TAG="main"

          else
            # Kullanıcı doğrudan tag belirtmiş — resmî depoda varlığı clone adımında doğrulanacak
            TAG="${MESA_REF}"
            echo "Kullanıcı tarafından belirlenen tag: ${TAG}"
          fi

          [ -n "${TAG}" ] \
            || { echo "::error::Mesa sürümü tespit edilemedi — resmî GitLab deposu erişilemiyor olabilir."; exit 1; }

          echo "Seçilen Mesa kaynağı: ${TAG}"
          echo "MESA_TAG=${TAG}" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # ADIM 8 — Resmî Mesa kaynak indirme + saflık denetimi
      # YASAK: Bu adımdan sonra Mesa kaynak ağacını değiştiren HİÇBİR
      #        adım bulunmamaktadır (tasarım gereği, kaynak saflığı).
      # -----------------------------------------------------------------------
      - name: "8/15 · Kaynak: resmî Mesa upstream clone (shallow, saflık denetimli)"
        run: |
          set -euo pipefail
          echo "::group::Resmî Mesa klonlama: ${MESA_REPO} @ ${MESA_TAG}"
          git clone --depth 1 --branch "${MESA_TAG}" \
            "${MESA_REPO}" mesa-src \
            || { echo "::error::Clone başarısız: ${MESA_REPO} @ ${MESA_TAG}. Tag resmî depoda mevcut olmayabilir."; exit 1; }
          echo "::endgroup::"

          COMMIT="$(git -C mesa-src rev-parse HEAD)"
          echo "Mesa kaynak commit: ${COMMIT}"
          echo "MESA_COMMIT=${COMMIT}" >> "$GITHUB_ENV"

          # Kaynak saflığı denetimi — çalışma ağacı temiz olmalı
          echo "::group::Kaynak saflığı denetimi (git status --porcelain)"
          if [ -n "$(git -C mesa-src status --porcelain)" ]; then
            echo "::error::Kaynak ağacı beklenmedik şekilde kirli — kaynak saflığı bozulmuş!"
            git -C mesa-src status --porcelain
            exit 1
          fi
          echo "Kaynak saflığı: TEMIZ — saf upstream, yamasız ✓"
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      # ADIM 9 — Üstveri: sürüm + build tarihi + commit hash
      # -----------------------------------------------------------------------
      - name: "9/15 · Üstveri: artifact adı ve izlenebilirlik değerleri"
        run: |
          set -euo pipefail
          BUILD_DATE="$(date -u +%Y%m%d-%H%M)"
          COMMIT_SHORT="${MESA_COMMIT:0:12}"
          TAG_CLEAN="${MESA_TAG#mesa-}"   # "mesa-26.2.4" → "26.2.4"
          ARTIFACT_BASE="Turnip-upstream-${MESA_TAG}-${COMMIT_SHORT}-${BUILD_DATE}-SM8650-A750"
          {
            echo "BUILD_DATE=${BUILD_DATE}"
            echo "COMMIT_SHORT=${COMMIT_SHORT}"
            echo "TAG_CLEAN=${TAG_CLEAN}"
            echo "ARTIFACT_BASE=${ARTIFACT_BASE}"
          } >> "$GITHUB_ENV"
          echo "Artifact adı: ${ARTIFACT_BASE}"

      # -----------------------------------------------------------------------
      # ADIM 10 — ccache yapılandır
      # -----------------------------------------------------------------------
      - name: "10/15 · ccache: yapılandır"
        run: |
          set -euo pipefail
          ccache --set-config=max_size=1G
          ccache --set-config=compression=true
          ccache --zero-stats
          echo "ccache yapılandırıldı (max 1 GB, sıkıştırma açık)"

      # -----------------------------------------------------------------------
      # ADIM 11 — Meson cross-file oluştur + yapılandır + derle
      #
      # Cross-file: Turnip md §6.4 + docs/android.rst (B4) kanıtlanmış temel
      # ISA hedefleme: CPU/GPU md §2.1 (tüm çekirdekler ARMv9.2-A, AArch64-only)
      #                CPU/GPU md §2.2.A–E (FEAT_* uzantı tablosu)
      #                CPU/GPU md §2.3 (TuneA720 füzyon davranışları)
      #
      # VARSAYIM (V-march): -march=armv9.2-a — CPU/GPU md §2.1'de 8 çekirdeğin
      # tamamı (X4 + 5×A720 + 2×A520) yalnızca AArch64 ve ARMv9.2-A; imli ISA
      # seti (FEAT_BF16, FEAT_I8MM, FEAT_DotProd, FEAT_LSE/LSE2, FEAT_LRCPC2 vb.)
      # tek tek +uzantı yazmadan otomatik açılır. Doğruluk riski yoktur.
      #
      # VARSAYIM (V-mtune): -mtune=cortex-a720 — 5 adet OoO performans çekirdeği
      # (3×A720 + 2×A720) topluluk shader derlemesinde (ir3) ana yükü taşır.
      # CPU/GPU md §2.3 TuneA720: FeatureFuseAES, FeatureFuseAdrpAdd,
      # FeatureFuseCmpCSel, FeatureFuseCmpCSet, FeatureCmpBccFusion, FeatureALULSLFast.
      # -mtune yalnızca zamanlama sezgilerini etkiler; doğruluk riski yoktur.
      #
      # Meson parametre çekirdeği (Turnip md §6.4 kanıtlanmış satırlar):
      #   -Dvulkan-drivers=freedreno -Dfreedreno-kmds=kgsl -Dplatforms=android
      #   -Dandroid-stub=true -Dandroid-libbacktrace=disabled
      #   -Dgallium-drivers= -Dvulkan-beta=true -Degl=disabled -Dvideo-codecs=
      #   -Dbuildtype=release -Dstrip=true
      # Güvenli eklemeler (Turnip md §5.2 + §6.4 + prompt alan 1):
      #   -Dllvm=disabled -Dglx=disabled -Dgbm=disabled -Dosmesa=disabled
      #   -Dgles1=disabled -Dgles2=disabled -Dzstd=disabled -Dvalgrind=disabled
      #   --wrap-mode=nofallback (kaynak saflığı — VERİ KAYNAĞI GÜVENLİĞİ kuralı)
      # Derleyici/bağlayıcı optimizasyonları (yamasız clang/lld bayrakları):
      #   Unwind tablosu kırpma (Turnip md §6.4 kanıtlanmış)
      #   -static-libstdc++ (Turnip md §6.4; Android namespace izolasyonu — §5.1)
      #   -ffunction-sections/-fdata-sections + --gc-sections (ölü kod ayıklama)
      #   -Wl,-O2 (lld bağlayıcı optimizasyonu)
      #   -Db_ndebug=if-release (standart release kuralı; VARSAYIM V11)
      # -----------------------------------------------------------------------
      - name: "11/15 · Meson: cross-file oluştur, yapılandır ve derle (Turnip/KGSL, ARMv9.2-A)"
        run: |
          set -euo pipefail
          export PATH="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin:${PATH}"

          # NDK'nın resmî cross-file'ını kullan (docs/android.rst B4 yöntemi)
          # NDK r26d+ sürümlerinde "$NDK/build/meson/" altındaki cross-file'lar hazır gelir.
          # Eğer NDK cross-file yoksa elle inşa et (Turnip md §6.4 cross-file şablonu).
          NDK_CROSS_DIR="${NDK_DIR}/build/meson"
          NDK_BIN="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CLANG_BINARY="${NDK_BIN}/aarch64-linux-android${CROSS_API}-clang"

          if [ ! -f "${CLANG_BINARY}" ]; then
            echo "::error::NDK Clang derleyicisi bulunamadı: ${CLANG_BINARY}"
            echo "Mevcut binary'ler:"; ls -1 "${NDK_BIN}" | head -30
            exit 1
          fi

          # Cross-file oluştur
          # CPU/GPU md §2.1, §2.3 — -march=armv9.2-a (tüm çekirdekler) -mtune=cortex-a720
          ARCH_ARGS="-march=armv9.2-a -mtune=cortex-a720"
          # Turnip md §6.4 CXXFLAGS — kanıtlanmış satır (Droid-Deck build_android.sh)
          C_EXTRA="-fno-unwind-tables -fno-asynchronous-unwind-tables"
          CPP_EXTRA="-fno-exceptions ${C_EXTRA}"
          # Ölü kod ayıklama (prompt alan 4; lld GC kökü olarak ICD sembollerini korur)
          SEC_FLAGS="-ffunction-sections -fdata-sections"
          LINK_FLAGS="-Wl,--gc-sections -Wl,-O2 -fuse-ld=lld"

          C_ARGS="${ARCH_ARGS} ${C_EXTRA} ${SEC_FLAGS}"
          CPP_ARGS="${ARCH_ARGS} ${CPP_EXTRA} ${SEC_FLAGS}"

          # ccache + NDK clang entegrasyonu
          cat > "${RUNNER_TEMP}/android-aarch64-sm8650.ini" << CROSSEOF
          [binaries]
          c = ['ccache', '${NDK_BIN}/aarch64-linux-android${CROSS_API}-clang']
          cpp = ['ccache', '${NDK_BIN}/aarch64-linux-android${CROSS_API}-clang++']
          ar = '${NDK_BIN}/llvm-ar'
          strip = '${NDK_BIN}/llvm-strip'
          c_ld = 'lld'
          cpp_ld = 'lld'

          [built-in options]
          c_args = ['${C_ARGS// /', '}']
          cpp_args = ['${CPP_ARGS// /', '}']
          c_link_args = ['${LINK_FLAGS// /', '}']
          cpp_link_args = ['${LINK_FLAGS// /', '}', '-static-libstdc++']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          CROSSEOF

          echo "::group::Cross-file içeriği"
          cat "${RUNNER_TEMP}/android-aarch64-sm8650.ini"
          echo "::endgroup::"

          # Thin LTO girdi kontrolü (VARSAYIM V5 — varsayılan KAPALI)
          LTO_ARGS=()
          if [ "${ENABLE_LTO}" = "true" ]; then
            LTO_ARGS=(-Db_lto=true -Db_lto_mode=thin)
            echo "::notice::Thin LTO ETKİN — VARSAYIM: dokümanda LTO kanıtı yoktur (Turnip md §6.4). Cihaz testi olmadan performans iddiası üretilmez."
          fi

          echo "::group::Meson setup"
          meson setup build mesa-src \
            --wrap-mode=nofallback \
            --cross-file "${RUNNER_TEMP}/android-aarch64-sm8650.ini" \
            -Dbuildtype=release \
            -Dstrip=true \
            -Db_ndebug=if-release \
            -Dplatforms=android \
            -Dplatform-sdk-version=${PLATFORM_SDK_VERSION} \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-beta=true \
            -Dfreedreno-kmds=kgsl \
            -Degl=disabled \
            -Dvideo-codecs= \
            -Dllvm=disabled \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dosmesa=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dzstd=disabled \
            -Dvalgrind=disabled \
            "${LTO_ARGS[@]}"
          echo "::endgroup::"

          # Meson setup sonrası kaynak saflığı kontrolü
          echo "::group::Meson setup sonrası kaynak saflığı denetimi"
          if [ -n "$(git -C mesa-src status --porcelain)" ]; then
            echo "::error::Meson setup sonrasında Mesa kaynak ağacında değişiklik tespit edildi — kaynak saflığı bozulmuş!"
            git -C mesa-src status --porcelain
            exit 1
          fi
          echo "Meson setup sonrası kaynak saflığı: TEMIZ ✓"
          echo "::endgroup::"

          echo "::group::Ninja derleme"
          ninja -C build src/freedreno/vulkan/libvulkan_freedreno.so
          echo "::endgroup::"

          echo "::group::ccache istatistikleri"
          ccache --show-stats
          echo "::endgroup::"

          echo "Derleme tamamlandı."

      # -----------------------------------------------------------------------
      # ADIM 12 — .so dosyasını konumlandır
      # -----------------------------------------------------------------------
      - name: "12/15 · Çıktı: libvulkan_freedreno.so konumlandırma"
        run: |
          set -euo pipefail
          SO="$(find build -type f -name 'libvulkan_freedreno.so' | head -n1)"
          if [ -z "${SO}" ]; then
            echo "::error::libvulkan_freedreno.so üretilmedi!"
            echo "Build ağacındaki paylaşımlı nesneler:"
            find build -name '*.so' -o -name '*.a' | head -50
            exit 1
          fi
          echo "Üretilen sürücü: ${SO}  ($(stat -c '%s' "${SO}") bayt)"
          ls -lh "${SO}"
          echo "SO_PATH=${SO}" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # ADIM 13 — Binary doğrulama (Turnip md §5.2 paket doğrulama tablosu)
      # Geçmezse job anlamlı hata mesajıyla durur; hatalı artifact yüklenmez.
      # Kontroller:
      #   [1/6] file → ARM aarch64 bayt düzeni
      #   [2/6] readelf -h → Machine: AArch64
      #   [3/6] readelf -h → Type: DYN (paylaşımlı nesne)
      #   [4/6] NEEDED → libc.so (bionic) mevcut
      #   [5/6] NEEDED → glibc/dinamik libc++ YOK (yalnız bionic)
      #   [6/6] dyn-syms → vk_icdGetInstanceProcAddr (ICD yükleme giriş noktası)
      # Ek:
      #   [+]  Linux masaüstü WSI sembolleri sızmamış kontrolü
      #   [+]  meta.json jq şema doğrulaması (paketleme adımında)
      # -----------------------------------------------------------------------
      - name: "13/15 · Doğrulama: AArch64 + DYN + bionic-only + ICD giriş noktası (Turnip md §5.2)"
        run: |
          set -euo pipefail
          SO="${SO_PATH}"
          FAIL=0

          echo "::group::Doğrulama [1/6] — file"
          FILE_OUT="$(file -b "${SO}")"
          echo "file: ${FILE_OUT}"
          echo "boyut: $(stat -c '%s bayt' "${SO}")"
          if ! echo "${FILE_OUT}" | grep -q "ARM aarch64"; then
            echo "::error::Doğrulama [1/6] HATA: Mimari AArch64 değil!"; FAIL=1
          fi
          echo "::endgroup::"

          echo "::group::Doğrulama [2/6] — ELF Machine AArch64"
          HDR="$(readelf -h "${SO}")"
          echo "${HDR}" | sed -n '1,15p'
          if ! echo "${HDR}" | grep -Eq 'Machine:[[:space:]]*AArch64'; then
            echo "::error::Doğrulama [2/6] HATA: ELF Machine AArch64 değil!"; FAIL=1
          fi
          echo "::endgroup::"

          echo "::group::Doğrulama [3/6] — ELF Type DYN"
          if ! echo "${HDR}" | grep -Eq 'Type:[[:space:]]*DYN'; then
            echo "::error::Doğrulama [3/6] HATA: ELF tipi DYN (paylaşımlı nesne) değil!"; FAIL=1
          fi
          echo "::endgroup::"

          echo "::group::Doğrulama [4/6] — NEEDED libc.so (bionic)"
          NEEDED="$(readelf -d "${SO}" | awk '/\(NEEDED\)/{print $NF}' | tr -d '[]')"
          echo "NEEDED: ${NEEDED:-YOK}"
          if ! echo "${NEEDED}" | grep -qx 'libc.so'; then
            echo "::error::Doğrulama [4/6] HATA: Android bionic 'libc.so' bağımlılığı yok! (Turnip md §5.2)"; FAIL=1
          fi
          echo "::endgroup::"

          echo "::group::Doğrulama [5/6] — glibc / dinamik libc++ YOK (yalnızca bionic)"
          ALLOWED_REGEX='^(libc\.so|libm\.so|libdl\.so|liblog\.so|libnativewindow\.so|libsync\.so|libandroid\.so)$'
          FORBIDDEN_REGEX='^(libc\.so\.6|libstdc\+\+\.so\.6|libgcc_s\.so\.1|libc\+\+_shared\.so)$'
          if echo "${NEEDED}" | grep -Eq "${FORBIDDEN_REGEX}"; then
            echo "::error::Doğrulama [5/6] HATA: glibc veya dinamik libc++ bağımlılığı tespit edildi — Android bionic paketi olamaz!"; FAIL=1
          fi
          for lib in ${NEEDED}; do
            if ! echo "${lib}" | grep -Eq "${ALLOWED_REGEX}"; then
              echo "::error::Doğrulama [5/6] HATA: İzin verilmeyen harici kütüphane bağımlılığı: ${lib}"; FAIL=1
            fi
          done
          echo "Bionic kütüphane kontrolü: TAMAM"
          echo "::endgroup::"

          echo "::group::Doğrulama [6/6] — ICD giriş noktası vk_icdGetInstanceProcAddr"
          DYN_SYMS="$(readelf --dyn-syms -W "${SO}")"
          if ! echo "${DYN_SYMS}" | grep -qw 'vk_icdGetInstanceProcAddr'; then
            echo "::error::Doğrulama [6/6] HATA: ICD giriş noktası 'vk_icdGetInstanceProcAddr' dışa aktarılmıyor — sürücü ICD olarak yüklenemez!"; FAIL=1
          fi
          # Linux masaüstü WSI sembolleri sızmamış kontrolü
          if echo "${DYN_SYMS}" | grep -Eq 'vkCreateWaylandSurfaceKHR|vkCreateXcbSurfaceKHR|vkCreateXlibSurfaceKHR'; then
            echo "::error::Ek kontrol HATA: Linux masaüstü WSI sembolleri Android sürücüsüne sızmış!"; FAIL=1
          fi
          echo "::endgroup::"

          echo "::group::Bilgi — Android .note bölümü"
          readelf -n "${SO}" | grep -i android | head -n5 || echo "(Android note yok)"
          echo "::endgroup::"

          if [ "${FAIL}" -ne 0 ]; then
            echo "::error::Binary doğrulama BAŞARISIZ — job durduruluyor. Hatalı artifact paketlenmez/yayınlanmaz."
            exit 1
          fi
          echo "Binary doğrulama TAMAM: AArch64 + DYN + bionic-only + ICD simgesi ✓"

      # -----------------------------------------------------------------------
      # ADIM 14 — Paketleme (AdrenoTools uyumlu zip + meta.json + BUILD-INFO)
      # meta.json alanları: Turnip md §5.2 paket doğrulama tablosu
      # BUILD-INFO.txt: Turnip md §5.2 izlenebilirlik ilkesi + prompt gereksinimleri
      # SHA256SUMS: ek doğrulama
      # -----------------------------------------------------------------------
      - name: "14/15 · Paketle: AdrenoTools .adpkg.zip + meta.json + BUILD-INFO + SHA256SUMS"
        run: |
          set -euo pipefail
          PKG_DIR="${RUNNER_TEMP}/adpkg-staging"
          ARTIFACTS_DIR="${RUNNER_TEMP}/artifacts"
          mkdir -p "${PKG_DIR}" "${ARTIFACTS_DIR}"

          # libvulkan_freedreno.so kopyala (kaynak ağacı değiştirilmez)
          cp "${SO_PATH}" "${PKG_DIR}/libvulkan_freedreno.so"

          # meta.json — Turnip md §5.2 zorunlu alanlar
          cat > "${PKG_DIR}/meta.json" << METAEOF
          {
            "schemaVersion": 1,
            "name": "Turnip Upstream A750 (${TAG_CLEAN})",
            "description": "100% unpatched Mesa Turnip (freedreno Vulkan, KGSL-only) for Adreno 750 (a7xx_gen3, FD750) — built from official upstream ${MESA_TAG} (${COMMIT_SHORT}), zero patches applied",
            "author": "turnip-driver-a750 CI (gitlab.freedesktop.org/mesa/mesa)",
            "packageVersion": "1",
            "vendor": "Mesa",
            "driverVersion": "Mesa ${TAG_CLEAN} (${COMMIT_SHORT})",
            "minApi": ${ADPKG_MIN_API},
            "libraryName": "libvulkan_freedreno.so"
          }
          METAEOF

          # meta.json şema doğrulaması (jq)
          jq -e '.schemaVersion == 1 and .minApi == 29 and .libraryName == "libvulkan_freedreno.so"' \
            "${PKG_DIR}/meta.json" > /dev/null \
            || { echo "::error::meta.json şema doğrulaması BAŞARISIZ — gerekli alanlar eksik veya yanlış!"; exit 1; }
          echo "meta.json şema doğrulaması TAMAM ✓"

          # BUILD-INFO.txt — izlenebilirlik (prompt gereksinimleri + Turnip md §5.2)
          cat > "${PKG_DIR}/BUILD-INFO.txt" << INFOEOF
          === Turnip A750 — Build İzlenebilirlik Kaydı ===
          Sürücü        : Mesa Turnip (libvulkan_freedreno.so)
          Hedef SoC/GPU : Qualcomm Snapdragon 8 Gen 3 (SM8650) / Adreno 750
                          (a7xx_gen3, FD750, chip-id 0x43051401)
          Mesa kaynağı  : ${MESA_REPO} [resmî upstream]
          Mesa tag      : ${MESA_TAG}
          Mesa commit   : ${MESA_COMMIT}
          Mesa commit   : ${COMMIT_SHORT} (kısa)
          Build tarihi  : ${BUILD_DATE} (UTC)
          NDK sürümü    : ${NDK_VERSION} (API ${CROSS_API})
          Cross-file    : aarch64-linux-android${CROSS_API}-clang
          ISA hedefleme : -march=armv9.2-a -mtune=cortex-a720
                          [CPU/GPU md §2.1: tüm çekirdekler ARMv9.2-A + AArch64-only]
                          [CPU/GPU md §2.3: TuneA720 komut füzyonları]
          Optimizasyon  : release(-O3) + NDEBUG + ffunction-sections + fdata-sections
                          + gc-sections + lld -O2 + static-libstdc++
          LTO           : ${ENABLE_LTO}
          Yama durumu   : HİÇBİR yama uygulanmadı — kaynak %100 saf upstream ✓
          Runtime env   : GÖMÜLMEDİ (TU_DEBUG / TU_AUTOTUNE_ALGO / TU_GMEM /
                          FD_DEV_FEATURES / driconf yok)
          Workflow      : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          INFOEOF

          # Zip oluştur
          ( cd "${PKG_DIR}" && zip -9 -r "${ARTIFACTS_DIR}/${ARTIFACT_BASE}.adpkg.zip" \
            libvulkan_freedreno.so meta.json BUILD-INFO.txt )

          # SHA256SUMS
          ( cd "${ARTIFACTS_DIR}" && sha256sum "${ARTIFACT_BASE}.adpkg.zip" > SHA256SUMS.txt )

          # Özet çıktısı
          echo "=== Artifacts ==="
          ls -lh "${ARTIFACTS_DIR}"
          echo "=== Zip içeriği ==="
          unzip -l "${ARTIFACTS_DIR}/${ARTIFACT_BASE}.adpkg.zip"
          echo "=== meta.json ==="
          cat "${PKG_DIR}/meta.json"

          echo "ARTIFACTS_DIR=${ARTIFACTS_DIR}" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # ADIM 15 — Artifact yükleme
      # -----------------------------------------------------------------------
      - name: "15/15 · Artifact: yükle (Turnip-upstream-<tag>-<sha>-<tarih>-SM8650-A750)"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASE }}
          path: ${{ env.ARTIFACTS_DIR }}/*
          if-no-files-found: error
          retention-days: 30

      # -----------------------------------------------------------------------
      # OPSİYONEL — GitHub Release (yalnızca main dalına push'ta)
      # -----------------------------------------------------------------------
      - name: "Opsiyonel: GitHub Release (yalnızca main push'ta)"
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_TAG="turnip-a750-${MESA_TAG}-${BUILD_DATE}"
          gh release create "${RELEASE_TAG}" \
            "${ARTIFACTS_DIR}/${ARTIFACT_BASE}.adpkg.zip" \
            "${ARTIFACTS_DIR}/SHA256SUMS.txt" \
            --title "Turnip A750 ${MESA_TAG} (${COMMIT_SHORT}) — ${BUILD_DATE}" \
            --notes "**100% resmî, yamasız Mesa upstream build.**

          | Alan | Değer |
          |------|-------|
          | Mesa tag | \`${MESA_TAG}\` |
          | Mesa commit | \`${MESA_COMMIT}\` |
          | NDK | \`${NDK_VERSION}\` (API ${CROSS_API}) |
          | ISA | \`-march=armv9.2-a -mtune=cortex-a720\` |
          | LTO | ${ENABLE_LTO} |
          | Yama | **Yok — kaynak %100 saf upstream** |
          | Kaynak | \`${MESA_REPO}\` |

          Bu build.yml %100 resmî Mesa upstream kaynağından derlenir; hiçbir yama uygulanmamıştır; Patch Araştırma Listesi build kararlarına sızmamıştır." \
            || echo "::warning::Release oluşturma başarısız — artifact yine de yüklendi."

      # -----------------------------------------------------------------------
      # Her zaman çalışan özet adımı (başarı/başarısızlık fark etmez)
      # -----------------------------------------------------------------------
      - name: "Özet: GitHub Step Summary"
        if: always()
        run: |
          {
            echo "## Turnip A750 — Upstream Derleme Özeti"
            echo ""
            echo "| Alan | Değer |"
            echo "|---|---|"
            echo "| Mesa kaynağı | \`${MESA_TAG:-bilinmiyor}\` (\`${MESA_COMMIT:-bilinmiyor}\`) |"
            echo "| NDK | \`${NDK_VERSION:-bilinmiyor}\` (API \`${CROSS_API}\`) |"
            echo "| ISA | \`-march=armv9.2-a -mtune=cortex-a720\` |"
            echo "| LTO | \`${ENABLE_LTO:-false}\` |"
            echo "| Optimizasyon | release(-O3) + NDEBUG + gc-sections + lld -O2 |"
            echo "| Yama | **Yok — %100 saf upstream** |"
            echo "| Binary doğrulama | AArch64 + DYN + bionic-only + ICD sembolü |"
            echo "| Artifact | \`${ARTIFACT_BASE:-üretilmedi}\` |"
            echo "| Sonuç | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
