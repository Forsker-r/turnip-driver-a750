| 22 | Bağlayıcı optimizasyonu `-Wl,-O2` (lld) | Prompt alan 4; lld resmî bayrağı | Evet | Hayır | Çok düşük | **EVET** |
| 23 | `-Db_ndebug=if-release` — release'de `assert()` derlenmez (standart C release kuralı) | Prompt alan 4; **Varsayım V11** (§6.4 satırında b_ndebug geçmez, meson default'u korunmadı) | Evet | Hayır | Düşük | **EVET** (Varsayım-etiketli) |
| 24 | `-Dzstd=disabled -Dvalgrind=disabled` (auto-detection yerine sabit kapatma = deterministik yapılandırma) | Prompt alan 1 (bileşen kapatma); NDK'da zstd/valgrind bulunmaz → auto zaten kapalı sonuç verir; açık yazım determinizm sağlar (Varsayım V12) | Evet | Hayır | Çok düşük | **EVET** |

---

## 4. Tam build.yml

> Bu dosyanın birebir çalışır kopyası ayrıca **`build.yml`** olarak teslim edilmiştir (GitHub deposunda `.github/workflows/build.yml` konumuna konulmalıdır). YAML sözdizimi doğrulanmıştır (1 job / 15 step). Kaynak ağacını değiştiren hiçbir adım içermez; EK-1'deki hiçbir madde bu dosyada yer almaz.
> **Tetikleme notu (S: "workflow_dispatch gerekli mi?"):** Workflow, `push` (main dalı) **ve** `workflow_dispatch` ile çalışır. `build.yml` main dalına commit edilir edilmez derleme **otomatik** başlar; `workflow_dispatch` zorunlu DEĞİLDİR. Push tetiklemesinde workflow girdileri boş gelir ve `${{ inputs.x || 'varsayılan' }}` kalıbı sayesinde güvenli varsayılanlar (`stable` / `r26d` / SHA1 yok / LTO kapalı) uygulanır — dosyada ek değişiklik gerekmez. `workflow_dispatch` yalnızca Actions sekmesindeki "Run workflow" düğmesiyle girdi seçerek (mesa_ref / ndk_version / ndk_sha1 / enable_lto) manuel çalıştırma imkânı sağlar; tamamen silinebilir, ancak LTO/r30/tag denemeleri için dosya düzenlemek zorunda kalmamanızı sağlar.

```yaml
# =============================================================================
# turnip-driver-a750 — %100 resmî Mesa upstream Turnip derleme hattı
# Hedef: Snapdragon 8 Gen 3 / Adreno 750 (FD750 = a7xx_gen3, chip-id 0x43051401)
#
# GARANTİLER:
#  * Hiçbir yama/patch uygulanmaz (git apply / patch / sed / awk YOK).
#  * Mesa kaynak ağacında tek bir dosya bile değiştirilmez.
#  * Kaynak yalnızca resmî Mesa upstream'den (gitlab.freedesktop.org/mesa/mesa) alınır.
#  * Toolchain yalnızca resmî Android NDK'den (dl.google.com) alınır.
#  * Runtime davranış ayarları (TU_DEBUG, TU_AUTOTUNE_ALGO, TU_GMEM,
#    FD_DEV_FEATURES, driconf) build'e GÖMÜLMEZ — sürücü upstream varsayılanlarıyla çalışır.
#  * Paketlemeden önce binary doğrulaması: AArch64 + ELF DYN + yalnız bionic
#    bağımlılıkları (Turnip teknik dökümanı §5.2 paket doğrulama tablosu).
#  * Meson parametre çekirdeği, kanıtlanmış build parametreleridir
#    (Turnip md §6.4 — build_android.sh çekirdeği, docs/android.rst B4 ile aynı temel).
#  * Derleme-içi optimizasyon (YAMASIZ): release (-O3) + NDEBUG, ISA hedefleme
#    (-march=armv9.2-a -mtune=cortex-x4), function/data-sections + --gc-sections
#    (ölü kod ayıklama), linker -O2, unwind tablosu kırpma, statik libstdc++,
#    opsiyonel Thin LTO. Tümü derleyici/bağlayıcı bayrağıdır; kaynak ağacına
#    dokunulmaz; EK-1'deki hiçbir madde bu workflow'da uygulanmaz.
# =============================================================================

name: build-turnip-a750

on:
  push:
    branches: [ main ]
  # workflow_dispatch ZORUNLU DEĞİLDİR: build.yml main'e commit edilince push
  # tetikleyicisi derlemeyi OTOMATİK başlatır (girdiler güvenli varsayılanlara
  # düşer: stable / r26d / SHA1 yok / LTO kapalı). workflow_dispatch yalnızca
  # Actions sekmesindeki "Run workflow" düğmesiyle girdi seçerek manuel
  # çalıştırma imkânı verir; silinebilir ama deneme build'leri için faydalıdır.
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: >-
          Mesa kaynağı: 'stable' (en son resmî stable tag, dinamik tespit) |
          'main' (bleeding-edge; Turnip md §10.2 '-devel taban' riski) |
          doğrudan tag (örn. 26.2.4)
        required: false
        default: "stable"
        type: string
      ndk_version:
        description: >-
          Resmî Android NDK sürümü. Varsayılan 'r26d' — Turnip md §6.4/§6.1'de
          kanıtlanmış (bionic + KGSL). En güncel resmî alternatif: 'r30'.
        required: false
        default: "r26d"
        type: string
      ndk_sha1:
        description: >-
          NDK zip SHA1 (developer.android.com/ndk/downloads resmî değeri;
          boş bırakılırsa SHA1 doğrulaması atlanır ve uyarı basılır)
        required: false
        default: ""
        type: string
      enable_lto:
        description: >-
          Thin LTO aç. Varsayım: KAPALI — dokümanda LTO kanıtı yok; prompt alan 4
          izin verir; cihaz testi olmadan performans iddiası üretilmez.
        required: false
        default: false
        type: boolean
  # OPSİYONEL: haftalık otomatik derleme — açmak için yorum işaretlerini kaldırın
  # schedule:
  #   - cron: "0 4 * * 1"   # her Pazartesi 04:00 UTC

permissions:
  contents: read

concurrency:
  group: build-turnip-a750-${{ github.ref }}
  cancel-in-progress: true

env:
  # --- Yalnızca resmî kaynaklar (VERİ KAYNAĞI GÜVENLİĞİ kuralı) ---------------
  MESA_REPO: https://gitlab.freedesktop.org/mesa/mesa.git   # Resmî Mesa upstream (izinli tek Mesa kaynağı)
  NDK_URL_BASE: https://dl.google.com/android/repository    # Google'ın resmî NDK indirme kanalı
  # --- Turnip md §6.4 kanıtlanmış cross-file / platform değerleri -------------
  CROSS_API: "34"                # aarch64-linux-android34-clang
  PLATFORM_SDK_VERSION: "36"

jobs:
  build:
    name: Turnip (freedreno/KGSL) — yamasız upstream, aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # -----------------------------------------------------------------------
      # 1) Girdiler
      # -----------------------------------------------------------------------
      - name: "Girdiler: workflow parametrelerini ortam değişkenlerine aktar"
        run: |
          set -euo pipefail
          {
            echo "MESA_REF=${{ inputs.mesa_ref || 'stable' }}"
            echo "NDK_VERSION=${{ inputs.ndk_version || 'r26d' }}"
            echo "NDK_SHA1=${{ inputs.ndk_sha1 || '' }}"
            echo "ENABLE_LTO=${{ inputs.enable_lto || 'false' }}"
          } >> "$GITHUB_ENV"
          echo "mesa_ref : ${{ inputs.mesa_ref || 'stable' }}"
          echo "ndk      : ${{ inputs.ndk_version || 'r26d' }} (sha1 kontrolü: ${{ inputs.ndk_sha1 != '' && 'var' || 'yok' }})"
          echo "lto      : ${{ inputs.enable_lto || 'false' }}"

      # -----------------------------------------------------------------------
      # 2) Bu workflow'un barındığı deponun checkout'u (Mesa kaynağı DEĞİLDİR)
      # -----------------------------------------------------------------------
      - name: "Checkout: turnip-driver-a750 deposu"
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 3) Resmî NDK önbelleği (en büyük indirme maliyeti ~700 MB zip)
      # -----------------------------------------------------------------------
      - name: "Cache: resmî Android NDK arşivi/dizini"
        uses: actions/cache@v4
        with:
          path: ~/android-ndk
          key: ndk-linux-${{ env.NDK_VERSION }}-v1

      - name: "Toolchain: resmî Android NDK indir, doğrula ve aç (dl.google.com)"
        run: |
          set -euo pipefail
          NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          URL="${NDK_URL_BASE}/${NDK_ZIP}"
          NDK_ROOT="$HOME/android-ndk"
          mkdir -p "$NDK_ROOT"
          if [ ! -d "${NDK_ROOT}/android-ndk-${NDK_VERSION}" ]; then
            echo "İndiriliyor (resmî kanal): ${URL}"
            curl -fSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/${NDK_ZIP}" "$URL"
            if [ -n "${NDK_SHA1}" ]; then
              echo "${NDK_SHA1}  ${RUNNER_TEMP}/${NDK_ZIP}" | sha1sum -c - \
                || { echo "::error::NDK SHA1 doğrulaması BAŞARISIZ — arşiv resmî değil olabilir; job durduruluyor."; exit 1; }
            else
              echo "::warning::ndk_sha1 girdisi boş — SHA1 doğrulaması atlandı. Resmî değeri developer.android.com/ndk/downloads sayfasından alıp girdi olarak verebilirsiniz."
            fi
            unzip -q "$RUNNER_TEMP/${NDK_ZIP}" -d "$NDK_ROOT"
          else
            echo "NDK önbellekten kullanılıyor: ${NDK_ROOT}/android-ndk-${NDK_VERSION}"
          fi
          NDK_DIR="${NDK_ROOT}/android-ndk-${NDK_VERSION}"
          [ -f "${NDK_DIR}/source.properties" ] \
            || { echo "::error::NDK dizini beklendiği gibi değil: ${NDK_DIR}"; exit 1; }
          grep "^Pkg.Revision=" "${NDK_DIR}/source.properties" || true
          echo "NDK_DIR=${NDK_DIR}" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # 4) Derleme bağımlılıkları (yalnızca derleyici/kaynak oluşturma araçları;
      #    bunlar Mesa kaynak ağacına SOKULMAZ)
      # -----------------------------------------------------------------------
      - name: "Bağımlılıklar: meson/ninja/python modülleri ve doğrulama araçları"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config \
            python3-mako python3-yaml python3-ply \
            flex bison \
            unzip zip jq curl file binutils git
          echo "meson : $(meson --version)"
          echo "ninja : $(ninja --version)"
          echo "jq    : $(jq --version)"

      # -----------------------------------------------------------------------
      # 5) Dinamik sürüm tespiti — yalnız resmî GitLab API + ls-remote fallback
      #    Stable tag = ^X.Y.Z$ (rc tag'leri dışlanır; Turnip md §1.4/§10.2 gerekçe)
      # -----------------------------------------------------------------------
      - name: "Sürüm tespiti: en son resmî Mesa stable tag (dinamik)"
        run: |
          set -euo pipefail
          TAG=""
          if [ "${MESA_REF}" = "stable" ]; then
            API="https://gitlab.freedesktop.org/api/v4/projects/mesa%2Fmesa/releases?per_page=50"
            echo "Resmî GitLab releases API sorgulanıyor: ${API}"
            TAG="$(curl -fsSL --retry 3 --retry-delay 5 "${API}" \
              | jq -r '[.[].tag_name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | .[0]' || true)"
            if [ -z "${TAG}" ]; then
              echo "::warning::Releases API yanıt vermedi (GitLab bot-doğrulama duvarı olabilir) — git ls-remote fallback kullanılıyor."
              TAG="$(git ls-remote --tags --refs "${MESA_REPO}" \
                | awk -F/ '{print $NF}' \
                | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V | tail -n1 || true)"
            fi
          elif [ "${MESA_REF}" = "main" ]; then
            echo "::warning::'main' seçildi — Turnip md §10.2'deki '-devel taban' stabilite riski kullanıcıya aittir."
            TAG="main"
          else
            TAG="${MESA_REF}"
            echo "Kullanıcı tag'i zorunlu kılındı: ${TAG} (resmî depoda varlığı clone adımında doğrulanacak)"
          fi
          [ -n "${TAG}" ] || { echo "::error::Mesa sürümü tespit edilemedi — resmî repo erişilemiyor olabilir."; exit 1; }
          echo "Seçilen Mesa kaynağı: ${TAG}"
          echo "MESA_TAG=${TAG}" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # 6) Kaynak indirme — yalnızca resmî upstream. Bu adımdan SONRA kaynak
      #    ağacını DEĞİŞTİREN HİÇBİR ADIM BULUNMAMAKTADIR (tasarım gereği).
      # -----------------------------------------------------------------------
      - name: "Kaynak: resmî Mesa upstream clone (shallow, tag/branch)"
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${MESA_TAG}" "${MESA_REPO}" mesa-src \
            || { echo "::error::Clone başarısız: ${MESA_REPO} @ ${MESA_TAG} — tag resmî depoda yok olabilir."; exit 1; }
          COMMIT="$(git -C mesa-src rev-parse HEAD)"
          echo "Mesa kaynak commit: ${COMMIT}"
          echo "MESA_COMMIT=${COMMIT}" >> "$GITHUB_ENV"
          # Kaynak saflığı denetimi: çalışma ağacı temiz olmalı (bilgi + koruma)
          if [ -n "$(git -C mesa-src status --porcelain)" ]; then
            echo "::error::Kaynak ağacı beklemedik şekilde kirli — kaynak saflığı bozulmuş."
            git -C mesa-src status --porcelain
            exit 1
          fi
          echo "Kaynak saflığı: temiz (saf upstream, yamasız)"

      - name: "Üstveri: sürüm + build tarihi + commit hash (artifact adına gömülecek)"
        run: |
          set -euo pipefail
          BUILD_DATE="$(date -u +%Y%m%d-%H%M)"
          COMMIT_SHORT="${MESA_COMMIT::7}"
          echo "BUILD_DATE=${BUILD_DATE}"        >> "$GITHUB_ENV"
          echo "COMMIT_SHORT=${COMMIT_SHORT}"    >> "$GITHUB_ENV"
          echo "ARTIFACT_BASE=Turnip-upstream-${MESA_TAG}-${COMMIT_SHORT}-${BUILD_DATE}" >> "$GITHUB_ENV"
          echo "Artifact adı öneki: Turnip-upstream-${MESA_TAG}-${COMMIT_SHORT}-${BUILD_DATE}"

      # -----------------------------------------------------------------------
      # 7) Meson yapılandırma
      #    Çekirdek parametre seti: Turnip md §6.4 kanıtlanmış satırları.
      #    Ekler yalnızca: (a) bileşen kapatma (prompt alan 1),
      #                    (b) ISA hedefleme (CPU/GPU md §2.1-§2.3),
      #                    (c) --wrap-mode=nofallback (kaynak saflığı),
      #                    (d) derleyici/bağlayıcı optimizasyon bloğu
      #                        (yamasız clang/lld bayrakları — rapor katalog 21-24).
      # -----------------------------------------------------------------------
      - name: "Meson: cross-file + kanıtlanmış parametrelerle yapılandır"
        run: |
          set -euo pipefail
          export PATH="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin:${PATH}"
          CROSS="${NDK_DIR}/build/meson/aarch64-linux-android${CROSS_API}-clang"
          if [ ! -f "${CROSS}" ]; then
            echo "::error::NDK meson cross-file bulunamadı: ${CROSS}"
            echo "Mevcut cross-file'lar:"; ls -1 "${NDK_DIR}/build/meson" || true
            exit 1
          fi
          # CPU hedefleme — CPU/GPU md §2.1: tüm çekirdekler (X4/A720/A520) ARMv9.2-A,
          # §2.3: TuneX4 füzyon davranışları. -march imli ISA setini verir;
          # -mtune yalnızca zamanlama sezgilerini etkiler (doğruluk riski yok).
          ARCH_ARGS="-march=armv9.2-a -mtune=cortex-x4"
          # Turnip md §6.4 — kanıtlanmış CXXFLAGS satırı; C karşılığı Varsayım'dır.
          C_ARGS="-fno-unwind-tables -fno-asynchronous-unwind-tables ${ARCH_ARGS}"
          CPP_ARGS="-fno-exceptions ${C_ARGS}"
          # --- Derleme-içi optimizasyon bloğu (YAMASIZ; yalnız clang/lld bayrakları) ---
          # * -ffunction-sections/-fdata-sections: kod ve veriyi ince bölümlere
          #   ayırır; bağlayıcı --gc-sections, .so içinde hiçbir yoldan erişilmeyen
          #   bölümleri atar (ölü kod ayıklama). Export edilen ICD sembolleri GC
          #   kökü olduğundan giriş noktaları asla atılmaz.
          # * -Wl,-O2: lld bağlayıcı optimizasyonu (string birleştirme vb.).
          # * release buildtype zaten -O3 üretir; NDEBUG (b_ndebug=if-release)
          #   standart release kuralı olarak assert() yükünü kaldırır (rapor V11).
          OPT_C_ARGS="-ffunction-sections -fdata-sections"
          OPT_LINK_ARGS="-Wl,--gc-sections -Wl,-O2"
          C_ARGS="${C_ARGS} ${OPT_C_ARGS}"
          CPP_ARGS="${CPP_ARGS} ${OPT_C_ARGS}"
          LTO_ARGS=()
          if [ "${ENABLE_LTO}" = "true" ]; then
            LTO_ARGS=(-Db_lto=true -Db_lto_mode=thin)
            echo "Thin LTO İSTEĞİYLE derlenecek (Varsayım — dokümanda LTO kanıtı yok)."
          fi
          meson setup build mesa-src \
            --wrap-mode=nofallback \
            --cross-file "${CROSS}" \
            -Dbuildtype=release \
            -Dstrip=true \
            -Dplatforms=android \
            -Dplatform-sdk-version=${PLATFORM_SDK_VERSION} \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-beta=true \
            -Dfreedreno-kmds=kgsl \
            -Degl=disabled \
            -Dvideo-codecs= \
            -Dllvm=disabled \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dosmesa=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dzstd=disabled \
            -Dvalgrind=disabled \
            -Dc_args="${C_ARGS}" \
            -Dcpp_args="${CPP_ARGS}" \
            -Dc_link_args="${OPT_LINK_ARGS}" \
            -Dcpp_link_args="-static-libstdc++ ${OPT_LINK_ARGS}" \
            -Db_ndebug=if-release \
            "${LTO_ARGS[@]}"
          meson configure build | tee meson-config.txt

      # -----------------------------------------------------------------------
      # 8) Derleme
      # -----------------------------------------------------------------------
      - name: "Derle: ninja"
        run: |
          set -euo pipefail
          ninja -C build
          echo "Derleme tamamlandı."

      # -----------------------------------------------------------------------
      # 9) Çıktıyı konumlandır
      # -----------------------------------------------------------------------
      - name: "Çıktı: libvulkan_freedreno.so konumlandırma"
        run: |
          set -euo pipefail
          SO="$(find build -type f -name 'libvulkan_freedreno.so' | head -n1)"
          if [ -z "${SO}" ]; then
            echo "::error::libvulkan_freedreno.so üretilmedi — build ağacındaki paylaşımlı nesneler:"
            find build -name '*.so' -o -name '*.a' | head -50
            exit 1
          fi
          echo "Üretilen sürücü: ${SO}"
          ls -lh "${SO}"
          echo "SO_PATH=${SO}" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # 10) Binary doğrulama — Turnip md §5.2 paket doğrulama tablosu:
      #     AArch64 + DYN + bionic NEEDED. Geçmezse job anlamlı hatayla durur.
      # -----------------------------------------------------------------------
      - name: "Doğrulama: AArch64 + DYN + bionic-only + ICD giriş noktası"
        run: |
          set -euo pipefail
          SO="${SO_PATH}"
          FAIL=0
          FILE_OUT="$(file -b "${SO}")"
          echo "file        : ${FILE_OUT}"
          echo "boyut       : $(stat -c '%s bayt' "${SO}")"
          if ! echo "${FILE_OUT}" | grep -q "ARM aarch64"; then
            echo "::error::Doğrulama[1/5] HATA: Mimari AArch64 değil (file çıktısı yukarıda)."; FAIL=1
          fi
          HDR="$(readelf -h "${SO}")"
          echo "${HDR}" | sed -n '1,14p'
          if ! echo "${HDR}" | grep -Eq 'Machine:[[:space:]]*AArch64'; then
            echo "::error::Doğrulama[2/5] HATA: ELF Machine AArch64 değil."; FAIL=1
          fi
          if ! echo "${HDR}" | grep -Eq 'Type:[[:space:]]*DYN'; then
            echo "::error::Doğrulama[3/5] HATA: ELF tipi DYN (paylaşımlı nesne) değil."; FAIL=1
          fi
          NEEDED="$(readelf -d "${SO}" | awk '/\(NEEDED\)/{print $NF}' | tr -d '[]')"
          echo "NEEDED      : ${NEEDED:-yok}"
          if ! echo "${NEEDED}" | grep -qx 'libc.so'; then
            echo "::error::Doğrulama[4/5] HATA: bionic 'libc.so' bağlantısı yok (Turnip md §5.2: NEEDED libc.so beklenir)."; FAIL=1
          fi
          if echo "${NEEDED}" | grep -Eq '^(libc\.so\.6|libstdc\+\+\.so\.6|libgcc_s\.so\.1|libc\+\+_shared\.so)$'; then
            echo "::error::Doğrulama[5/5] HATA: glibc/paylaşımlı libc++ bağımlılığı tespit edildi — Android bionic paketi olamaz."; FAIL=1
          fi
          if ! readelf -W --dyn-syms "${SO}" | grep -qw 'vk_icdGetInstanceProcAddr'; then
            echo "::error::Ek kontrol HATA: ICD giriş noktası 'vk_icdGetInstanceProcAddr' dışa aktarılmıyor — sürücü yüklenebilir olmaz."; FAIL=1
          fi
          echo "Android notu: $(readelf -n "${SO}" | grep -i android | head -n2 || echo 'yok')"
          if [ "${FAIL}" -ne 0 ]; then
            echo "::error::Binary doğrulama BAŞARISIZ — job durduruluyor (hatalı çıktı paketlenmez/yayınlanmaz)."
            exit 1
          fi
          echo "Binary doğrulama TAMAM: AArch64 + DYN + bionic-only + ICD simgesi ✓"

      # -----------------------------------------------------------------------
      # 11) Paketleme — AdrenoTools uyumlu zip + meta.json (Turnip md §5.2 alanları)
      #     NOT: Bu dosyalar Mesa kaynak ağacının DIŞINDA (dist/) üretilir.
      # -----------------------------------------------------------------------
      - name: "Paketle: AdrenoTools zip + meta.json + BUILD-INFO + SHA256"
        run: |
          set -euo pipefail
          mkdir -p dist/turnip artifacts
          cp "${SO_PATH}" dist/turnip/libvulkan_freedreno.so
          cat > dist/turnip/meta.json <<EOF
          {
            "schemaVersion": 1,
            "name": "Turnip Upstream A750",
            "description": "Unmodified Mesa Turnip (freedreno Vulkan, KGSL-only) for Adreno 750 — built from official upstream ${MESA_TAG} (${COMMIT_SHORT}), no patches applied",
            "author": "turnip-driver-a750 CI (source: gitlab.freedesktop.org/mesa/mesa)",
            "packageVersion": "1",
            "vendor": "Mesa",
            "driverVersion": "Upstream ${MESA_TAG} (${COMMIT_SHORT})",
            "minApi": 29,
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF
          jq . dist/turnip/meta.json >/dev/null || { echo "::error::meta.json geçersiz JSON"; exit 1; }
          cat > dist/BUILD-INFO.txt <<EOF
          Mesa tag          : ${MESA_TAG}
          Mesa commit       : ${MESA_COMMIT}
          Mesa repo         : ${MESA_REPO} (resmî upstream)
          Build tarihi (UTC): ${BUILD_DATE}
          NDK               : ${NDK_VERSION} ($(grep '^Pkg.Revision=' "${NDK_DIR}/source.properties" | cut -d= -f2))
          Cross-file        : aarch64-linux-android${CROSS_API}-clang
          ISA hedefleme     : -march=armv9.2-a -mtune=cortex-x4 (CPU/GPU md §2.1-§2.3)
          Optimizasyon      : release(-O3) + NDEBUG + function/data-sections + gc-sections + linker -O2
          LTO               : ${ENABLE_LTO}
          Yama durumu       : HİÇBİR yama uygulanmadı — kaynak %100 saf upstream
          Runtime env       : Gömülmedi (TU_DEBUG/TU_AUTOTUNE_ALGO/TU_GMEM/FD_DEV_FEATURES/driconf yok)
          Workflow          : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          cp dist/BUILD-INFO.txt artifacts/BUILD-INFO.txt
          ( cd dist && zip -qr "../artifacts/${ARTIFACT_BASE}.zip" turnip )
          ( cd artifacts && sha256sum "${ARTIFACT_BASE}.zip" > SHA256SUMS.txt )
          echo "--- artifacts/ ---"; ls -lh artifacts
          echo "--- zip içeriği ---"; unzip -l "artifacts/${ARTIFACT_BASE}.zip"

      # -----------------------------------------------------------------------
      # 12) Artifact yükleme (GitHub Release adımı BİLİNÇLİ OLARAK YOKTUR)
      # -----------------------------------------------------------------------
      - name: "Artifact: yükle (Turnip-upstream-<tag>-<sha>-<tarih>)"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASE }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      # -----------------------------------------------------------------------
      # 13) İş özeti — anlamlı, ayrıştırılabilir log
      # -----------------------------------------------------------------------
      - name: "Özet: GitHub Step Summary"
        if: always()
        run: |
          {
            echo "## Turnip (Adreno 750) — upstream derleme özeti"
            echo ""
            echo "| Alan | Değer |"
            echo "|---|---|"
            echo "| Mesa kaynağı | ${MESA_TAG:-bilinmiyor} (${MESA_COMMIT:-bilinmiyor}) |"
            echo "| NDK | ${NDK_VERSION:-bilinmiyor} |"
            echo "| LTO | ${ENABLE_LTO:-false} |"
            echo "| Optimizasyon | -O3 + NDEBUG + gc-sections + ISA hedefleme |"
            echo "| Yama | Yok — %100 saf upstream |"
            echo "| Binary doğrulama | AArch64 + DYN + bionic-only |"
            echo "| Artifact | ${ARTIFACT_BASE:-üretilmedi} |"
            echo "| Sonuç | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
```

## 5. Build.yml adım gerekçeleri

| Step | Ad | Gerekçe (doküman dayanağı) |
|---|---|---|
| 1 | Girdiler | `workflow_dispatch` girdileri ortam değişkenine yazılır; push tetiklemelerinde güvenli varsayılanlar (`stable`, `r26d`, LTO kapalı) devreye girer. LTO kapalı = muhafazakâr (Varsayım V5; prompt alan 4 izinli). |
| 2 | Checkout | Yalnız bu workflow'un bulunduğu depo; Mesa kaynağıyla karışmaz. `actions/checkout@v4` tag-pinned (prompt: "Action'lar commit/tag ile pinned"; SHA-pinleme Bölüm 12'de iyileştirme maddesi). |
| 3 | Cache + NDK indirme | Resmî `dl.google.com` kanalı (prompt izinli kaynak); opsiyonel SHA1 gate (web doğrulamasından r30 SHA1 örneği raporlanmıştır); `source.properties` varlık kontrolü. Cache anahtarı sürüme bağlı → güvenli invalidasyon (prompt "cache" kuralı). |
| 4 | Bağımlılıklar | Meson/ninja/mako/yaml/ply/flex/bison — Mesa'nın resmî Android tarifi (docs/android.rst, Turnip md B4) gereksinimleri; bunlar kaynak ağacına **sokulmaz** (kural ayrımı). |
| 5 | Sürüm tespiti | Stable = `^X.Y.Z$` regex (rc tag'leri dışlanır) — Turnip md §1.4/§10.2 gerekçesi; resmî GitLab releases API + resmî depoya `ls-remote` fallback (§1.3'teki GitLab bot-duvarı gözlemiyle uyumlu). Hardcoded sürüm yok (prompt kuralı). |
| 6 | Clone + purity check | Yalnız `gitlab.freedesktop.org/mesa/mesa.git` (izinli tek Mesa kaynağı); shallow + tag; `git status --porcelain` boşluğu = saflık kanıtı; commit hash `rev-parse` ile alınır ve tüm çıktıya gömülür (prompt: hash doğrulama). |
| 7 | Üstveri | Sürüm + tarih(UTC) + kısa hash artifact adına ve BUILD-INFO'ya gömülür (prompt gereksinimi). |
| 8 | Meson setup | §6.4 kanıtlanmış çekirdek birebir; eklemeler katalog 10–13 (bileşen kapama, ISA, nofallback) **ve 21–24** (ölü kod ayıklama, linker -O2, NDEBUG, zstd/valgrind sabit kapama) kalemleri; cross-file resmî NDK artefaktı (`build/meson/aarch64-linux-android34-clang`, §6.4); yokluğunda mevcut listeyle anlamlı hata. `meson configure` çıktısı log'a yazılır (ayrıştırılabilir log). |
| 9 | ninja | Standart derleme; tüm kapamalar (GL/EGL/video/LLVM) kapalı olduğundan küçük ve hızlı derleme. |
| 10 | Çıktı konumlandırma | `libvulkan_freedreno.so` bulunamazsa build ağacı dökümüyle anlamlı hata (prompt: anlamlı log). |
| 11 | Binary doğrulama | Turnip md §5.2 tablosunun otomatikleştirilmiş hâli + ICD giriş noktası (Varsayım V7). Başarısızlıkta job `::error::` ile durur — hatalı çıktı paketlenmez (prompt kuralı). |
| 12 | Paketleme | §5.2 alan tablosuna birebir `meta.json` (jq ile şema kontrolü); zip Mesa ağacının DIŞINDA (`dist/`) üretilir → kaynak saflığı korunur; SHA256SUMS + BUILD-INFO izlenebilirliği. |
| 13 | Artifact upload | Ad = `Turnip-upstream-<tag>-<sha7>-<UTC tarih>` (prompt: sürüm/tarih/hash gömme); Release adımı kullanıcı tercihiyle YOK. |
| 14 | Step summary | Her koşulda (`if: always()`) ayrıştırılabilir özet — prompt: anlamlı log. |

