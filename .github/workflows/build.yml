# turnip-driver-a750 — Turnip Build Denetimi, Güvenli Optimizasyon Raporu ve Patch Araştırma Listesi

**Rapor türü:** prompt-v4.md gereğince üretilen tam denetim raporu (13 bölüm)
**Hedef SoC/GPU:** Snapdragon 8 Gen 3 (SM8650) / Adreno 750 — `a7xx_gen3`, `FD750`, KGSL chip-id `0x43051401`
**Referans dokümanlar:** `snapdragon-8-gen-3-turnip-teknik-dokumantasyon.md` (aşağıda "Turnip md"), `snapdragon_8_gen_3_cpu_gpu_teknik_dokumantasyon.md` (aşağıda "CPU/GPU md")
**Rapor tarihi:** 2026-10-24
**Ana çıktı:** `build.yml` (Bölüm 4'te tam metin + ayrı dosya) — **Patch Araştırma Listesi (EK-1) bu raporda ayrı bölüm olarak tutulur; build.yml'ye hiçbir maddesi sızmamıştır.**

---

## 1. Kısa yürütücü özeti

- **Mevcut durum denetimi:** `turnip-driver-a750` deposunda incelenebilir bir build.yml sunulmadığı için denetim tabanı olarak, Turnip md §6.4'te birincil kaynaktan belgelenen **tipik paketleyici hattı** (Droid-Deck `build_android.sh` çekirdeği + K11MCH1 varyant modeli) alındı. Bu hattın çekirdek meson parametre seti kanıtlanmış ve sağlamdır; ancak tipik paketleyicilerin üç zayıflığı tespit edildi: (1) `-devel`/`main` tabanlı derleme (Turnip md §10.2 riski), (2) downstream yama setlerine bağımlılık (§6.4), (3) binary/paket doğrulaması ve izlenebilirlik eksikliği (§5.2 kriterleri CI'da otomatik uygulanmıyor).
- **Üretilen build.yml** bu zayıflıkları kaynak saflığını bozmadan kapatır: %100 resmî Mesa upstream (`gitlab.freedesktop.org/mesa/mesa`), dinamik **stable tag** tespiti (web doğrulaması: 26.2.4, 2026-10-01; doküman §1.4: 26.2.0/2026-08-05), resmî NDK (varsayılan `r26d` — Turnip md §6.4 kanıtı; `r30` resmî güncel alternatif), Turnip md §6.4'teki kanıtlanmış meson parametre seti, CPU/GPU md §2.1–§2.3'ten gerekçelendirilmiş `-march=armv9.2-a -mtune=cortex-x4`, §5.2 tablosundaki binary doğrulama (AArch64 + DYN + bionic-only) ve meta.json paketleme (§5.2 alan tablosu).
- **Kesinlikle yasak olanlar** build.yml'de yok: patch/`git apply`/`sed`-`awk`, üçüncü taraf script'ler, `TU_DEBUG`/`TU_AUTOTUNE_ALGO`/`TU_GMEM`/`FD_DEV_FEATURES`/driconf gibi runtime ayarlarının gömülmesi. Sürücü upstream varsayılanlarıyla (autotuner dahil) çalışır — bu bilinçli bir tercihtir (bkz. Bölüm 9).
- **Patch Araştırma Listesi (EK-1)** 18 madde ile ayrı bölümde raporlanır; PWR_MAX, UBWC swapchain, gralloc UBWC tespiti, process-heap usage, autotune çarpanı, DECK_EMU, mesh shader öykünmesi vb. — hepsi "Hayır, build.yml'de uygulanamaz" statüsünde.
- **"Daha iyi" iddiası** yalnızca şu beş ayak üzerine kurulmuştur: kaynak saflığı (değiştirilmemiş upstream ağacı + purity check), doğrulanabilirlik (tag + commit hash + NDK SHA1 opsiyonu + SHA256SUMS + BUILD-INFO), stabilite (stable tag, rc dışlama), doğru hedefleme (KGSL-only KMD, a750-only kapsamı, ARMv9.2-A ISA) ve gereksiz bileşenlerin kapatılması (GL/EGL/video/LLVM kapalı). Cihaz testi yapılmadan kesin performans iddiası üretilmez.

---

## 2. Keşif Soruları Cevapları

**S1. Dokümanlardaki hangi bilgi mevcut/tipik Turnip build'lerinde kullanılmıyor? (≥3 örnek)**

1. **Stable tag tabanlı tazelik:** Turnip md §1.4 (sürüm/tazelik tablosu) ve §10.2 ("-devel taban" riski) gösteriyor ki topluluk paketleri çoğunlukla `main`/`-devel`'den derler (K11MCH1 rc08 = 26.0.0-devel; stabil çıkışı 2026-02-11). Stable tag temelli dinamik sürüm tespiti tipik hatlarda yoktur — build.yml bunu ekler.
2. **§5.2 paket doğrulama tablosu:** `readelf -h → AArch64 + DYN`, `readelf -d → NEEDED libc.so (bionic)` kontrolü dokümanda açıkça tarif edilir; tipik paketleyici CI'ları bu kontrolü otomatikleştirmez (Droid-Deck'in yalnızca PWR_MAX yamasını string ile aradığı §6.4'te belgeli). Build.yml bu kontrolü zorunlu gate yapar.
3. **§6.4 kanıtlanmış CXXFLAGS seti** (`-fno-exceptions -fno-unwind-tables -fno-asynchronous-unwind-tables -static-libstdc++`): yalnızca Droid-Deck build script'inde var; genel "typical" hatlarda (`vulkan-drivers=freedreno -Dfreedreno-kmds=kgsl` + default flagler) bu flag seti ve `-Dstrip=true` atlanır.
4. **KGSL kısıtlarının sürüm stratejisine etkisi:** Turnip md §5.3 (KGSL'de `is_perf_cntr_selectable=false` → `VK_KHR_performance_query` kapalı, autotuner `preempt_optimize` kapalı) ve §4.2 — tipik hatlar bu kısıtları bilmeden DRM hedefli meson kombinasyonları deneyebilir; build.yml bunu `-Dfreedreno-kmds=kgsl` ile tek doğru hedefe indirger.
5. **CPU/GPU md §2.1–§2.3 ISA/Tune verisi:** hiçbir paketleyicinin (§6 aktörleri) build'i `-march/-mtune` hedeflemesi yapmaz; hepsi NDK default (`generic`) bırakır.

**S2. -mcpu/-march seçiminde CPU/GPU dokümanındaki ISA ve Tune bilgileri tam olarak yansıtıldı mı? Hangi FEAT_* build'e giriyor/girmiyor ve neden?**

- **Girenler (imli olarak):** `-march=armv9.2-a` seçildi — CPU/GPU md §2.1'e göre Prime (Cortex-X4), Gold (2×A720+3×A720), Silver (2×A520) **tümü ARMv9.2-A** ve yalnızca AArch64 (§2.1 "Donanımsal AArch32 (EL0) desteği: Yok"). ARMv9.2-A mimari tabanı ≈ ARMv8.7-A özellik setidir; dolayısıyla §2.2 tablosundaki `FEAT_FP16`, `FEAT_FHM`, `FEAT_DotProd`, `FEAT_RDM`, `FEAT_FCMA`, `FEAT_JSCVT`, `FEAT_FRINTTS`, `FEAT_BF16` (v8.6), `FEAT_I8MM` (v8.6), `FEAT_LSE`/`LSE2`, `FEAT_LRCPC/LRCPC2`, `FEAT_DPB/DPB2`, `FEAT_FlagM/FlagM2`, `FEAT_SB/SSBS2`, `FEAT_PAuth/FPAC`, `FEAT_BTI`, `FEAT_CRC32`, `FEAT_AES/SHA1/SHA256/SHA512/SHA3/SM3/SM4`, `FEAT_AFP/RPRES` (v8.7) derleyicinin kullanımına **imli olarak** açılır. Bunları tek tek `+bf16 +i8mm ...` yazmak gerekmez ve yazılmadı (gereksiz, hataya açık).
- **Girmeyenler ve gerekçeleri:** (1) **`FEAT_SVE/SVE2`** (§2.2-B: üç çekirdekte de 128-bit) — mimari tabanda zorunlu değildir; açık `+sve2` vermek autovektörleştirme ile sürücü kodunda doküman-supported olmayan bir fayda/risk dengesi yaratır; "en muhafazakâr seçenek" kuralı gereği dışarıda (Varsayım). (2) **`FEAT_MOPS/HBC/CSSC/LSE128/LRCPC3`** (§2.4: bu çekirdeklerde YOK) — `armv9.2-a` bunları imlemez; tutarlılık doğrulandı. (3) **`FEAT_SME/SME2`, `FEAT_RNG`, `FEAT_RME`, `SVE_F32MM/F64MM`** (§2.4) — donanımda yok; girmez. (4) **`FEAT_SPE/SPEv1p2`** (§2.2-F) — profilleme birimi, kod üretimiyle ilgisi yok.
- **Tune tarafı:** `-mtune=cortex-x4` — gerekçe CPU/GPU md §2.1 (X4 = tek prime, 10-wide, 384 girdili ROB; render/emülasyon iş parçacıkları Android planlayıcısında prime+big çekirdeklere yerleşir) ve §2.3 (LLVM `TuneX4`: `FeatureFuseAES/FuseAdrpAdd/FuseCmpCSel/FuseCmpCSet/ALULSLFast/AvoidLDAPUR` davranışları). `-mtune` yalnızca zamanlama sezgisidir, kod doğruluğunu değiştirmez → A520/A720'de çalışma riski yoktur. Bu iki flag dokümandan **doğrudan flag önerisi olarak çıkmaz**; ISA tablosundan türetilmiş bir **Varsayım**-etiketli değerlendirmedir (bkz. Bölüm 8, V4).

**S3. Turnip md §6.4 kanıtlanmış parametrelerle karşılaştırıldığında güvenli şekilde eklenebilecek hangi meson -D seçeneği var?**

§6.4 çekirdeği (`buildtype=release, strip, platforms=android, platform-sdk-version=36, android-stub, android-libbacktrace=disabled, gallium-drivers=, vulkan-drivers=freedreno, vulkan-beta=true, freedreno-kmds=kgsl, egl=disabled, video-codecs=` + CXXFLAGS seti) aynen korundu. Güvenli eklemeler (hepsi resmî Mesa meson seçenekleri; "Gereksiz tüm bileşenlerin kapatılması" — prompt alan 1): **`-Dllvm=disabled`** (freedreno Vulkan ir3 derleyicisi LLVM gerektirmez; §3.3'te mesa OpenCL/Zink dışı yol zaten kapalı), **`-Dglx=disabled -Dgbm=disabled -Dosmesa=disabled -Dgles1=disabled -Dgles2=disabled`** (gallium-drivers zaten boş — §6.4; bunlar yalnızca deterministik kapatma sağlar) ve meson anahtarı **`--wrap-mode=nofallback`** (subproject/wrap indirme riskini sıfırlar; VERİ KAYNAĞI GÜVENLİĞİ kuralının derleme-zamanı karşılığı — Turnip md §1.3 kaynak disiplini). **LTO** (`-Db_lto=true -Db_lto_mode=thin`) prompt alan 4'ün izinli kaldıracıdır ama dokümanda kanıt yoktur → **girdi olarak sunuldu, varsayılan KAPALI** (muhafazakâr).

**S4. NDK/toolchain seçiminde dokümanlar ne diyor, hangi noktada "Varsayım" yapılıyor?**

- Doküman (Turnip md §6.4 + §6.1): Droid-Deck Android paketi **NDK r26d, bionic, KGSL**, cross-file `aarch64-linux-android34-clang`, `platform-sdk-version=36`; resmî Mesa tarifi `docs/android.rst` (B4) ile aynı çekirdek.
- **Web doğrulaması (2026-10-24):** en güncel resmî stabil NDK **r30** (2026-09-08; `android-ndk-r30-linux.zip`, 738.633.529 bayt, SHA1 `5107f898313790e449e87eee2183d9a20602dee9`, LLVM clang-r574158c, max API 37) — `developer.android.com/ndk/downloads` + `github.com/android/ndk/releases` (her ikisi resmî).
- **Varsayım:** (1) default `r26d` seçildi, çünkü doküman bu sürümün **güncel Mesa main'i (2026-10-19 commit'li) derlediğini** A sınıfı kanıtla gösteriyor (§6.1); r30 için mesa-turnip'e özgü doğrulama yok → girdi ile yükseltilebilir. (2) `r26d` clang'ının (LLVM 17) `-march=armv9.2-a`/Cortex-X4 desteği — dokümanda belirtilmez; LLVM 15+ desteği genel bilgidir → **Varsayım**, risk düşük. (3) NDK'nın resmî meson cross-file'larının `$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin` yolunun PATH'te olmasını istediği — resmî NDK davranışı, doküman dışı → **Varsayım**.

**S5. "En güncel stabil sürüm" hedefi nasıl en iyi sağlanır — main mi, stable tag mı?**

**Stable tag** (dinamik tespitle). Gerekçe dokümandan: Turnip md §10.2 "-devel taban" riski (topluluk paketlerinin çoğu main'den derler; regresyon örnekleri: rc.03 perf regresyonu, `KHR_8bit_storage` geri çekilmesi — §10.2 tablosu); §1.4 sürüm tablosu (26.2.0 = 2026-08-05 stabil); §7.1 gösteriyor ki main'deki değerli kalemler (yeni autotuner 26.1.0, concurrent binning 26.0.0, sparse residency 25.3.0, a750 RT workaround 25.0) **zaten stable 26.2 serisine düşmüş durumda** — main'e gitmenin Adreno 750 için ek getirisi dokümanda raporlanmamıştır. Web doğrulaması: en güncel stabil 26.2.4 (2026-10-01, docs.mesa3d.org). `main` opsiyonu yine de workflow girdisi olarak vardır (Turnip md §6.1 Droid-Deck günlük-derleme modelinin karşılığı) ve seçildiğinde açık uyarı basar.

**S6. Paketleme doğrulamasında AArch64 + DYN, bionic bağımlılıkları ve meta.json kontrolleri yeterli mi? Eksik kontrol var mı?**

Turnip md §5.2 üçlüsü (AArch64+DYN, NEEDED bionic, platform işaretleri) temel ama tek başına yeterli değil. Build.yml'ye eklenen kontroller: (1) **ICD giriş noktası** `vk_icdGetInstanceProcAddr` dyn-sym kontrolü (yoksa sürücü ICD olarak yüklenemez — genel ICD bilgisi, Varsayım etiketiyle); (2) **`.note.android.ident`** API seviyesinin log'a yazılması (bilgi amaçlı); (3) **meta.json şema kontrolü** (jq ile geçerli JSON + §5.2 alan seti); (4) **SHA256SUMS** üretimi; (5) zip içerik listesi log'u; (6) BUILD-INFO ile tag+commit+tarih izlenebilirliği. Hâlâ eksik kalan ve bilinçli olarak CI dışında bırakılan: cihaz-üstü `vulkaninfo` doğrulaması (§11.1 — CI'da cihaz yoktur) ve `-devel`/stable farkına dair çalışma-zamanı regresyon testi.

**S7. Cache stratejisinde build süresini kısaltacak güvenli fırsatlar neler?**

(1) **NDK cache** — en büyük sabit maliyet (~700 MB zip, ~2,5 GB açık); `actions/cache@v4`, anahtar NDK sürümüne bağlı → sürüm değişince cache otomatik geçersizleşir. (2) **Shallow clone** (`--depth 1 --branch`) — Mesa deposunun tam geçmişi indirilmez; doğrulanabilirlik `rev-parse HEAD` ile korunur. (3) apt/meson adımları önemsiz süredir. (4) Bilinçli olarak eklenmeyen: **ccache** — cross-clang + NDK cross-file ile ek karmaşıklık/kirli-cache riski taşır; build tek tag için ~10–20 dk'dır; getirisi sınırlıdır (Bölüm 12, iyileştirme noktası).

**S8. Kaynak saflığını bozmadan daha iyi performans için başka hangi güvenli kaldıraç var?**

(a) **Doğru hedefleme performansın kendisidir:** `-Dfreedreno-kmds=kgsl` KGSL yolu dışındaki kodu derlemez (Turnip md §5.3 — Android'de yalnız KGSL geçerli); `gallium-drivers=`/`egl=disabled`/`video-codecs=`/`llvm=disabled` sürücünün ihtiyaç duymadığı her şeyi çıkarır (§6.4). (b) **§6.4 flag seti**: unwind tablosu kırpma + static libstdc++ = daha küçük/daha az dolaylı .so (§5.2 bionic kriterini doğal olarak sağlar). (c) **ISA hedefleme** (S2). (d) **Stable 26.2 tabanı**: 26.x serisinin Adreno 750 performans kalemleri (yeni autotuner — §7.1/26.1.0; concurrent binning — 26.0.0; sparse residency — 25.3.0) bu build'de **yamaya gerek olmadan** hazır gelir (bkz. EK-1, 6–9. maddelerin "upstream durumu" sütunu). (e) Çalışma-zamanı kaldıraçları (autotuner algoritması, TU_DEBUG varyantları, FD_DEV_FEATURES) bilinçli olarak build dışıdır — kullanıcı/emülatör tarafı ayarıdır (Turnip md §8, Ek A) ve prompt kuralı gereği build'e gömülemez.

**S9. Patch gerektirdiği için uygulanamayan ama araştırılmaya değer en önemli 5 patch/fırsat alanı hangisidir?**

(1) **KGSL `PWR_MAX` güç kısıtı** (Droid-Deck `perf_pwr_max.py` — Turnip md §5.4/§6.4): emülatörden bağımsız maksimum GPU saati. (2) **UBWC swapchain vendor bit + gralloc UBWC tespiti** (§4.5/§6.4): bellek bant genişliği kazancı. (3) **Process-geneli `VK_EXT_memory_budget` heapUsage** (§6.4): Proton/DXVK altında Android OOM ölümlerini önler. (4) **Autotune GMEM bant genişliği çarpanı ayarı (11→10)** (§6.4, §4.2): kodun "magic numbers randomly chosen" yorumuna dayalı ampirik denge. (5) **`VK_EXT_mesh_shader` compute öykünmesi** (§6.4, §10.1 — yalnızca Linux hedefi). Tam 18 maddelik liste + güvenli izleme yolları: **EK-1**.

