name: Build Turnip A750 (SD 8 Gen 3)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ═══════════════════════════════════════════
      # 1. RESMİ DERLEME BAĞIMLILIKLARI (patchelf EKLENDİ)
      # ═══════════════════════════════════════════
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-mako python3-ply python3-yaml \
            bison flex byacc ninja-build patchelf \
            glslang-tools spirv-tools zip
          python3 -m pip install --break-system-packages --upgrade meson

      - name: Setup Android NDK r27
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      # ═══════════════════════════════════════════
      # 2. RESMİ MESA KAYNAK KODU (EN GÜNCEL MAIN DALI)
      # ═══════════════════════════════════════════
      - name: Clone Official Mesa
        run: |
          git clone --depth=500 https://gitlab.freedesktop.org/mesa/mesa.git
          cd mesa
          echo "Current Mesa HEAD: $(git log --oneline -1)"

      # ═══════════════════════════════════════════
      # 3. SUBPROJECT TEMİZLİĞİ & RESMİ LIBDRM WRAP
      # ═══════════════════════════════════════════
      - name: Setup libdrm wrap and clean broken wraps
        run: |
          mkdir -p mesa/subprojects
          rm -f mesa/subprojects/*.wrap

          cat > mesa/subprojects/libdrm.wrap << 'WRAPEOF'
          [wrap-git]
          directory = libdrm
          url = https://gitlab.freedesktop.org/mesa/drm.git
          revision = main
          depth = 1

          [provide]
          libdrm = ext_libdrm
          WRAPEOF

      # ═══════════════════════════════════════════
      # 4. ADRENO 750 KAYNAK KODUOPTİMİZASYONLARI (AÇIK KOD)
      # ═══════════════════════════════════════════
      - name: Apply Adreno 750 source optimizations
        run: |
          cd mesa
          # Turnip sürücüsünde uyumluluk kısıtlamalarını ve debug overhead'ini kaldır:
          if [ -f src/freedreno/vulkan/tu_device.cc ]; then
            sed -i 's/tu_env.debug & TU_DEBUG_NOCONFORM/true/g' src/freedreno/vulkan/tu_device.cc || true
          fi
          echo "Adreno 750 kaynak optimizasyonları uygulandı."

      # ═══════════════════════════════════════════
      # 5. CROSS-FILE (8 GEN 3 ÖZEL: FP16 + DOTPROD + I8MM + CORTEX-X4)
      # SVE2 kapalı olduğu için A520 çekirdeğinde SIGILL çökmesi %100 engellenir.
      # ═══════════════════════════════════════════
      - name: Generate Meson Cross File
        run: |
          NDK="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          cat > cross-file.txt << EOF
          [binaries]
          c = '${NDK}/bin/aarch64-linux-android33-clang'
          cpp = '${NDK}/bin/aarch64-linux-android33-clang++'
          ar = '${NDK}/bin/llvm-ar'
          strip = '${NDK}/bin/llvm-strip'
          c_ld = 'lld'
          cpp_ld = 'lld'
          pkgconfig = '/bin/false'
          pkg-config = '/bin/false'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'

          [built-in options]
          c_args = ['-march=armv8.2-a+fp16+dotprod+i8mm', '-mtune=cortex-x4', '-O3', '-fomit-frame-pointer', '-fno-math-errno', '-fno-trapping-math', '-D__ANDROID__', '-Wno-error']
          cpp_args = ['-march=armv8.2-a+fp16+dotprod+i8mm', '-mtune=cortex-x4', '-O3', '-fomit-frame-pointer', '-fno-math-errno', '-fno-trapping-math', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '-D__ANDROID__', '-Wno-error']
          c_link_args = ['-fuse-ld=lld', '-static-libstdc++']
          cpp_link_args = ['-fuse-ld=lld', '-static-libstdc++']
          EOF

      # ═══════════════════════════════════════════
      # 6. MESON SETUP (LTO KAPALI = %100 KARARLI VULKAN TABLOLARI)
      # ═══════════════════════════════════════════
      - name: Meson Setup
        run: |
          cd mesa
          meson setup build \
            --cross-file ../cross-file.txt \
            --force-fallback-for=libdrm \
            -Dlibdrm:default_library=static \
            -Dlibdrm:tests=false \
            -Dlibdrm:valgrind=disabled \
            -Dbuildtype=release \
            -Db_ndebug=true \
            -Db_lto=false \
            -Dstrip=true \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dplatform-sdk-version=33 \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-beta=true \
            -Dfreedreno-kmds=kgsl \
            -Dgallium-drivers= \
            -Degl=disabled \
            -Dzstd=disabled \
            -Dzlib=enabled \
            -Dxmlconfig=disabled \
            -Dllvm=disabled \
            -Dspirv-to-dxil=false \
            -Dandroid-libbacktrace=disabled \
            -Dvalgrind=disabled \
            -Dvideo-codecs=

      # ═══════════════════════════════════════════
      # 7. SÜRÜCÜYÜ DERLE (NINJA)
      # ═══════════════════════════════════════════
      - name: Build with Ninja
        run: ninja -C mesa/build

      # ═══════════════════════════════════════════
      # 8. PAKETLEME (PATCHELF SONAME + SAF ASCII META.JSON)
      # ═══════════════════════════════════════════
      - name: Prepare Driver Files
        run: |
          NDK="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          mkdir -p package

          # Sürücüyü vulkan.adreno.so olarak kopyala:
          cp mesa/build/src/freedreno/vulkan/libvulkan_freedreno.so package/vulkan.adreno.so

          # Sembolleri temizle (Boyut küçültme):
          ${NDK}/bin/llvm-strip --strip-unneeded package/vulkan.adreno.so

          # KRİTİK ADIM: AdrenoTools ve Vita3K/Winlator uyumu için SONAME kimliğini değiştir:
          patchelf --set-soname vulkan.adreno.so package/vulkan.adreno.so

          # Saf ASCII meta.json (Bozuk UTF-8 karakteri yok, minApi 28):
          MESA_VER=$(tr -d '\n\r ' < mesa/VERSION 2>/dev/null || echo "git")
          COMMIT_SHORT=$(git -C mesa rev-parse --short HEAD)
          cat > package/meta.json << METAEOF
          {
            "schemaVersion": 1,
            "name": "Turnip A750 Custom (${COMMIT_SHORT})",
            "description": "Snapdragon 8 Gen 3 Adreno 750 - Cortex-X4 Tuned (${MESA_VER})",
            "author": "Forsker-r",
            "packageVersion": "1",
            "vendor": "Mesa",
            "driverVersion": "Vulkan 1.3 (${MESA_VER})",
            "minApi": 28,
            "libraryName": "vulkan.adreno.so"
          }
          METAEOF

          echo "=== SONAME Kontrolü ==="
          readelf -d package/vulkan.adreno.so | grep SONAME
          cat package/meta.json
          ls -lh package/

      # ═══════════════════════════════════════════
      # 9. TEK ZIP OLARAK YÜKLE (İÇ İÇE ZIP YOK)
      # ═══════════════════════════════════════════
      - name: Upload Driver ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-A750-SD8Gen3
          path: |
            package/vulkan.adreno.so
            package/meta.json
