## 11. Mevcut vs Önerilen karşılaştırma tablosu

| Boyut | Tipik v2/v3 / topluluk paketleyici hattı (Turnip md §6) | Önerilen build.yml (Bölüm 4) |
|---|---|---|
| Mesa kaynağı | Çoğunlukla `main`/`-devel` (ör. K11MCH1 rc08 = 26.0.0-devel; §6.2, §10.2) | Dinamik **en son resmî stable tag** (rc dışlanır; §1.4 gerekçeli) + `main` opsiyonu uyarılı |
| Yamalar | Patch setleri zorunlu (Droid-Deck `series.json`; §6.4) ve rebase kırılgan (§10.2) | **Sıfır yama** + `git status` purity check + kural olarak patch adımı yok |
| KMD hedefi | kgsl (msm kalıntı riski) | **KGSL-only** (`-Dfreedreno-kmds=kgsl`, §6.4/§5.3) |
| Bileşenler | Varsayılanların getirdiği fazlalıklar | GL/EGL/video/LLVM/gbm/glx/osmesa/gles kapalı (§6.4 + prompt alan 1) |
| CPU hedefleme | NDK default (generic) | `-march=armv9.2-a -mtune=cortex-x4` (CPU/GPU md §2.1–§2.3; Varsayım-etiketli) |
| Derleme optimizasyonu | Kanıtlanmış §6.4 flag seti + derleyici default'ları | + gc-sections ölü kod ayıklama, linker -O2, NDEBUG, zstd/valgrind sabit kapama, opsiyonel Thin LTO — **tümü yamasız** |
| Sürüm tespiti | Hardcoded veya günlük main takibi | Resmî GitLab releases API + `ls-remote` fallback; commit hash doğrulanır |
| Binary doğrulama | Elle/eksik (§5.2 kriterleri CI'da yok) | Otomatik gate: AArch64 + DYN + bionic-only + ICD simgesi; hata = job durur |
| İzlenebilirlik | Sürüm adı + release notu | Artifact adında tag+sha7+UTC tarih; BUILD-INFO.txt; SHA256SUMS; NDK SHA1 opsiyonu |
| Runtime ayarları | Varyant zip'lerle örtük davranış farkı (`_Gmem`/`_Sysmem`; §6.2) | **Hiçbiri gömülmez**; tüm kullanıcı ayarları §8'deki env/driconf yoluyla cihazda |
| Cache | Genelde yok | NDK önbelleği (sürüme bağlı anahtar) + shallow clone |
| Dağıtım | Release zip (+ varyantlar) | Yalnız artifact upload (Release bilinçli olarak yok — kullanıcı tercihi) |

---

## 12. Self-Review ve İyileştirme Noktaları

**Paranoia döngüsü cevapları:** (a) Tüm katalog maddeleri bölüm referanslıdır; dokümandan flag olarak çıkmayan iki değer (`-march/-mtune`) açıkça Varsayım V4 olarak etiketlendi — uydurma yok. (b) Kaynak saflığını bozan gizli varsayım bulunamadı; paketleme Mesa ağacının dışında yapılır. (c) Sızıntı kontrolü gerçekleştirildi: `build.yml` üzerinde `git apply|git am |patch |quilt|sed -i|TU_DEBUG=|TU_AUTOTUNE_ALGO=|TU_GMEM=|FD_DEV_FEATURES=|K11MCH1|Droid-Deck|MrPurple666|mirror/mesa` taraması yapıldı; tek eşleşme başlıktaki olumsuz garanti yorumudur ("Hiçbir yama/patch uygulanmaz") — uygulama satırı yok. (d) Kaynak sınıfları prompt tanımına göre revize edildi (ör. madde 7–10 "upstream'e girdi" statüsüyle işaretlendi; artık yama değil, stable-tag seçimiyle gelir). (e) Doğrulanamayan iddialar (blob çalışması, ~%6 kazanç) yalnızca H sınıfında listelendi.

**Somut iyileştirme noktaları (≥3):**

1. **ISA flag doğrulaması:** `-march=armv9.2-a -mtune=cortex-x4` doküman tablosundan türetilmedir (V4). Bir sonraki adım: aynı binary'nin `-mtune=generic` ve `-mtune=cortex-a720` varyantlarıyla kontrollü cihaz benchmark'ı (Turnip md §11.1 protokolü) — seçim böylece ölçüme bağlanır.
2. **`-Dvulkan-beta=true` farkı:** §6.4'te kanıtlı ancak işlevi dokümanda açıklanmaz (beta uzantı ifşası). Kanıt satırı korundu; ileride beta uzantı ihtiyacı olmadığı doğrulanırsa kaldırılarak determinizm artırılabilir (değişiklik tek satır).
3. **Modernizasyon yükseltmeleri (NDK r30 + LTO):** İkisi de resmî/doküman-kanıtlı değil; bu yüzden varsayılanlar r26d + LTO-kapalı bırakıldı. Ayrı bir daldaki deneme build'i + cihaz testi ile yükseltme kararı verilmeli.
4. **GitLab API dayanıklılığı:** Turnip md §1.3'te raporlanan bot-doğrulama duvarı, CI runner IP'lerinden erişimde de görülebilir; `ls-remote` fallback hazır. İlk gerçek çalıştırmada hangi yolun kullandığı log'dan izlenmeli.
5. **SHA-pinleme:** Action'lar şu an `v4` tag'leriyle pinli (prompt "commit/tag" izni). Daha sıkı güvenlik için tam commit SHA'larına geçilebilir (deposa tek satırlık değişiklik x3).
6. **ccache / ön-derleme:** Build süresi sıkışıklık yaratırsa ccache, NDK-cache modeliyle aynı anahtar mantığıyla eklenebilir (K10).
7. **`-fvisibility=hidden` denemesi:** PLT/sembol tablosu küçültme kazancı için ayrı dalda denenebilir; binary doğrulama gate'i (adım 11) olası export kırılmasını yakalar (K12).

---

## 13. Test kontrol listesi

**CI tarafı (cihazsız):**

- [ ] `build.yml` lint (actionlint / YAML parser) — bu teslimatta YAML sözdizimi doğrulandı (1 job / 15 step).
- [ ] İlk `workflow_dispatch` (varsayılan girdiler): sürüm tespit adımı **26.2.x** stable tag çözüyor mu? (beklenen; API tıkanırsa ls-remote fallback devreye giriyor mu?)
- [ ] NDK adımı: `Pkg.Revision` log'da görünüyor mu; SHA1 girdisi verilirse `sha1sum -c` geçiyor mu?
- [ ] `meson-config.txt` log inceleme: `vulkan-drivers freedreno`, `freedreno-kmds kgsl`, GL/EGL/video/LLVM `disabled`?
- [ ] Optimizasyon bloğu uygulandı mı: `meson-config.txt`'te `b_ndebug if-release`, `c_args` içinde `-ffunction-sections`, link args içinde `--gc-sections` ve `-Wl,-O2` görünüyor mu?
- [ ] Binary doğrulama adımı: 5/5 kontrol + ICD simgesi "TAMAM" log'u.
- [ ] Artifact: `Turnip-upstream-<tag>-<sha7>-<tarih>` adlı artifact'ta `turnip/meta.json` + `turnip/libvulkan_freedreno.so` + `BUILD-INFO.txt` + `SHA256SUMS.txt` var mı; SHA256 yerel doğrulama geçiyor mu?
- [ ] Negatif test: `mesa_ref=<var-olmayan-tag>` → clone adımı anlamlı `::error::` ile duruyor mu?
- [ ] `main` + `enable_lto=true` girdili deneme build'i ayrı dalda test edilmeli (V5/V6).

**Cihaz/dağıtım tarafı (Turnip md §11.1 + Ek A ile birebir):**

- [ ] Sürücü paketi emülatörde kuruluş: `internalDataPath` içine (sdcard değil — §5.1); Adrenotools "Add Custom Driver" akışı.
- [ ] `vulkaninfo`: `deviceName = Turnip Adreno (TM) 750`, `driverID = VK_DRIVER_ID_MESA_TURNIP`, `apiVersion = 1.4.x`, `conformanceVersion = 1.4.0.0`, `vendorID = 0x5143`, `deviceID = 0x43051401` (§2.1/§11.1).
- [ ] Cihaz adında `(raytracing disabled)` soneki var mı — KGSL RT fuse durumu (§2.3, §10.1).
- [ ] `TU_DEBUG=startup` log: autotuner yapılandırması, GMEM/UBWC parametreleri (§11.1 adım 2).
- [ ] `TU_DEBUG=gmem` ↔ `TU_DEBUG=sysmem` karşılaştırmalı gözlem (§11.1 adım 4).
- [ ] İstenirse `TU_AUTOTUNE_ALGO=profiled` (+`TU_AUTOTUNE_FLAGS=tune_small`) denemesi (§11.1 adım 5) — **kullanıcı tarafı runtime ayarı, build'e gömülmedi**.
- [ ] Samsung One UI 7 cihazda grafik bozukluğu görülürse kullanıcı ayarı: `FD_DEV_FEATURES=enable_tp_ubwc_flag_hint=1` (Ek A adım 6; EK-1 madde 11).
- [ ] LTO açılmış varyant test edilecekse: uzun oturum + hang/çökme gözlemi.
- [ ] **Performans iddiası YOK:** yalnız gözlem kaydı tutulur (prompt: cihaz testi olmadan kesin performans iddiası üretilmez).

