name: Build Turnip A750 Extreme (SD 8 Gen 3)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ═══════════════════════════════════════════
      # 1. GÜNCEL VE RESMİ DERLEME ARAÇLARI
      # ═══════════════════════════════════════════
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-mako python3-ply python3-yaml \
            bison flex byacc ninja-build patchelf \
            glslang-tools spirv-tools zip
          python3 -m pip install --break-system-packages --upgrade meson

      - name: Setup Android NDK r27
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      # ═══════════════════════════════════════════
      # 2. RESMİ MESA KAYNAK KODU (EN GÜNCEL MAIN HEAD)
      # ═══════════════════════════════════════════
      - name: Clone Official Mesa
        run: |
          git clone --depth=500 https://gitlab.freedesktop.org/mesa/mesa.git
          cd mesa
          echo "Mesa HEAD: $(git log --oneline -1)"

      # ═══════════════════════════════════════════
      # 3. SUBPROJECT TEMİZLİĞİ & RESMİ LIBDRM WRAP
      # ═══════════════════════════════════════════
      - name: Setup libdrm wrap and clean broken wraps
        run: |
          mkdir -p mesa/subprojects
          rm -f mesa/subprojects/*.wrap

          cat > mesa/subprojects/libdrm.wrap << 'WRAPEOF'
          [wrap-git]
          directory = libdrm
          url = https://gitlab.freedesktop.org/mesa/drm.git
          revision = main
          depth = 1

          [provide]
          libdrm = ext_libdrm
          WRAPEOF

      # ═══════════════════════════════════════════
      # 4. ADRENO 750 ÖZEL KAYNAK YAMALARI (AÇIK KOD)
      # ═══════════════════════════════════════════
      - name: Apply Adreno 750 Source Optimizations
        run: |
          cd mesa
          # Vulkan conformance sınırını kaldırarak başlatma kilitlenmelerini engelle:
          for f in src/freedreno/vulkan/tu_device.cc src/freedreno/vulkan/tu_util.cc; do
            if [ -f "$f" ]; then
              sed -i 's/tu_env.debug & TU_DEBUG_NOCONFORM/true/g' "$f" || true
            fi
          done
          echo "Kaynak optimizasyonları tamamlandı."

      # ═══════════════════════════════════════════
      # 5. CROSS-FILE (SD 8 GEN 3: CORTEX-X4 + FP16 + DOTPROD + I8MM)
      # ═══════════════════════════════════════════
      - name: Generate Meson Cross File
        run: |
          NDK="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          cat > cross-file.txt << EOF
          [binaries]
          c = '${NDK}/bin/aarch64-linux-android33-clang'
          cpp = '${NDK}/bin/aarch64-linux-android33-clang++'
          ar = '${NDK}/bin/llvm-ar'
          strip = '${NDK}/bin/llvm-strip'
          c_ld = 'lld'
          cpp_ld = 'lld'
          pkgconfig = '/bin/false'
          pkg-config = '/bin/false'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'

          [built-in options]
          c_args = ['-march=armv8.2-a+fp16+dotprod+i8mm', '-mtune=cortex-x4', '-O3', '-fomit-frame-pointer', '-fno-math-errno', '-fno-trapping-math', '-ffp-contract=fast', '-D__ANDROID__', '-Wno-error']
          cpp_args = ['-march=armv8.2-a+fp16+dotprod+i8mm', '-mtune=cortex-x4', '-O3', '-fomit-frame-pointer', '-fno-math-errno', '-fno-trapping-math', '-ffp-contract=fast', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '-D__ANDROID__', '-Wno-error']
          c_link_args = ['-fuse-ld=lld', '-Wl,--gc-sections', '-static-libstdc++']
          cpp_link_args = ['-fuse-ld=lld', '-Wl,--gc-sections', '-static-libstdc++']
          EOF

      # ═══════════════════════════════════════════
      # 6. MESON SETUP (KGSL + BETA VULKAN + SIFIR LTO ÇÖKMESİ)
      # ═══════════════════════════════════════════
      - name: Meson Setup
        run: |
          cd mesa
          meson setup build \
            --cross-file ../cross-file.txt \
            --force-fallback-for=libdrm \
            -Dlibdrm:default_library=static \
            -Dlibdrm:tests=false \
            -Dlibdrm:valgrind=disabled \
            -Dbuildtype=release \
            -Db_ndebug=true \
            -Db_lto=false \
            -Dstrip=true \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dplatform-sdk-version=33 \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-beta=true \
            -Dfreedreno-kmds=kgsl \
            -Dgallium-drivers= \
            -Degl=disabled \
            -Dzstd=disabled \
            -Dzlib=enabled \
            -Dxmlconfig=disabled \
            -Dllvm=disabled \
            -Dspirv-to-dxil=false \
            -Dandroid-libbacktrace=disabled \
            -Dvalgrind=disabled \
            -Dvideo-codecs=

      # ═══════════════════════════════════════════
      # 7. SÜRÜCÜYÜ DERLE (NINJA)
      # ═══════════════════════════════════════════
      - name: Build Driver with Ninja
        run: ninja -C mesa/build

      # ═══════════════════════════════════════════
      # 8. ADRENOTOOLS PAKETLEME (PATCHELF RPATH TEMİZLEME + ASCII JSON)
      # ═══════════════════════════════════════════
      - name: Package AdrenoTools Driver
        run: |
          NDK="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          mkdir -p package

          # 1. Dosyayı standart hedef adıyla kopyala:
          cp mesa/build/src/freedreno/vulkan/libvulkan_freedreno.so package/vulkan.adreno.so

          # 2. Sembolleri temizle (Optimum dosya boyutu):
          ${NDK}/bin/llvm-strip --strip-unneeded package/vulkan.adreno.so

          # 3. AdrenoTools / Vita3K / Winlator uyumu için SONAME damgala:
          patchelf --set-soname vulkan.adreno.so package/vulkan.adreno.so

          # 4. Güvenlik ve Taşınabilirlik: Host derleme arama yollarını (RPATH) temizle:
          patchelf --remove-rpath package/vulkan.adreno.so || true

          # 5. Saf ASCII Standart meta.json (minApi 28, bozuk karakter yok):
          MESA_VER=$(tr -d '\n\r ' < mesa/VERSION 2>/dev/null || echo "git")
          COMMIT_SHORT=$(git -C mesa rev-parse --short HEAD)
          cat > package/meta.json << METAEOF
          {
            "schemaVersion": 1,
            "name": "Turnip A750 Extreme (${COMMIT_SHORT})",
            "description": "Adreno 750 (SM8650) - Cortex-X4 Tuned + FP16/DotProd/I8MM",
            "author": "Forsker-r",
            "packageVersion": "1",
            "vendor": "Mesa",
            "driverVersion": "Vulkan 1.3 (${MESA_VER})",
            "minApi": 28,
            "libraryName": "vulkan.adreno.so"
          }
          METAEOF

          echo "=== Paket Doğrulama Denetimi ==="
          readelf -d package/vulkan.adreno.so | grep -E "SONAME|RUNPATH|RPATH" || true
          cat package/meta.json
          ls -lh package/

      # ═══════════════════════════════════════════
      # 9. TEK FLAT ZIP ARTIFACT YÜKLE
      # ═══════════════════════════════════════════
      - name: Upload Turnip Driver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-A750-SD8Gen3-Final
          path: |
            package/vulkan.adreno.so
            package/meta.json
