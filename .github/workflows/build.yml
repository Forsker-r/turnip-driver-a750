# =============================================================================
# turnip-driver-a750 — %100 Resmî Mesa Upstream Turnip Derleme Hattı (v4 Master)
# Hedef SoC / GPU : Qualcomm Snapdragon 8 Gen 3 (SM8650) / Adreno 750
# Sürücü Kimliği  : FD750 (a7xx_gen3), KGSL Chip-ID 0x43051401, Vulkan 1.4
#
# MİMARİ VE GÜVENLİK GARANTİLERİ (prompt-v4.md & Teknik Doküman Uyumlu):
#  1. %100 SAF UPSTREAM KAYNAK: Yalnızca resmî gitlab.freedesktop.org/mesa/mesa.git
#     deposu kullanılır. Hiçbir fork, mirror veya üçüncü taraf script kullanılmaz.
#  2. SIFIR YAMA (ZERO PATCH): git apply, git am, patch, quilt, sed, awk veya
#     python ile kaynak ağacında tek bir bayt bile değiştirilmez. Klonlama sonrası
#     ve derleme öncesi 'git status --porcelain' + SHA kapısı ile doğrulanır.
#  3. SIFIR RUNTIME GÖMME: TU_DEBUG, TU_AUTOTUNE_ALGO, TU_GMEM, FD_DEV_FEATURES
#     veya driconf profilleri ikili dosyaya gömülmez; sürücü saf upstream
#     varsayılanlarıyla (Mesa 26.1+ C++ Autotuner dahil) çalışır.
#  4. OTOMATİK EN GÜNCEL NDK LTS & API SEVİYESİ TESPİTİ:
#     Resmî Android NDK deposundan (github.com/android/ndk & dl.google.com) en güncel
#     kararlı LTS sürümü (örn. r30) ve toolchain içindeki en yüksek API seviyesi
#     (örn. API 35/36) dinamik olarak tespit edilir; SHA1/SHA256 bütünlüğü doğrulanır.
#  5. HOMOJEN ARMv9.2-A + CORTEX-A720/X4 HEDEFLEME (CPU/GPU md §2.1, §2.2, §2.3):
#     8 çekirdeğin tamamında (1× X4 + 5× A720 + 2× A520) ortak olan EL0 ARMv9.2-A
#     komut seti (-march=armv9.2-a+crc+crypto; imli DotProd, FP16, BF16, I8MM,
#     LSE/LSE2, LRCPC2) ve varsayılan 5× A720 performans kümesi füzyonları
#     (-mtune=cortex-a720: CMP+B.cc, CMP+CSEL, ADRP+ADD, hızlı LSL ALU) kullanılır.
#  6. KANITLANMIŞ SAF MESON YAPILANDIRMASI (docs.mesa3d.org/android.html & Turnip md §6.4):
#     Host pkg-config sızıntısını önleyen izole PKG_CONFIG_LIBDIR, resmî zlib wrap
#     desteği ve kanıtlanmış Turnip/KGSL bayrak çekirdeği kullanılır.
#  7. SIKI İKİLİ (ELF / BIONIC / SEMBOL) VE PAKET DOĞRULAMA KAPISI (Turnip md §5.2):
#     AArch64 + DYN + Bionic/Android-Stub allowlist (libc.so, libhardware.so, libcutils.so,
#     libnativewindow.so, libsync.so, liblog.so, libm.so, libdl.so, libz.so;
#     glibc/libc++_shared/libexpat yasağı) + vk_icdGetInstanceProcAddr sembol kontrolü +
#     masaüstü WSI sızıntı yasağı + AdrenoTools kök dizin meta.json şema doğrulaması.
# =============================================================================

name: Build Official Upstream Turnip (Snapdragon 8 Gen 3 / Adreno 750)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: >-
          Mesa kaynağı: 'stable' (varsayılan: en son resmî kararlı mesa-X.Y.Z etiketi,
          dinamik tespit) | 'main' (en güncel bleeding-edge upstream dalı) |
          doğrudan resmî etiket adı (örn. mesa-26.2.4)
        required: false
        default: "stable"
        type: string
      ndk_version:
        description: >-
          Resmî Android NDK sürümü (dl.google.com). 'latest' (varsayılan: en güncel
          resmî kararlı NDK sürümünü dinamik tespit eder, örn. r30) veya 'r30', 'r29', 'r26d'.
        required: false
        default: "latest"
        type: string
      cpu_tune:
        description: >-
          Mikro-mimari zamanlama profili (-mtune): 'cortex-a720' (varsayılan: 5× A720
          performans kümesi, CMP+B.cc füzyonu dahil - CPU/GPU md §2.3) | 'cortex-x4'
          (1× Prime 10-wide ROB=384 profili).
        required: false
        default: "cortex-a720"
        type: choice
        options:
          - cortex-a720
          - cortex-x4
      enable_lto:
        description: >-
          Clang/LLD Thin LTO (-Db_lto=true) etkinleştir.
          Varsayılan: true (tu_* ve ir3_* modülleri arası çapraz inline optimizasyonu).
        required: false
        default: true
        type: boolean
      create_release:
        description: "Derleme sonunda GitHub Release oluşturulsun mu?"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 6 * * 1" # Her Pazartesi 06:00 UTC

permissions:
  contents: write

concurrency:
  group: build-turnip-a750-${{ github.ref }}
  cancel-in-progress: true

env:
  # --- Yalnızca Resmî Veri Kaynakları (VERİ KAYNAĞI GÜVENLİĞİ Kuralı) --------
  MESA_REPO_URL: "https://gitlab.freedesktop.org/mesa/mesa.git"
  MESA_RELEASES_API: "https://gitlab.freedesktop.org/api/v4/projects/mesa%2Fmesa/releases?per_page=50"
  NDK_RELEASES_API: "https://api.github.com/repos/android/ndk/releases?per_page=30"
  NDK_URL_BASE: "https://dl.google.com/android/repository"
  # Resmî Google NDK Arşiv Kriptografik Özetleri (developer.android.com/ndk/downloads):
  NDK_R30_SHA1: "5107f898313790e449e87eee2183d9a20602dee9"
  NDK_R26D_SHA256: "eefeafe7ccf177de7cc57158da585e7af119bb7504a63604ad719e4b2a328b54"
  # --- Platform ve Hedef Sabitleri (Turnip md §5.2) --------------------------
  ADPKG_MIN_API: "29"
  TARGET_GPU_NAME: "Adreno 750 (SM8650 / a7xx_gen3 / FD750)"

jobs:
  build-turnip-a750:
    name: "Turnip A750 (100% Pure Upstream Mesa + Official NDK)"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # -----------------------------------------------------------------------
      # 1) Girdileri ve En Güncel NDK Sürümünü Dinamik Çözümle
      # -----------------------------------------------------------------------
      - name: "1. Workflow Parametrelerini ve En Güncel Resmî NDK Sürümünü Tespit Et"
        id: init_params
        run: |
          set -euo pipefail
          MESA_REF_IN="${{ inputs.mesa_ref || 'stable' }}"
          NDK_VER_IN="${{ inputs.ndk_version || 'latest' }}"
          CPU_TUNE_IN="${{ inputs.cpu_tune || 'cortex-a720' }}"
          ENABLE_LTO_IN="${{ inputs.enable_lto != false && 'true' || 'false' }}"
          CREATE_REL_IN="${{ inputs.create_release == true && 'true' || 'false' }}"

          if [[ "${CPU_TUNE_IN}" != "cortex-a720" && "${CPU_TUNE_IN}" != "cortex-x4" ]]; then
            echo "::error::Geçersiz cpu_tune değeri: ${CPU_TUNE_IN}"
            exit 1
          fi

          # 'latest' seçildiyse resmî android/ndk GitHub API'sinden en son kararlı (beta/rc olmayan) NDK sürümünü bul
          if [ "${NDK_VER_IN}" = "latest" ]; then
            echo "Resmî Android NDK deposundan en güncel kararlı LTS sürümü sorgulanıyor..."
            DETECTED_NDK=$(curl -fsSL --retry 3 --retry-delay 3 "${NDK_RELEASES_API}" \
              | jq -r '[.[] | select(.prerelease == false and (.tag_name | test("^r[0-9]+[a-z]?$"))) | .tag_name] | .[0]' || true)
            if [ -n "${DETECTED_NDK}" ] && [ "${DETECTED_NDK}" != "null" ]; then
              NDK_VER_RESOLVED="${DETECTED_NDK}"
            else
              echo "::warning::NDK API sorgusu yanıt vermedi, en güncel bilinen resmî LTS sürümüne (r30) geçiliyor."
              NDK_VER_RESOLVED="r30"
            fi
          else
            NDK_VER_RESOLVED="${NDK_VER_IN}"
          fi

          {
            echo "MESA_REF=${MESA_REF_IN}"
            echo "NDK_VERSION=${NDK_VER_RESOLVED}"
            echo "CPU_TUNE=${CPU_TUNE_IN}"
            echo "ENABLE_LTO=${ENABLE_LTO_IN}"
            echo "CREATE_RELEASE=${CREATE_REL_IN}"
          } >> "${GITHUB_ENV}"

          echo "ndk_version=${NDK_VER_RESOLVED}" >> "${GITHUB_OUTPUT}"
          echo "Mesa Ref Hedefi : ${MESA_REF_IN}"
          echo "Seçilen NDK     : ${NDK_VER_RESOLVED} (dl.google.com)"
          echo "CPU Tune Hedefi : -march=armv9.2-a+crc+crypto -mtune=${CPU_TUNE_IN}"
          echo "Thin LTO Durumu : ${ENABLE_LTO_IN}"

      # -----------------------------------------------------------------------
      # 2) Depo Checkout (Node.js 24 yerel uyumlu actions/checkout@v6)
      # -----------------------------------------------------------------------
      - name: "2. Depoyu Checkout Et"
        uses: actions/checkout@v6

      # -----------------------------------------------------------------------
      # 3) Derleme ve Doğrulama Bağımlılıklarını Kur (PEP 668 uyumlu)
      # -----------------------------------------------------------------------
      - name: "3. Derleme Bağımlılıklarını Kur (Ubuntu & Python Meson/Mako/PLY)"
        run: |
          set -euo pipefail
          echo "::group::APT Paket Kurulumu"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils \
            bison \
            ca-certificates \
            ccache \
            cmake \
            curl \
            file \
            flex \
            gettext \
            git \
            glslang-tools \
            jq \
            meson \
            ninja-build \
            pkg-config \
            python3 \
            python3-mako \
            python3-packaging \
            python3-pip \
            python3-ply \
            python3-setuptools \
            python3-wheel \
            python3-yaml \
            unzip \
            xz-utils \
            zip \
            zlib1g-dev \
            zstd
          echo "::endgroup::"

          echo "::group::Python Derleme Araçları (En Güncel Meson & Mako)"
          python3 -m pip install --break-system-packages --upgrade "meson>=1.5.0" "mako>=1.2.0" "pyyaml" "ply" "packaging" \
            || python3 -m pip install --upgrade "meson>=1.5.0" "mako>=1.2.0" "pyyaml" "ply" "packaging"
          hash -r
          echo "Meson            : $(meson --version)"
          echo "Ninja            : $(ninja --version)"
          echo "glslangValidator : $(glslangValidator --version | head -n1)"
          echo "jq               : $(jq --version)"
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      # 4) Dinamik Resmî Mesa Sürüm Tespiti (Git ls-remote + GitLab API Fallback)
      #    Turnip md §1.4 & §10.2: -rc adaylarını dışla, en güncel kararlı mesa-X.Y.Z seç
      # -----------------------------------------------------------------------
      - name: "4. Resmî Mesa GitLab Deposundan En Güncel Sürümü ve SHA Değerini Tespit Et"
        id: resolve_mesa
        run: |
          set -euo pipefail
          echo "::group::Mesa Resmî Sürüm ve Commit SHA Tespiti"
          RESOLVED_TAG=""

          if [ "${MESA_REF}" = "stable" ]; then
            echo "Yöntem 1: Resmî GitLab deposundan 'git ls-remote --tags' ile en güncel kararlı etiket aranıyor..."
            RESOLVED_TAG=$(git ls-remote --tags --refs "${MESA_REPO_URL}" \
              | awk -F'refs/tags/' '{print $2}' \
              | grep -E '^mesa-[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1 || true)

            if [ -z "${RESOLVED_TAG}" ]; then
              echo "::warning::git ls-remote yanıt vermedi, Yöntem 2 (Resmî GitLab Releases API) deneniyor..."
              API_TAG=$(curl -fsSL --retry 3 --retry-delay 5 "${MESA_RELEASES_API}" \
                | jq -r '[.[].tag_name | select(test("^(mesa-)?[0-9]+\\.[0-9]+\\.[0-9]+$"))] | .[0]' || true)
              if [ -n "${API_TAG}" ] && [ "${API_TAG}" != "null" ]; then
                if [[ "${API_TAG}" == mesa-* ]]; then
                  RESOLVED_TAG="${API_TAG}"
                else
                  RESOLVED_TAG="mesa-${API_TAG}"
                fi
              fi
            fi
          elif [ "${MESA_REF}" = "main" ]; then
            echo "::warning::'main' dalı seçildi — en güncel bleeding-edge Mesa upstream derlenecek (Turnip md §10.2)."
            RESOLVED_TAG="main"
          else
            if [[ "${MESA_REF}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
              RESOLVED_TAG="mesa-${MESA_REF}"
            else
              RESOLVED_TAG="${MESA_REF}"
            fi
            echo "Kullanıcı tarafından belirtilen resmî ref: ${RESOLVED_TAG}"
          fi

          if [ -z "${RESOLVED_TAG}" ]; then
            echo "::error::Resmî Mesa deposundan geçerli bir sürüm/etiket tespit edilemedi!"
            exit 1
          fi

          if [ "${RESOLVED_TAG}" = "main" ]; then
            RESOLVED_SHA=$(git ls-remote "${MESA_REPO_URL}" "refs/heads/main" | awk '{print $1}')
          else
            RESOLVED_SHA=$(git ls-remote "${MESA_REPO_URL}" "refs/tags/${RESOLVED_TAG}^{}" | awk '{print $1}')
            if [ -z "${RESOLVED_SHA}" ]; then
              RESOLVED_SHA=$(git ls-remote "${MESA_REPO_URL}" "refs/tags/${RESOLVED_TAG}" | awk '{print $1}')
            fi
          fi

          if [ -z "${RESOLVED_SHA}" ]; then
            echo "::error::'${RESOLVED_TAG}' için resmî Mesa deposunda commit SHA doğrulanamadı!"
            exit 1
          fi

          SHORT_SHA="${RESOLVED_SHA:0:12}"
          VERSION_CLEAN="${RESOLVED_TAG#mesa-}"
          BUILD_DATE=$(date -u +"%Y%m%d-%H%M")
          BUILD_ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          {
            echo "mesa_tag=${RESOLVED_TAG}"
            echo "mesa_sha=${RESOLVED_SHA}"
            echo "mesa_short_sha=${SHORT_SHA}"
            echo "mesa_version=${VERSION_CLEAN}"
            echo "build_date=${BUILD_DATE}"
            echo "build_iso=${BUILD_ISO}"
          } >> "${GITHUB_OUTPUT}"

          echo "Seçilen Resmî Ref      : ${RESOLVED_TAG}"
          echo "Doğrulanan Commit SHA  : ${RESOLVED_SHA}"
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      # 5) Resmî Android NDK Önbelleği ve Kurulumu (actions/cache@v5 - Node 24)
      # -----------------------------------------------------------------------
      - name: "5. Resmî Android NDK Önbelleğini Kontrol Et"
        id: cache_ndk
        uses: actions/cache@v5
        with:
          path: ~/android-ndk/android-ndk-${{ steps.init_params.outputs.ndk_version }}
          key: official-android-ndk-linux-${{ steps.init_params.outputs.ndk_version }}-v3

      - name: "6. Resmî Android NDK İndir, Doğrula ve En Güncel API Seviyesini Tespit Et"
        id: setup_ndk
        run: |
          set -euo pipefail
          echo "::group::Resmî Android NDK (${NDK_VERSION}) Kurulumu ve API Tespiti"
          NDK_ROOT="${HOME}/android-ndk"
          NDK_DIR="${NDK_ROOT}/android-ndk-${NDK_VERSION}"
          mkdir -p "${NDK_ROOT}"

          if [ ! -d "${NDK_DIR}" ]; then
            NDK_ZIP="${RUNNER_TEMP}/android-ndk-${NDK_VERSION}-linux.zip"
            NDK_URL="${NDK_URL_BASE}/android-ndk-${NDK_VERSION}-linux.zip"
            echo "Resmî Google kanalından indiriliyor: ${NDK_URL}"
            curl -fSL --retry 3 --retry-delay 5 -o "${NDK_ZIP}" "${NDK_URL}"

            ACTUAL_SHA256=$(sha256sum "${NDK_ZIP}" | awk '{print $1}')
            ACTUAL_SHA1=$(sha1sum "${NDK_ZIP}" | awk '{print $1}')
            echo "İndirilen NDK SHA256 : ${ACTUAL_SHA256}"
            echo "İndirilen NDK SHA1   : ${ACTUAL_SHA1}"

            if [ "${NDK_VERSION}" = "r30" ]; then
              if [ "${ACTUAL_SHA1}" != "${NDK_R30_SHA1}" ]; then
                echo "::error::NDK r30 SHA1 doğrulaması BAŞARISIZ! Beklenen: ${NDK_R30_SHA1}, Bulunan: ${ACTUAL_SHA1}"
                exit 1
              fi
              echo "NDK r30 resmî SHA1 kriptografik doğrulaması başarılı."
            elif [ "${NDK_VERSION}" = "r26d" ]; then
              if [ "${ACTUAL_SHA256}" != "${NDK_R26D_SHA256}" ]; then
                echo "::error::NDK r26d SHA256 doğrulaması BAŞARISIZ! Beklenen: ${NDK_R26D_SHA256}, Bulunan: ${ACTUAL_SHA256}"
                exit 1
              fi
              echo "NDK r26d resmî SHA256 kriptografik doğrulaması başarılı."
            fi

            unzip -q "${NDK_ZIP}" -d "${NDK_ROOT}"
            rm -f "${NDK_ZIP}"
          else
            echo "NDK önbellekten yüklendi: ${NDK_DIR}"
          fi

          if [ ! -f "${NDK_DIR}/source.properties" ]; then
            echo "::error::NDK source.properties bulunamadı: ${NDK_DIR}"
            exit 1
          fi
          grep "^Pkg.Revision" "${NDK_DIR}/source.properties" || true

          # NDK toolchain içindeki en güncel/yüksek kararlı aarch64-linux-android<API>-clang seviyesini dinamik tespit et
          NDK_BIN="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          MAX_CLANG_API=$(ls "${NDK_BIN}"/aarch64-linux-android*-clang 2>/dev/null \
            | sed -n 's/.*aarch64-linux-android\([0-9][0-9]*\)-clang$/\1/p' \
            | sort -n \
            | tail -n 1 || true)

          if [ -z "${MAX_CLANG_API}" ]; then
            echo "::error::NDK içinde aarch64-linux-android<API>-clang derleyicisi bulunamadı!"
            exit 1
          fi

          # Turnip md §6.4: platform-sdk-version en az 34..36 aralığında NDK'nın desteklediği en güncel API'ye ayarlanır
          echo "Tespit Edilen En Güncel NDK Clang API Seviyesi: ${MAX_CLANG_API}"
          {
            echo "NDK_DIR=${NDK_DIR}"
            echo "ANDROID_API_LEVEL=${MAX_CLANG_API}"
          } >> "${GITHUB_ENV}"
          echo "android_api=${MAX_CLANG_API}" >> "${GITHUB_OUTPUT}"
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      # 7) Derleyici Nesne Önbelleği (ccache) ve Meson Wrap PackageCache
      # -----------------------------------------------------------------------
      - name: "7. Derleyici Önbelleğini (ccache) Yükle"
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-turnip-a750-${{ env.NDK_VERSION }}-api${{ steps.setup_ndk.outputs.android_api }}-${{ env.CPU_TUNE }}-lto-${{ env.ENABLE_LTO }}-${{ steps.resolve_mesa.outputs.mesa_tag }}-${{ github.run_id }}
          restore-keys: |
            ccache-turnip-a750-${{ env.NDK_VERSION }}-api${{ steps.setup_ndk.outputs.android_api }}-${{ env.CPU_TUNE }}-lto-${{ env.ENABLE_LTO }}-${{ steps.resolve_mesa.outputs.mesa_tag }}-
            ccache-turnip-a750-${{ env.NDK_VERSION }}-api${{ steps.setup_ndk.outputs.android_api }}-${{ env.CPU_TUNE }}-

      # -----------------------------------------------------------------------
      # 8) Resmî Mesa Kaynak Kodu İndirme, Vulkan Başlık Tespiti ve Saflık Denetimi
      # -----------------------------------------------------------------------
      - name: "8. Resmî Mesa Kaynak Kodunu İndir ve Saflık Denetimi Yap"
        id: clone_mesa
        run: |
          set -euo pipefail
          echo "::group::Mesa Kaynak Kodu Klonlama (Saf Upstream)"
          git clone --depth 1 --branch "${{ steps.resolve_mesa.outputs.mesa_tag }}" \
            "${MESA_REPO_URL}" "${RUNNER_TEMP}/mesa-src"
          cd "${RUNNER_TEMP}/mesa-src"

          HEAD_SHA=$(git rev-parse HEAD)
          if [ "${HEAD_SHA}" != "${{ steps.resolve_mesa.outputs.mesa_sha }}" ]; then
            echo "::error::Klonlanan HEAD SHA (${HEAD_SHA}) beklenen SHA (${{ steps.resolve_mesa.outputs.mesa_sha }}) ile eşleşmiyor!"
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Mesa kaynak ağacı kirli! Kaynak saflığı bozulmuş."
            git status --porcelain
            exit 1
          fi

          # Kaynak içindeki gerçek VERSION ve Vulkan Header sürümünü (örn. 1.4.335+) dinamik oku
          MESA_SRC_VER=$(tr -d '[:space:]' < VERSION || echo "${{ steps.resolve_mesa.outputs.mesa_version }}")
          VK_HEADER_PATCH=$(awk '/^#define VK_HEADER_VERSION / {print $3}' include/vulkan/vulkan_core.h | tr -d '[:space:]' || echo "0")
          VK_FULL_VER="1.4.${VK_HEADER_PATCH}"

          {
            echo "mesa_src_ver=${MESA_SRC_VER}"
            echo "vk_version=${VK_FULL_VER}"
          } >> "${GITHUB_OUTPUT}"

          echo "Kaynak Saflığı Doğrulandı : 0 yama, temiz çalışma ağacı (${HEAD_SHA})"
          echo "Mesa Kaynak Sürümü        : ${MESA_SRC_VER}"
          echo "Vulkan API Başlık Sürümü  : Vulkan ${VK_FULL_VER} (Turnip md §2.1)"
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      # 9) Meson Cross-File Oluşturma
      #    docs.mesa3d.org/android.html + CPU/GPU md §2.1–§2.3 + Turnip md §6.4
      # -----------------------------------------------------------------------
      - name: "9. Meson Cross-File Oluştur (SM8650 ARMv9.2-A + Resmî Mesa Android Standardı)"
        run: |
          set -euo pipefail
          echo "::group::Meson Cross-File Yapılandırması"
          NDK_TOOLCHAIN="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CLANG_BIN="${NDK_TOOLCHAIN}/aarch64-linux-android${ANDROID_API_LEVEL}-clang"
          CLANGXX_BIN="${NDK_TOOLCHAIN}/aarch64-linux-android${ANDROID_API_LEVEL}-clang++"

          if [ ! -x "${CLANG_BIN}" ]; then
            echo "::error::NDK Clang derleyicisi bulunamadı: ${CLANG_BIN}"
            exit 1
          fi

          # Host x86_64 kütüphanelerinin (/usr/lib/x86_64-linux-gnu/pkgconfig) Android
          # çapraz derlemesine sızmasını önleyen boş pkgconfig dizini:
          EMPTY_PKGCONFIG="${RUNNER_TEMP}/empty-pkgconfig"
          mkdir -p "${EMPTY_PKGCONFIG}"

          ccache --set-config=max_size=1G
          ccache --set-config=compression=true
          ccache --zero-stats

          cat <<EOF > "${RUNNER_TEMP}/android-aarch64-sm8650.ini"
          [binaries]
          ar = '${NDK_TOOLCHAIN}/llvm-ar'
          c = ['ccache', '${CLANG_BIN}']
          cpp = ['ccache', '${CLANGXX_BIN}', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '--start-no-unused-arguments', '-static-libstdc++', '--end-no-unused-arguments']
          c_ld = 'lld'
          cpp_ld = 'lld'
          strip = '${NDK_TOOLCHAIN}/llvm-strip'
          pkg-config = ['env', 'PKG_CONFIG_LIBDIR=${EMPTY_PKGCONFIG}', '/usr/bin/pkg-config']

          [built-in options]
          c_args = ['-march=armv9.2-a+crc+crypto', '-mtune=${CPU_TUNE}', '-D__ANDROID__', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '-ffunction-sections', '-fdata-sections']
          cpp_args = ['-march=armv9.2-a+crc+crypto', '-mtune=${CPU_TUNE}', '-D__ANDROID__', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '-ffunction-sections', '-fdata-sections']
          c_link_args = ['-fuse-ld=lld', '-Wl,--gc-sections', '-Wl,-O2']
          cpp_link_args = ['-fuse-ld=lld', '-static-libstdc++', '-Wl,--gc-sections', '-Wl,-O2']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

          cat "${RUNNER_TEMP}/android-aarch64-sm8650.ini"
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      # 10) Meson Setup ve Ninja Derlemesi
      # -----------------------------------------------------------------------
      - name: "10. Meson ile Turnip (Freedreno KGSL) Yapılandır ve Derle"
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/mesa-src"

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Derleme öncesi Mesa kaynak ağacında değişiklik tespit edildi!"
            git status --porcelain
            exit 1
          fi

          LTO_FLAGS=()
          if [ "${ENABLE_LTO}" = "true" ]; then
            LTO_FLAGS=(-Db_lto=true)
          else
            LTO_FLAGS=(-Db_lto=false)
          fi

          echo "::group::Meson Setup (Resmî Mesa Android NDK + Turnip md §6.4 Çekirdeği)"
          if ! meson setup "${RUNNER_TEMP}/mesa-build" \
            --cross-file "${RUNNER_TEMP}/android-aarch64-sm8650.ini" \
            -Dbuildtype=release \
            -Db_ndebug=true \
            -Dstrip=true \
            "${LTO_FLAGS[@]}" \
            -Dplatforms=android \
            -Dplatform-sdk-version=${ANDROID_API_LEVEL} \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-beta=true \
            -Dfreedreno-kmds=kgsl \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dglx=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dllvm=disabled \
            -Dvideo-codecs= ; then
            echo "::error::Meson setup başarısız oldu! Ayrıntılı meson-log.txt son 120 satırı:"
            tail -n 120 "${RUNNER_TEMP}/mesa-build/meson-logs/meson-log.txt" || true
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Kaynak Saflığı Kontrolü (Subprojects Hariç Ana Kaynak Ağacı)"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::Meson yapılandırması sırasında izlenen Mesa kaynak dosyalarında değişiklik tespit edildi!"
            git status --porcelain --untracked-files=no
            exit 1
          fi
          echo "Ana Mesa kaynak dosyaları %100 değiştirilmemiş ve temiz."
          echo "::endgroup::"

          echo "::group::Ninja Derlemesi (libvulkan_freedreno.so)"
          meson compile -C "${RUNNER_TEMP}/mesa-build" src/freedreno/vulkan/libvulkan_freedreno.so \
            || ninja -C "${RUNNER_TEMP}/mesa-build" src/freedreno/vulkan/libvulkan_freedreno.so
          ccache --show-stats
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      # 11) Sıkı İkili Dosya (ELF / Bionic & Android-Stub Allowlist / Vulkan Sembol) Kapısı
      #     Turnip md §5.2 & docs.mesa3d.org/android.html:
      #     Android-stub kütüphaneleri: libhardware.so, libcutils.so, libnativewindow.so,
      #     libsync.so, liblog.so, libandroid.so + Bionic: libc.so, libm.so, libdl.so, libz.so
      # -----------------------------------------------------------------------
      - name: "11. İkili Dosya (ELF / Bionic / Vulkan Sembol) Doğrulaması Yap"
        run: |
          set -euo pipefail
          echo "::group::Binary Doğrulama Kapısı (readelf & file)"
          SO_PATH="${RUNNER_TEMP}/mesa-build/src/freedreno/vulkan/libvulkan_freedreno.so"
          if [ ! -f "${SO_PATH}" ]; then
            echo "::error::libvulkan_freedreno.so üretilmedi!"
            exit 1
          fi

          # Strip garantisi (llvm-strip ile gereksiz sembolleri temizle)
          "${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded "${SO_PATH}" || true

          echo "Dosya Bilgisi : $(file -b "${SO_PATH}")"
          echo "Dosya Boyutu  : $(stat -c '%s bayt' "${SO_PATH}")"

          ELF_HEADER=$(readelf -h "${SO_PATH}")
          echo "${ELF_HEADER}"

          if ! echo "${ELF_HEADER}" | grep -Eq "Class:[[:space:]]*ELF64"; then
            echo "::error::Doğrulama Hatası [1/6]: ELF Class ELF64 değil!"
            exit 1
          fi

          if ! echo "${ELF_HEADER}" | grep -Eq "Machine:[[:space:]]*AArch64"; then
            echo "::error::Doğrulama Hatası [2/6]: ELF Machine AArch64 değil!"
            exit 1
          fi

          if ! echo "${ELF_HEADER}" | grep -Eq "Type:[[:space:]]*DYN"; then
            echo "::error::Doğrulama Hatası [3/6]: ELF Type DYN (paylaşımlı kütüphane) değil!"
            exit 1
          fi

          DYN_SECTION=$(readelf -d "${SO_PATH}")
          echo "${DYN_SECTION}"

          NEEDED_LIBS=$(echo "${DYN_SECTION}" | awk -F'[][]' '/\(NEEDED\)/ {print $2}')
          echo "Bağlanan Dinamik Kütüphaneler (NEEDED):"
          echo "${NEEDED_LIBS}"

          if ! echo "${NEEDED_LIBS}" | grep -qx "libc.so"; then
            echo "::error::Doğrulama Hatası [4/6]: Android bionic 'libc.so' bağımlılığı bulunamadı!"
            exit 1
          fi

          # Yalnızca izin verilen Android Bionic ve Mesa android-stub sistem kütüphanelerine
          # (docs.mesa3d.org/android.html: libc, libdl, liblog, libm, libcutils, libhardware,
          # libnativewindow, libsync, libz, libandroid) bağlandığını doğrula:
          ALLOWED_REGEX='^(libc\.so|libm\.so|libdl\.so|liblog\.so|libnativewindow\.so|libsync\.so|libandroid\.so|libhardware\.so|libcutils\.so|libz\.so)$'
          for lib in ${NEEDED_LIBS}; do
            if ! echo "${lib}" | grep -Eq "${ALLOWED_REGEX}"; then
              echo "::error::Doğrulama Hatası [5/6]: İzin verilmeyen harici kütüphane bağımlılığı: ${lib}"
              exit 1
            fi
          done

          # Vulkan ICD giriş noktası sembolü var mı ve masaüstü Linux WSI sembolleri sızmış mı kontrol et
          DYN_SYMS=$(readelf --dyn-syms -W "${SO_PATH}")
          if ! echo "${DYN_SYMS}" | grep -qw "vk_icdGetInstanceProcAddr"; then
            echo "::error::Doğrulama Hatası [6/6]: Vulkan ICD giriş sembolü (vk_icdGetInstanceProcAddr) bulunamadı!"
            exit 1
          fi

          if echo "${DYN_SYMS}" | grep -Eq "vkCreateWaylandSurfaceKHR|vkCreateXcbSurfaceKHR"; then
            echo "::error::Doğrulama Hatası: Masaüstü Linux WSI (Wayland/XCB) sembolleri Android sürücüsüne sızmış!"
            exit 1
          fi

          echo "Android Bionic Notu: $(readelf -n "${SO_PATH}" | grep -i android | head -n2 || echo 'standart')"
          echo "Binary doğrulama kapısı TAMAM (6/6 kontrol başarıyla geçti)."
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      # 12) AdrenoTools (.adpkg / .zip) Paketleme ve Şema Doğrulaması
      #     Turnip md §5.2: meta.json ve libvulkan_freedreno.so zip kökünde olmalı
      # -----------------------------------------------------------------------
      - name: "12. AdrenoTools (.adpkg / .zip) Paketini Oluştur ve Doğrula"
        id: package_driver
        run: |
          set -euo pipefail
          echo "::group::AdrenoTools Paketleme ve meta.json Doğrulaması"
          PKG_DIR="${RUNNER_TEMP}/adpkg-bundle"
          OUT_DIR="${RUNNER_TEMP}/artifacts"
          mkdir -p "${PKG_DIR}" "${OUT_DIR}"

          SO_PATH="${RUNNER_TEMP}/mesa-build/src/freedreno/vulkan/libvulkan_freedreno.so"
          cp "${SO_PATH}" "${PKG_DIR}/libvulkan_freedreno.so"

          MESA_VER="${{ steps.clone_mesa.outputs.mesa_src_ver }}"
          VK_VER="${{ steps.clone_mesa.outputs.vk_version }}"
          MESA_TAG="${{ steps.resolve_mesa.outputs.mesa_tag }}"
          MESA_SHA="${{ steps.resolve_mesa.outputs.mesa_sha }}"
          SHORT_SHA="${{ steps.resolve_mesa.outputs.mesa_short_sha }}"
          BUILD_DATE="${{ steps.resolve_mesa.outputs.build_date }}"
          BUILD_ISO="${{ steps.resolve_mesa.outputs.build_iso }}"
          NDK_REV=$(grep '^Pkg.Revision' "${NDK_DIR}/source.properties" | cut -d= -f2 | tr -d ' ' || echo "${NDK_VERSION}")

          cat <<EOF > "${PKG_DIR}/meta.json"
          {
            "schemaVersion": 1,
            "name": "Turnip Mesa ${MESA_VER} (Vulkan ${VK_VER} - Official A750)",
            "description": "100% Unpatched Official Mesa (${MESA_TAG} @ ${SHORT_SHA}) | Vulkan ${VK_VER} | NDK ${NDK_VERSION} (API ${ANDROID_API_LEVEL}) | Built on ${BUILD_ISO} for ${TARGET_GPU_NAME}",
            "author": "Mesa Freedreno Upstream (Automated Pure CI)",
            "packageVersion": "1",
            "vendor": "Mesa",
            "driverVersion": "Mesa ${MESA_VER} / Vulkan ${VK_VER} (${SHORT_SHA})",
            "minApi": ${ADPKG_MIN_API},
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF

          # meta.json şema doğrulaması (Turnip md §5.2)
          jq -e '.schemaVersion == 1 and .vendor == "Mesa" and .minApi == 29 and .libraryName == "libvulkan_freedreno.so"' \
            "${PKG_DIR}/meta.json" > /dev/null

          cat <<EOF > "${PKG_DIR}/BUILD_INFO.txt"
          Driver           : Mesa Turnip (libvulkan_freedreno.so)
          Target SoC / GPU : Qualcomm Snapdragon 8 Gen 3 (SM8650) / Adreno 750 (FD750, Chip-ID 0x43051401)
          Upstream Repo    : ${MESA_REPO_URL}
          Upstream Tag/Ref : ${MESA_TAG} (Mesa ${MESA_VER})
          Vulkan Header    : Vulkan ${VK_VER}
          Upstream Commit  : ${MESA_SHA}
          Build Date (UTC) : ${BUILD_ISO}
          Android NDK      : ${NDK_VERSION} (Pkg.Revision ${NDK_REV}, Target API ${ANDROID_API_LEVEL}, minApi ${ADPKG_MIN_API})
          CPU ISA & Tune   : -march=armv9.2-a+crc+crypto -mtune=${CPU_TUNE}
          Compiler & LTO   : Release (-O3), NDEBUG, LTO=${ENABLE_LTO}, --gc-sections, -Wl,-O2, -static-libstdc++
          Source Purity    : 100% Pure Official Upstream (0 patches applied, 0 runtime env embedded)
          Workflow Run     : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          cp "${PKG_DIR}/BUILD_INFO.txt" "${OUT_DIR}/BUILD_INFO.txt"

          ARTIFACT_BASENAME="Turnip-Upstream-${MESA_VER}-vk${VK_VER}-${SHORT_SHA}-${BUILD_DATE}-SM8650-A750"
          ZIP_NAME="${ARTIFACT_BASENAME}.adpkg.zip"
          ZIP_PATH="${OUT_DIR}/${ZIP_NAME}"

          # Zip kök dizininde (alt klasör olmadan) paketle — libadrenotools standardı
          ( cd "${PKG_DIR}" && zip -9 -q "${ZIP_PATH}" libvulkan_freedreno.so meta.json BUILD_INFO.txt )
          ( cd "${OUT_DIR}" && sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256" )

          echo "artifact_basename=${ARTIFACT_BASENAME}" >> "${GITHUB_OUTPUT}"
          echo "zip_path=${ZIP_PATH}" >> "${GITHUB_OUTPUT}"
          echo "sha256_path=${ZIP_PATH}.sha256" >> "${GITHUB_OUTPUT}"

          echo "--- Üretilen Dosyalar ---"
          ls -lh "${OUT_DIR}"
          echo "--- Zip Kök İçeriği ---"
          unzip -l "${ZIP_PATH}"
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      # 13) Artifact Yükleme (actions/upload-artifact@v6 - Node 24)
      # -----------------------------------------------------------------------
      - name: "13. Paketi GitHub Actions Artifact Olarak Yükle"
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package_driver.outputs.artifact_basename }}
          path: |
            ${{ steps.package_driver.outputs.zip_path }}
            ${{ steps.package_driver.outputs.sha256_path }}
            ${{ runner.temp }}/artifacts/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30

      # -----------------------------------------------------------------------
      # 14) Opsiyonel GitHub Release (Yalnızca İstenirse)
      # -----------------------------------------------------------------------
      - name: "14. Opsiyonel GitHub Release Oluştur"
        if: ${{ github.event_name == 'workflow_dispatch' && env.CREATE_RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REL_TAG="turnip-a750-${{ steps.resolve_mesa.outputs.mesa_tag }}-${{ steps.resolve_mesa.outputs.build_date }}"
          gh release create "${REL_TAG}" \
            "${{ steps.package_driver.outputs.zip_path }}" \
            "${{ steps.package_driver.outputs.sha256_path }}" \
            "${{ runner.temp }}/artifacts/BUILD_INFO.txt" \
            --title "Turnip ${REL_TAG} (Pure Upstream A750)" \
            --notes "100% official unpatched Mesa upstream build from \`${{ steps.resolve_mesa.outputs.mesa_tag }}\` (\`${{ steps.resolve_mesa.outputs.mesa_sha }}\`) | Vulkan \`${{ steps.clone_mesa.outputs.vk_version }}\` | NDK \`${NDK_VERSION}\` (API \`${ANDROID_API_LEVEL}\`) built on \`${{ steps.resolve_mesa.outputs.build_iso }}\` for Snapdragon 8 Gen 3 (Adreno 750)."

      # -----------------------------------------------------------------------
      # 15) GitHub Step Summary (Her Koşulda Ayrıştırılabilir Özet Tablo)
      # -----------------------------------------------------------------------
      - name: "15. GitHub İş Özeti (Step Summary)"
        if: always()
        run: |
          {
            echo "## Turnip (Adreno 750 / SM8650) — Saf Upstream Derleme Özeti"
            echo ""
            echo "| Parametre | Değer |"
            echo "| :--- | :--- |"
            echo "| **Mesa Kaynağı** | \`${{ steps.resolve_mesa.outputs.mesa_tag || 'Bilinmiyor' }}\` (Mesa \`${{ steps.clone_mesa.outputs.mesa_src_ver || '-' }}\`, Commit \`${{ steps.resolve_mesa.outputs.mesa_sha || '-' }}\`) |"
            echo "| **Vulkan API Sürümü** | \`Vulkan ${{ steps.clone_mesa.outputs.vk_version || '1.4.x' }}\` |"
            echo "| **Android NDK & API** | \`${NDK_VERSION}\` (Target API \`${ANDROID_API_LEVEL}\`, minApi \`${ADPKG_MIN_API}\`) |"
            echo "| **CPU ISA & Tune** | \`-march=armv9.2-a+crc+crypto -mtune=${CPU_TUNE}\` |"
            echo "| **Derleme Optimizasyonu** | \`release (-O3) + NDEBUG + LTO (${ENABLE_LTO}) + --gc-sections + -Wl,-O2 + -static-libstdc++\` |"
            echo "| **Kaynak Saflığı** | **%100 Saf Upstream** (0 yama, 0 runtime env gömmesi) |"
            echo "| **Binary Doğrulama** | \`ELF64 + AArch64 + DYN + Bionic Allowlist + vk_icdGetInstanceProcAddr\` |"
            echo "| **Üretilen Artifact** | \`${{ steps.package_driver.outputs.artifact_basename || 'Üretilmedi' }}\` |"
            echo "| **İş Durumu** | \`${{ job.status }}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"
