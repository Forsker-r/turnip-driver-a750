name: Build Official Upstream Turnip A750 (Snapdragon 8 Gen 3)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: "Mesa Git kaynağı: 'stable' (otomatik en son kararlı tag) | 'main' (upstream devel) | doğrudan tag (örn: mesa-26.2.4)"
        required: false
        default: "stable"
        type: string
      ndk_version:
        description: "Resmî Android NDK sürümü (dl.google.com). Kanıtlanmış varsayılan: 'r26d'. Alternatifler: 'r27c', 'r29', 'r30'"
        required: false
        default: "r26d"
        type: string
      enable_lto:
        description: "Link-Time Optimization (Thin LTO) aktif edilsin mi?"
        required: false
        default: true
        type: boolean
      create_release:
        description: "Derleme başarıyla tamamlandığında GitHub Release oluşturulsun mu?"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 4 * * 1" # Her Pazartesi 04:00 UTC

permissions:
  contents: write

concurrency:
  group: turnip-a750-${{ github.ref }}
  cancel-in-progress: true

env:
  MESA_REPO_URL: "https://gitlab.freedesktop.org/mesa/mesa.git"
  NDK_BASE_URL: "https://dl.google.com/android/repository"
  ANDROID_API_LEVEL: "34"
  PLATFORM_SDK_VERSION: "34"
  ADPKG_MIN_API: 29
  TARGET_SOC_GPU: "Snapdragon 8 Gen 3 (SM8650) / Adreno 750 (a7xx_gen3, FD750, 0x43051401)"

jobs:
  build-turnip:
    name: "Turnip Adreno 750 (Pure Upstream Mesa + Official NDK)"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: "1. Depoyu Checkout Et"
        uses: actions/checkout@v4

      - name: "2. Girdileri ve Parametreleri Yapılandır"
        run: |
          set -euo pipefail
          MESA_INPUT="${{ inputs.mesa_ref || 'stable' }}"
          NDK_INPUT="${{ inputs.ndk_version || 'r26d' }}"
          LTO_INPUT="${{ inputs.enable_lto != false && 'true' || 'false' }}"
          
          echo "RESOLVED_MESA_REF=${MESA_INPUT}" >> "$GITHUB_ENV"
          echo "RESOLVED_NDK_VER=${NDK_INPUT}" >> "$GITHUB_ENV"
          echo "RESOLVED_LTO=${LTO_INPUT}" >> "$GITHUB_ENV"
          
          echo "Mesa Kaynak Hedefi : ${MESA_INPUT}"
          echo "Android NDK Sürümü : ${NDK_INPUT}"
          echo "LTO Durumu         : ${LTO_INPUT}"

      - name: "3. Ubuntu & Python Derleme Bağımlılıklarını Kur"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            ccache \
            curl \
            flex \
            bison \
            git \
            jq \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            unzip \
            zip \
            file \
            binutils
          
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet "meson>=1.4.0" "mako>=1.2.0" "pyyaml" "packaging"
          
          echo "Meson  : $(meson --version)"
          echo "Ninja  : $(ninja --version)"
          echo "ccache : $(ccache --version | head -n1)"

      - name: "4. Resmî Mesa Upstream Kararlı Sürümünü Dinamik Olarak Tespit Et"
        id: resolve_mesa
        run: |
          set -euo pipefail
          TAG=""
          if [ "${RESOLVED_MESA_REF}" = "stable" ]; then
            echo "GitLab API üzerinden en güncel kararlı Mesa sürümü aranıyor..."
            API_URL="https://gitlab.freedesktop.org/api/v4/projects/mesa%2Fmesa/releases?per_page=50"
            TAG="$(curl -fsSL --retry 3 --retry-delay 5 "${API_URL}" \
              | jq -r '[.[].tag_name | select(test("^mesa-[0-9]+\\.[0-9]+\\.[0-9]+$"))] | .[0]' || true)"
            
            if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
              echo "::warning::GitLab API yanıt vermedi veya boş döndü. 'git ls-remote' fallback devreye giriyor..."
              TAG="$(git ls-remote --tags --refs "${MESA_REPO_URL}" \
                | awk -F'refs/tags/' '{print $2}' \
                | grep -E '^mesa-[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V \
                | tail -n 1)"
            fi
          elif [ "${RESOLVED_MESA_REF}" = "main" ]; then
            echo "::warning::'main' dalı seçildi. Bu geliştirme sürümüdür (Turnip md §10.2 '-devel taban' riski)."
            TAG="main"
          else
            TAG="${RESOLVED_MESA_REF}"
            echo "Kullanıcı tarafından sabitlenen Mesa ref: ${TAG}"
          fi

          if [ -z "${TAG}" ]; then
            echo "::error::Resmî Mesa deposundan geçerli bir sürüm/tag tespit edilemedi!"
            exit 1
          fi

          # Tag'in işaret ettiği doğrulanmış commit SHA'sını al
          if [ "${TAG}" = "main" ]; then
            RESOLVED_SHA="$(git ls-remote "${MESA_REPO_URL}" "refs/heads/main" | awk '{print $1}')"
          else
            RESOLVED_SHA="$(git ls-remote "${MESA_REPO_URL}" "refs/tags/${TAG}^{}" | awk '{print $1}')"
            if [ -z "${RESOLVED_SHA}" ]; then
              RESOLVED_SHA="$(git ls-remote "${MESA_REPO_URL}" "refs/tags/${TAG}" | awk '{print $1}')"
            fi
          fi

          if [ -z "${RESOLVED_SHA}" ]; then
            echo "::error::'${TAG}' için resmî depoda commit SHA bulunamadı!"
            exit 1
          fi

          SHORT_SHA="${RESOLVED_SHA:0:10}"
          CLEAN_VER="${TAG#mesa-}"
          BUILD_DATE="$(date -u +"%Y%m%d-%H%M")"
          BUILD_DATE_ISO="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          echo "mesa_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "mesa_sha=${RESOLVED_SHA}" >> "$GITHUB_OUTPUT"
          echo "mesa_short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "mesa_version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "build_date_iso=${BUILD_DATE_ISO}" >> "$GITHUB_OUTPUT"

          echo "Tespit Edilen Mesa Kaynağı : ${TAG}"
          echo "Doğrulanan Commit SHA       : ${RESOLVED_SHA}"

      - name: "5. Resmî Android NDK Önbelleğini Kontrol Et"
        id: cache_ndk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-ndk-${{ env.RESOLVED_NDK_VER }}
          key: ndk-${{ env.RESOLVED_NDK_VER }}

      - name: "6. Resmî Android NDK İndir ve Kur (dl.google.com)"
        if: steps.cache_ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NDK_ZIP="${RUNNER_TEMP}/android-ndk-${RESOLVED_NDK_VER}-linux.zip"
          NDK_URL="${NDK_BASE_URL}/android-ndk-${RESOLVED_NDK_VER}-linux.zip"
          
          echo "Resmî Google NDK indiriliyor: ${NDK_URL}"
          curl -fSL --retry 3 --retry-delay 5 -o "${NDK_ZIP}" "${NDK_URL}"
          
          echo "NDK Arşivi açılıyor..."
          unzip -q "${NDK_ZIP}" -d "${RUNNER_TEMP}"
          rm -f "${NDK_ZIP}"

      - name: "7. NDK Yolu ve Doğrulaması"
        run: |
          set -euo pipefail
          NDK_PATH="${RUNNER_TEMP}/android-ndk-${RESOLVED_NDK_VER}"
          if [ ! -f "${NDK_PATH}/source.properties" ]; then
            echo "::error::Geçersiz NDK dizini: ${NDK_PATH}"
            exit 1
          fi
          echo "NDK Doğrulandı:"
          grep "^Pkg.Revision" "${NDK_PATH}/source.properties" || true
          echo "NDK_ROOT=${NDK_PATH}" >> "$GITHUB_ENV"

      - name: "8. ccache Derleyici Önbelleğini Hazırla"
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-turnip-a750-${{ env.RESOLVED_NDK_VER }}-${{ steps.resolve_mesa.outputs.mesa_tag }}-${{ github.run_id }}
          restore-keys: |
            ccache-turnip-a750-${{ env.RESOLVED_NDK_VER }}-${{ steps.resolve_mesa.outputs.mesa_tag }}-
            ccache-turnip-a750-${{ env.RESOLVED_NDK_VER }}-

      - name: "9. Resmî Mesa Kaynak Kodunu İndir (Saf Upstream)"
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/mesa-src"
          git clone --depth 1 --branch "${{ steps.resolve_mesa.outputs.mesa_tag }}" \
            "${MESA_REPO_URL}" "${RUNNER_TEMP}/mesa-src"
          
          cd "${RUNNER_TEMP}/mesa-src"
          CLONED_SHA="$(git rev-parse HEAD)"
          echo "Klonlanan Commit SHA: ${CLONED_SHA}"
          
          # Kaynak saflığı denetimi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Klonlanan kaynak ağacı temiz değil! Kaynak saflığı ihlali."
            exit 1
          fi
          echo "Kaynak saflığı doğrulandı: 0 yama, saf upstream."

      - name: "10. Kendi Kendine Yeten Meson Cross-File Üret"
        run: |
          set -euo pipefail
          NDK_BIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CLANG_CC="${NDK_BIN}/aarch64-linux-android${ANDROID_API_LEVEL}-clang"
          CLANG_CXX="${NDK_BIN}/aarch64-linux-android${ANDROID_API_LEVEL}-clang++"
          LLVM_AR="${NDK_BIN}/llvm-ar"
          LLVM_STRIP="${NDK_BIN}/llvm-strip"
          
          if [ ! -x "${CLANG_CC}" ] || [ ! -x "${CLANG_CXX}" ]; then
            echo "::error::Hedef Clang derleyicisi bulunamadı: ${CLANG_CC}"
            exit 1
          fi

          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --zero-stats

          CROSS_FILE="${RUNNER_TEMP}/cross-android-aarch64.ini"
          cat <<EOF > "${CROSS_FILE}"
          [binaries]
          c = ['ccache', '${CLANG_CC}']
          cpp = ['ccache', '${CLANG_CXX}']
          ar = '${LLVM_AR}'
          strip = '${LLVM_STRIP}'
          c_ld = 'lld'
          cpp_ld = 'lld'
          pkgconfig = 'pkg-config'

          [built-in options]
          c_args = [
            '-march=armv9.2-a+crc+crypto',
            '-mtune=cortex-a720',
            '-ffunction-sections',
            '-fdata-sections',
            '-fno-unwind-tables',
            '-fno-asynchronous-unwind-tables',
            '-D__ANDROID__'
          ]
          cpp_args = [
            '-march=armv9.2-a+crc+crypto',
            '-mtune=cortex-a720',
            '-ffunction-sections',
            '-fdata-sections',
            '-fno-exceptions',
            '-fno-unwind-tables',
            '-fno-asynchronous-unwind-tables',
            '-D__ANDROID__'
          ]
          c_link_args = [
            '-fuse-ld=lld',
            '-Wl,--gc-sections',
            '-Wl,-O2'
          ]
          cpp_link_args = [
            '-fuse-ld=lld',
            '-Wl,--gc-sections',
            '-Wl,-O2',
            '-static-libstdc++'
          ]

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

          echo "CROSS_FILE_PATH=${CROSS_FILE}" >> "$GITHUB_ENV"
          cat "${CROSS_FILE}"

      - name: "11. Meson ile Mesa/Turnip Yapılandır"
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/mesa-src"
          
          BUILD_DIR="${RUNNER_TEMP}/mesa-build"
          rm -rf "${BUILD_DIR}"

          meson setup "${BUILD_DIR}" \
            --cross-file "${CROSS_FILE_PATH}" \
            --wrap-mode=nofallback \
            -Dbuildtype=release \
            -Db_ndebug=true \
            -Dstrip=true \
            -Db_lto=${RESOLVED_LTO} \
            -Dplatforms=android \
            -Dplatform-sdk-version=${PLATFORM_SDK_VERSION} \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-beta=true \
            -Dfreedreno-kmds=kgsl \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglx=disabled \
            -Dllvm=disabled \
            -Dshared-glapi=disabled \
            -Dxmlconfig=disabled \
            -Dzstd=disabled \
            -Dvalgrind=disabled \
            -Dvideo-codecs=

          echo "Yapılandırma sonrası kaynak saflığı kontrol ediliyor..."
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Meson yapılandırması sırasında Mesa kaynak ağacı kirlendi!"
            git status --porcelain
            exit 1
          fi
          echo "Kaynak saflığı onaylandı."
          echo "MESA_BUILD_DIR=${BUILD_DIR}" >> "$GITHUB_ENV"

      - name: "12. Turnip Vulkan Sürücüsünü Derle"
        run: |
          set -euo pipefail
          echo "Ninja ile libvulkan_freedreno.so hedeflenerek derleniyor..."
          ninja -C "${MESA_BUILD_DIR}" src/freedreno/vulkan/libvulkan_freedreno.so
          
          echo "ccache İstatistikleri:"
          ccache --show-stats

      - name: "13. İkili Dosya Doğrulaması (AArch64 + DYN + Bionic + ICD)"
        run: |
          set -euo pipefail
          SO_FILE="${MESA_BUILD_DIR}/src/freedreno/vulkan/libvulkan_freedreno.so"
          
          if [ ! -f "${SO_FILE}" ]; then
            echo "::error::Derlenen sürücü dosyası (libvulkan_freedreno.so) bulunamadı!"
            exit 1
          fi

          echo "Dosya Boyutu: $(stat -c '%s bayt' "${SO_FILE}")"
          FILE_INFO="$(file -b "${SO_FILE}")"
          echo "file Çıktısı: ${FILE_INFO}"

          # 1. Mimari Kontrolü
          if ! readelf -h "${SO_FILE}" | grep -Eq 'Machine:[[:space:]]*AArch64'; then
            echo "::error::Mimari doğrulaması BAŞARISIZ: AArch64 değil!"
            exit 1
          fi

          # 2. ELF Tip Kontrolü
          if ! readelf -h "${SO_FILE}" | grep -Eq 'Type:[[:space:]]*DYN'; then
            echo "::error::ELF tipi doğrulaması BAŞARISIZ: DYN (Shared library) değil!"
            exit 1
          fi

          # 3. Dinamik Bağımlılık Kontrolü (Bionic / Android)
          NEEDED_LIBS="$(readelf -d "${SO_FILE}" | awk -F'[][]' '/\(NEEDED\)/ {print $2}')"
          echo "Bağlanan Dinamik Kütüphaneler:"
          echo "${NEEDED_LIBS}"

          if ! echo "${NEEDED_LIBS}" | grep -qx "libc.so"; then
            echo "::error::Bionic libc.so dinamik bağımlılığı bulunamadı!"
            exit 1
          fi

          if echo "${NEEDED_LIBS}" | grep -Eq 'libc\.so\.6|libstdc\+\+\.so\.6|libgcc_s\.so\.1|libc\+\+_shared\.so'; then
            echo "::error::Masaüstü glibc veya paylaşımlı C++ runtime bağımlılığı tespit edildi!"
            exit 1
          fi

          # İzin verilen Android kütüphaneleri dışındaki harici bağımlılıkları engelle
          ALLOWED_REGEX='^(libc\.so|libm\.so|libdl\.so|liblog\.so|libnativewindow\.so|libsync\.so|libandroid\.so)$'
          for lib in ${NEEDED_LIBS}; do
            if ! echo "${lib}" | grep -Eq "${ALLOWED_REGEX}"; then
              echo "::error::İzin verilmeyen harici dinamik kütüphane saptandı: ${lib}"
              exit 1
            fi
          done

          # 4. Masaüstü WSI Sembol Sızıntısı Kontrolü
          DYN_SYMS="$(readelf --dyn-syms -W "${SO_FILE}")"
          if echo "${DYN_SYMS}" | grep -Eq "vkCreateWaylandSurfaceKHR|vkCreateXcbSurfaceKHR"; then
            echo "::error::Masaüstü Linux (Wayland/X11) WSI sembolleri tespit edildi!"
            exit 1
          fi

          # 5. Vulkan ICD Giriş Sembolü Kontrolü
          if ! echo "${DYN_SYMS}" | grep -q "vk_icdGetInstanceProcAddr"; then
            echo "::error::Vulkan ICD zorunlu sembolü (vk_icdGetInstanceProcAddr) bulunamadı!"
            exit 1
          fi

          echo "Tüm İkili Dosya (Binary) Güvenlik ve Uyumluluk Doğrulamaları Başarıyla Geçti."
          echo "VALIDATED_SO=${SO_FILE}" >> "$GITHUB_ENV"

      - name: "14. AdrenoTools Uyumlu Paketi Oluştur ve Doğrula"
        id: package_driver
        run: |
          set -euo pipefail
          DIST_DIR="${RUNNER_TEMP}/dist_package"
          mkdir -p "${DIST_DIR}"

          cp "${VALIDATED_SO}" "${DIST_DIR}/libvulkan_freedreno.so"

          MESA_VER="${{ steps.resolve_mesa.outputs.mesa_version }}"
          MESA_TAG="${{ steps.resolve_mesa.outputs.mesa_tag }}"
          MESA_SHA="${{ steps.resolve_mesa.outputs.mesa_sha }}"
          SHORT_SHA="${{ steps.resolve_mesa.outputs.mesa_short_sha }}"
          BUILD_DATE="${{ steps.resolve_mesa.outputs.build_date }}"
          BUILD_DATE_ISO="${{ steps.resolve_mesa.outputs.build_date_iso }}"

          # meta.json oluştur
          cat <<EOF > "${DIST_DIR}/meta.json"
          {
            "schemaVersion": 1,
            "name": "Turnip Adreno 750 (Mesa ${MESA_VER})",
            "description": "100% Unpatched Upstream Mesa Turnip for Snapdragon 8 Gen 3 (Adreno 750). Built from official upstream ${MESA_TAG} (${SHORT_SHA}) on ${BUILD_DATE_ISO}.",
            "author": "CI Automated Official Build",
            "packageVersion": "1",
            "vendor": "Mesa",
            "driverVersion": "${MESA_VER} (${SHORT_SHA})",
            "minApi": ${ADPKG_MIN_API},
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF

          # meta.json JSON şemasını doğrula
          jq -e '.schemaVersion == 1 and .minApi == 29 and .libraryName == "libvulkan_freedreno.so"' "${DIST_DIR}/meta.json" > /dev/null

          # Tam izlenebilirlik için BUILD-INFO.txt oluştur
          cat <<EOF > "${DIST_DIR}/BUILD-INFO.txt"
          ================================================================================
          TURNIP VULKAN SÜRÜCÜSÜ DERLEME BİLGİSİ
          ================================================================================
          Hedef Platform    : ${TARGET_SOC_GPU}
          Mesa Kaynağı      : ${MESA_REPO_URL}
          Mesa Etiketi/Dal  : ${MESA_TAG}
          Mesa Commit SHA   : ${MESA_SHA}
          Android NDK       : ${RESOLVED_NDK_VER} (dl.google.com resmî dağıtımı)
          Hedef API Seviyesi: Android API ${ANDROID_API_LEVEL} (minApi ${ADPKG_MIN_API})
          Derleyici Hedefi  : -march=armv9.2-a+crc+crypto -mtune=cortex-a720
          Optimizasyonlar   : -O3, NDEBUG, LTO=${RESOLVED_LTO}, dead-code gc-sections, lld -O2
          Kaynak Saflığı    : %100 Saf Resmî Upstream (Uygulanan Yama Sayısı: 0)
          Runtime Ayarları  : Gömülmedi (Tamamen upstream sürücü varsayılanları)
          Derleme Tarihi UTC: ${BUILD_DATE_ISO}
          GitHub Run ID     : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          ================================================================================
          EOF

          ARTIFACT_BASE="Turnip-Upstream-${MESA_VER}-${SHORT_SHA}-${BUILD_DATE}-SM8650-A750"
          ZIP_FILE="${RUNNER_TEMP}/${ARTIFACT_BASE}.adpkg.zip"

          cd "${DIST_DIR}"
          zip -9 -r "${ZIP_FILE}" libvulkan_freedreno.so meta.json BUILD-INFO.txt
          sha256sum "${ZIP_FILE}" > "${ZIP_FILE}.sha256"

          echo "artifact_name=${ARTIFACT_BASE}" >> "$GITHUB_OUTPUT"
          echo "zip_path=${ZIP_FILE}" >> "$GITHUB_OUTPUT"
          echo "sha256_path=${ZIP_FILE}.sha256" >> "$GITHUB_OUTPUT"

          echo "Paket başarıyla oluşturuldu:"
          ls -lh "${ZIP_FILE}" "${ZIP_FILE}.sha256"

      - name: "15. Derleme Paketini Artifact Olarak Yükle"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_driver.outputs.artifact_name }}
          path: |
            ${{ steps.package_driver.outputs.zip_path }}
            ${{ steps.package_driver.outputs.sha256_path }}
          retention-days: 30
          if-no-files-found: error

      - name: "16. Opsiyonel GitHub Release Oluştur"
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_TAG="v${{ steps.resolve_mesa.outputs.mesa_version }}-${{ steps.resolve_mesa.outputs.mesa_short_sha }}"
          
          # Aynı tag varsa kontrol et, yoksa oluştur
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              "${{ steps.package_driver.outputs.zip_path }}" \
              "${{ steps.package_driver.outputs.sha256_path }}" \
              --title "Turnip Adreno 750 (Mesa ${{ steps.resolve_mesa.outputs.mesa_version }})" \
              --notes "### Mesa Turnip Adreno 750 (Snapdragon 8 Gen 3) Resmî Upstream Derlemesi
              
              - **Mesa Upstream Tag**: \`${{ steps.resolve_mesa.outputs.mesa_tag }}\`
              - **Commit SHA**: \`${{ steps.resolve_mesa.outputs.mesa_sha }}\`
              - **Kaynak Saflığı**: %100 Resmî Upstream, Sıfır Yama
              - **NDK Sürümü**: \`${{ env.RESOLVED_NDK_VER }}\` (Android API ${{ env.ANDROID_API_LEVEL }})
              - **CPU Optimizasyonu**: \`-march=armv9.2-a+crc+crypto -mtune=cortex-a720\`
              - **Derleme Tarihi**: \`${{ steps.resolve_mesa.outputs.build_date_iso }}\`"
          else
            gh release upload "${RELEASE_TAG}" \
              "${{ steps.package_driver.outputs.zip_path }}" \
              "${{ steps.package_driver.outputs.sha256_path }}" \
              --clobber
          fi

      - name: "17. GitHub Step Summary Raporu Oluştur"
        if: always()
        run: |
          {
            echo "## 🚀 Turnip Adreno 750 Resmî Upstream Derleme Özeti"
            echo ""
            echo "| Parametre | Değer |"
            echo "| :--- | :--- |"
            echo "| **Hedef Donanım** | Snapdragon 8 Gen 3 / Adreno 750 (\`a7xx_gen3\`, \`0x43051401\`) |"
            echo "| **Mesa Kaynağı** | Resmî Upstream GitLab (\`${{ steps.resolve_mesa.outputs.mesa_tag || 'Tespit Edilemedi' }}\`) |"
            echo "| **Commit SHA** | \`${{ steps.resolve_mesa.outputs.mesa_sha || 'N/A' }}\` |"
            echo "| **Android NDK** | \`${{ env.RESOLVED_NDK_VER }}\` (API ${{ env.ANDROID_API_LEVEL }}) |"
            echo "| **ISA / Tune** | \`-march=armv9.2-a+crc+crypto -mtune=cortex-a720\` |"
            echo "| **Optimizasyonlar** | Release (-O3), NDEBUG, Thin LTO, Dead-Code Elimination (\`--gc-sections\`), lld -O2 |"
            echo "| **Kaynak Saflığı** | **%100 Saf Upstream** (0 yama, 0 üçüncü taraf müdahalesi) |"
            echo "| **Binary Doğrulama** | AArch64 + DYN + Yalnızca Bionic + ICD Entrypoint (\`vk_icdGetInstanceProcAddr\`) |"
            echo "| **Paket Biçimi** | AdrenoTools Uyumlu (.adpkg.zip + meta.json) |"
            echo "| **İş Akışı Durumu** | **${{ job.status }}** |"
          } >> "$GITHUB_STEP_SUMMARY"
