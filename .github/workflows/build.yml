name: Build Turnip A750
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ═══════════════════════════════════════════
      # 1. GÜNCEL DERLEME BAĞIMLILIKLARI
      # ═══════════════════════════════════════════
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-mako python3-ply python3-yaml \
            bison flex byacc ninja-build \
            glslang-tools spirv-tools zip
          python3 -m pip install --break-system-packages --upgrade meson

      - name: Setup Android NDK r27
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      # ═══════════════════════════════════════════
      # 2. RESMİ MESA KAYNAK KODU VE LTO KİLİDİNİ AÇMA
      # ═══════════════════════════════════════════
      - name: Clone Official Mesa (Recent 500 Commits)
        run: |
          git clone --depth=500 https://gitlab.freedesktop.org/mesa/mesa.git
          cd mesa
          echo "Current Mesa HEAD: $(git log --oneline -1)"
          # Mesa içindeki "Building Mesa with LTO is not supported" engelini kaldırıyoruz:
          sed -i "s/error('Building Mesa with LTO/warning('Building Mesa with LTO/g" meson.build

      # ═══════════════════════════════════════════
      # 3. SUBPROJECT TEMİZLİĞİ & SADECE LIBDRM WRAP
      # ═══════════════════════════════════════════
      - name: Setup libdrm wrap and clean broken wraps
        run: |
          mkdir -p mesa/subprojects
          # libarchive, zstd vb. Android'de çöken TÜM gereksiz wrap dosyalarını siliyoruz:
          rm -f mesa/subprojects/*.wrap

          cat > mesa/subprojects/libdrm.wrap << 'WRAPEOF'
          [wrap-git]
          directory = libdrm
          url = https://gitlab.freedesktop.org/mesa/drm.git
          revision = main
          depth = 1

          [provide]
          libdrm = ext_libdrm
          WRAPEOF

      # ═══════════════════════════════════════════
      # 4. YAMALAR
      # ═══════════════════════════════════════════
      - name: Apply patches
        run: |
          cd mesa
          echo "Yama adımı hazır."

      # ═══════════════════════════════════════════
      # 5. CROSS-FILE (CORTEX-X4 & ARMV9.2-A OPTİMİZASYONU)
      # ═══════════════════════════════════════════
      - name: Generate Meson Cross File
        run: |
          NDK="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          cat > cross-file.txt << EOF
          [binaries]
          c = '${NDK}/bin/aarch64-linux-android33-clang'
          cpp = '${NDK}/bin/aarch64-linux-android33-clang++'
          ar = '${NDK}/bin/llvm-ar'
          strip = '${NDK}/bin/llvm-strip'
          c_ld = 'lld'
          cpp_ld = 'lld'
          pkgconfig = '/bin/false'
          pkg-config = '/bin/false'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'

          [built-in options]
          c_args = ['-march=armv9.2-a', '-mtune=cortex-x4', '-O3', '-fomit-frame-pointer', '-fno-math-errno', '-ffunction-sections', '-fdata-sections', '-D__ANDROID__', '-Wno-error']
          cpp_args = ['-march=armv9.2-a', '-mtune=cortex-x4', '-O3', '-fomit-frame-pointer', '-fno-math-errno', '-ffunction-sections', '-fdata-sections', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '-D__ANDROID__', '-Wno-error']
          c_link_args = ['-fuse-ld=lld', '-Wl,--gc-sections', '-static-libstdc++']
          cpp_link_args = ['-fuse-ld=lld', '-Wl,--gc-sections', '-static-libstdc++']
          EOF

      # ═══════════════════════════════════════════
      # 6. MESON SETUP (THINLTO AKTİF & BOOLEAN DÜZELTİLDİ)
      # ═══════════════════════════════════════════
      - name: Meson Setup
        run: |
          cd mesa
          meson setup build \
            --cross-file ../cross-file.txt \
            --force-fallback-for=libdrm \
            -Dlibdrm:default_library=static \
            -Dlibdrm:tests=false \
            -Dlibdrm:valgrind=disabled \
            -Dbuildtype=release \
            -Db_ndebug=true \
            -Db_lto=true \
            -Db_lto_mode=thin \
            -Dstrip=true \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dplatform-sdk-version=33 \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-beta=true \
            -Dfreedreno-kmds=kgsl \
            -Dgallium-drivers= \
            -Degl=disabled \
            -Dzstd=disabled \
            -Dzlib=enabled \
            -Dxmlconfig=disabled \
            -Dllvm=disabled \
            -Dspirv-to-dxil=false \
            -Dandroid-libbacktrace=disabled \
            -Dvalgrind=disabled \
            -Dvideo-codecs=

      # ═══════════════════════════════════════════
      # 7. SÜRÜCÜYÜ DERLE (NINJA)
      # ═══════════════════════════════════════════
      - name: Build with Ninja
        run: ninja -C mesa/build

      # ═══════════════════════════════════════════
      # 8. PAKETLEME (ADRENOTOOLS & LLVM-STRIP)
      # ═══════════════════════════════════════════
      - name: Package Driver
        run: |
          NDK="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          mkdir -p package

          cp mesa/build/src/freedreno/vulkan/libvulkan_freedreno.so package/
          ${NDK}/bin/llvm-strip --strip-unneeded package/libvulkan_freedreno.so

          MESA_VER=$(cat mesa/VERSION 2>/dev/null || echo "git")
          cat > package/meta.json << METAEOF
          {
            "schemaVersion": 1,
            "name": "Turnip A750 Custom",
            "description": "Snapdragon 8 Gen 3 (Adreno 750) — Cortex-X4 Tuned + ThinLTO",
            "author": "Forsker-r",
            "packageVersion": "1",
            "vendor": "Mesa/Freedreno",
            "driverVersion": "Vulkan 1.3 (Mesa ${MESA_VER})",
            "minApi": 33,
            "libraryName": "libvulkan_freedreno.so"
          }
          METAEOF

          cd package
          ZIP_NAME="Turnip-A750-$(date +%Y%m%d).zip"
          zip -9 "${ZIP_NAME}" libvulkan_freedreno.so meta.json
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          ls -lh *.zip

      # ═══════════════════════════════════════════
      # 9. ÇIKTIYI İNDİRİLEBİLİR YAP (ARTIFACTS)
      # ═══════════════════════════════════════════
      - name: Upload Driver ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-A750-Driver
          path: package/*.zip
