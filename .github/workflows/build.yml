# =============================================================================
# turnip-driver-a750 — %100 Resmî Mesa Upstream Turnip Derleme Hattı
# Hedef: Snapdragon 8 Gen 3 (SM8650) / Adreno 750 (FD750 = a7xx_gen3, 0x43051401)
#
# GARANTILER:
#  * Hiçbir yama/patch uygulanmaz (git apply / patch / sed / awk YOK).
#  * Mesa kaynak ağacında tek bir dosya bile değiştirilmez.
#  * Kaynak yalnızca resmî Mesa upstream'den (gitlab.freedesktop.org/mesa/mesa) alınır.
#  * Toolchain yalnızca resmî Android NDK'den (dl.google.com) alınır.
#  * Runtime davranış ayarları (TU_DEBUG, TU_AUTOTUNE_ALGO, TU_GMEM,
#    FD_DEV_FEATURES, driconf) build'e GÖMÜLMEZ.
#  * Paketlemeden önce binary doğrulaması: AArch64 + ELF DYN + bionic-only
#    bağımlılıkları + ICD giriş noktası + Linux WSI sızdırmama kontrolü.
#  * Meson parametre çekirdeği: Turnip md §6.4 kanıtlanmış build_android.sh +
#    CPU/GPU md §2.1–§2.3 ISA hedefleme.
# =============================================================================

name: build-turnip-a750

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: >-
          Mesa kaynağı: 'stable' (en son resmî stable tag, dinamik tespit) |
          'main' (bleeding-edge; Turnip md §10.2 devel riski) |
          doğrudan tag (örn. mesa-26.2.4)
        required: false
        default: "stable"
        type: string
      ndk_version:
        description: >-
          Resmî Android NDK sürümü. Varsayılan 'r26d' — Turnip md §6.4/§6.1
          birincil kaynak kanıtı (Droid-Deck build_android.sh). En güncel: 'r30'.
        required: false
        default: "r26d"
        type: string
      ndk_sha256:
        description: >-
          NDK zip SHA256 (dl.google.com resmî hash; boş bırakılırsa SHA256
          doğrulaması atlanır ve uyarı basılır)
        required: false
        default: ""
        type: string
      enable_lto:
        description: >-
          Thin LTO aç (varsayılan KAPALI — dokümanda LTO kanıtı yok;
          prompt alan 4 izin verir; cihaz testi olmadan kesin iddia üretilmez)
        required: false
        default: false
        type: boolean
  # OPSİYONEL: haftalık otomatik derleme — açmak için yorum kaldırın
  # schedule:
  #   - cron: "0 4 * * 1"   # her Pazartesi 04:00 UTC

permissions:
  contents: read

concurrency:
  group: build-turnip-a750-${{ github.ref }}
  cancel-in-progress: true

env:
  # --- Resmî kaynaklar (VERİ KAYNAĞI GÜVENLİĞİ kuralı) ----------------------
  MESA_REPO: https://gitlab.freedesktop.org/mesa/mesa.git
  NDK_URL_BASE: https://dl.google.com/android/repository
  # --- Turnip md §6.4 kanıtlanmış değerler ------------------------------------
  CROSS_API: "34"                  # cross-file: aarch64-linux-android34-clang
  PLATFORM_SDK_VERSION: "36"       # -Dplatform-sdk-version (Droid-Deck kanıtı)
  ADPKG_MIN_API: "29"             # libadrenotools minimum Android sürümü

jobs:
  build:
    name: Turnip A750 — yamasız upstream (aarch64, KGSL)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # -----------------------------------------------------------------------
      # 1) Girdiler
      # -----------------------------------------------------------------------
      - name: "Girdiler: workflow parametrelerini ortam değişkenlerine aktar"
        run: |
          set -euo pipefail
          {
            echo "MESA_REF=${{ inputs.mesa_ref || 'stable' }}"
            echo "NDK_VERSION=${{ inputs.ndk_version || 'r26d' }}"
            echo "NDK_SHA256=${{ inputs.ndk_sha256 || '' }}"
            echo "ENABLE_LTO=${{ inputs.enable_lto || 'false' }}"
          } >> "$GITHUB_ENV"
          echo "=== Derleme Girdileri ==="
          echo "mesa_ref    : ${{ inputs.mesa_ref || 'stable' }}"
          echo "ndk_version : ${{ inputs.ndk_version || 'r26d' }}"
          echo "sha256 var  : ${{ inputs.ndk_sha256 != '' && 'evet' || 'hayır' }}"
          echo "enable_lto  : ${{ inputs.enable_lto || 'false' }}"

      # -----------------------------------------------------------------------
      # 2) Depo checkout (Mesa kaynağı DEĞİLDİR — yalnız workflow dosyaları)
      # -----------------------------------------------------------------------
      - name: "Checkout: turnip-driver-a750 deposu"
        uses: actions/checkout@v4  # Node.js 24 uyumlu; pin için: ghcr.io/actions/checkout

      # -----------------------------------------------------------------------
      # 3) Derleme bağımlılıkları
      # -----------------------------------------------------------------------
      - name: "Bağımlılıklar: meson/ninja/python/araçlar"
        run: |
          set -euo pipefail
          echo "::group::APT Paket Kurulumu"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            ccache \
            curl \
            flex \
            bison \
            gettext \
            git \
            glslang-tools \
            jq \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            unzip \
            xz-utils \
            zip \
            zstd \
            binutils \
            file
          echo "::endgroup::"

          echo "::group::Python derleme araçları"
          python3 -m pip install --upgrade pip --quiet
          python3 -m pip install "meson>=1.4.0" "mako>=1.2.0" "pyyaml" "packaging" --quiet
          echo "meson  : $(meson --version)"
          echo "ninja  : $(ninja --version)"
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      # 4) NDK önbelleği
      # -----------------------------------------------------------------------
      - name: "Cache: resmî Android NDK"
        id: cache_ndk
        uses: actions/cache@v4  # Node.js 24 uyumlu
        with:
          path: ${{ runner.temp }}/android-ndk
          key: ndk-linux-${{ env.NDK_VERSION }}-v1

      # -----------------------------------------------------------------------
      # 5) NDK indirme ve doğrulama
      # -----------------------------------------------------------------------
      - name: "Toolchain: resmî Android NDK indir, doğrula ve aç (dl.google.com)"
        if: steps.cache_ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          URL="${NDK_URL_BASE}/${NDK_ZIP}"
          NDK_ROOT="${RUNNER_TEMP}/android-ndk"
          mkdir -p "${NDK_ROOT}"

          echo "İndiriliyor (resmî Google kanalı): ${URL}"
          curl -fSL --retry 3 --retry-delay 5 -o "${RUNNER_TEMP}/${NDK_ZIP}" "${URL}"

          if [ -n "${NDK_SHA256}" ]; then
            echo "SHA256 doğrulanıyor..."
            echo "${NDK_SHA256}  ${RUNNER_TEMP}/${NDK_ZIP}" | sha256sum -c - \
              || { echo "::error::NDK SHA256 doğrulaması BAŞARISIZ — arşiv resmî olmayabilir."; exit 1; }
            echo "SHA256 doğrulaması TAMAM."
          else
            echo "::warning::ndk_sha256 boş — SHA256 doğrulaması atlandı. Resmî hash için: dl.google.com/android/repository/repository2-1.xml"
          fi

          unzip -q "${RUNNER_TEMP}/${NDK_ZIP}" -d "${NDK_ROOT}"
          echo "NDK açıldı: ${NDK_ROOT}/android-ndk-${NDK_VERSION}"

      - name: "Toolchain: NDK dizinini ortam değişkenine aktar"
        run: |
          set -euo pipefail
          NDK_DIR="${RUNNER_TEMP}/android-ndk/android-ndk-${NDK_VERSION}"
          [ -f "${NDK_DIR}/source.properties" ] \
            || { echo "::error::NDK dizini beklendiği gibi değil: ${NDK_DIR}"; exit 1; }
          echo "NDK Revision: $(grep '^Pkg.Revision=' "${NDK_DIR}/source.properties" | cut -d= -f2)"
          echo "NDK_DIR=${NDK_DIR}" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # 6) Dinamik Mesa sürüm tespiti (GitLab API + ls-remote fallback)
      #    Stable: ^X.Y.Z$ regex — rc tag'leri dışlanır (Turnip md §1.4/§10.2)
      # -----------------------------------------------------------------------
      - name: "Sürüm tespiti: resmî Mesa stable tag (dinamik)"
        run: |
          set -euo pipefail
          TAG=""
          if [ "${MESA_REF}" = "stable" ]; then
            API="https://gitlab.freedesktop.org/api/v4/projects/mesa%2Fmesa/releases?per_page=50"
            echo "GitLab releases API sorgulanıyor: ${API}"
            TAG="$(curl -fsSL --retry 3 --retry-delay 5 "${API}" \
              | jq -r '[.[].tag_name | select(test("^mesa-[0-9]+\\.[0-9]+\\.[0-9]+$"))] | .[0]' \
              2>/dev/null || true)"
            if [ -z "${TAG}" ]; then
              echo "::warning::GitLab API yanıt vermedi — git ls-remote fallback kullanılıyor."
              TAG="$(git ls-remote --tags --refs "${MESA_REPO}" \
                | awk -F/ '{print $NF}' \
                | grep -E '^mesa-[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V | tail -n1 || true)"
            fi
          elif [ "${MESA_REF}" = "main" ]; then
            echo "::warning::'main' seçildi — Turnip md §10.2 devel taban riski kullanıcıya aittir."
            TAG="main"
          else
            TAG="${MESA_REF}"
            echo "Kullanıcı tag'i zorlandı: ${TAG}"
          fi

          [ -n "${TAG}" ] \
            || { echo "::error::Mesa sürümü tespit edilemedi — resmî repo erişilemiyor olabilir."; exit 1; }

          echo "Seçilen Mesa sürümü: ${TAG}"
          echo "MESA_TAG=${TAG}" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # 7) Mesa kaynak indirme + saflık denetimi
      # -----------------------------------------------------------------------
      - name: "Kaynak: resmî Mesa upstream clone (shallow)"
        run: |
          set -euo pipefail
          echo "::group::Mesa Clone (${MESA_TAG})"
          git clone --depth 1 --branch "${MESA_TAG}" "${MESA_REPO}" "${RUNNER_TEMP}/mesa-src" \
            || { echo "::error::Clone başarısız: ${MESA_REPO} @ ${MESA_TAG}"; exit 1; }

          COMMIT="$(git -C "${RUNNER_TEMP}/mesa-src" rev-parse HEAD)"
          echo "Mesa commit SHA: ${COMMIT}"
          echo "MESA_COMMIT=${COMMIT}" >> "$GITHUB_ENV"
          echo "MESA_COMMIT_SHORT=${COMMIT:0:7}" >> "$GITHUB_ENV"

          # Kaynak saflığı denetimi — temiz olmalı
          if [ -n "$(git -C "${RUNNER_TEMP}/mesa-src" status --porcelain)" ]; then
            echo "::error::Kaynak ağacı kirli — kaynak saflığı bozulmuş."
            git -C "${RUNNER_TEMP}/mesa-src" status --porcelain
            exit 1
          fi
          echo "Kaynak saflığı: TEMIZ (yamasız saf upstream)"
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      # 8) Üstveri: sürüm + tarih + hash → artifact adı
      # -----------------------------------------------------------------------
      - name: "Üstveri: artifact adı ve build tarihi"
        run: |
          set -euo pipefail
          BUILD_DATE="$(date -u +%Y%m%d-%H%M)"
          MESA_VERSION_CLEAN="${MESA_TAG#mesa-}"
          echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"
          echo "MESA_VERSION_CLEAN=${MESA_VERSION_CLEAN}" >> "$GITHUB_ENV"
          echo "ARTIFACT_BASE=Turnip-upstream-${MESA_TAG}-${MESA_COMMIT_SHORT}-${BUILD_DATE}" >> "$GITHUB_ENV"
          echo "Artifact adı: Turnip-upstream-${MESA_TAG}-${MESA_COMMIT_SHORT}-${BUILD_DATE}"

      # -----------------------------------------------------------------------
      # 9) ccache yapılandırması
      # -----------------------------------------------------------------------
      - name: "Cache: ccache derleyici nesne önbelleği"
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.ccache
          key: ccache-a750-${{ env.NDK_VERSION }}-${{ env.MESA_TAG }}-${{ github.run_id }}
          restore-keys: |
            ccache-a750-${{ env.NDK_VERSION }}-${{ env.MESA_TAG }}-
            ccache-a750-${{ env.NDK_VERSION }}-

      # -----------------------------------------------------------------------
      # 10) Meson cross-file üretimi + yapılandırma
      #     Çekirdek: Turnip md §6.4 kanıtlanmış Droid-Deck build_android.sh
      #     ISA: CPU/GPU md §2.1 (tüm çekirdekler ARMv9.2-A) + §2.3 (TuneX4)
      #     NOT: NDK r26d'de build/meson/ built-in cross-file YOKTUR.
      #          Cross-file NDK toolchain bin yollarına göre manuel üretilir.
      # -----------------------------------------------------------------------
      - name: "Meson: cross-file oluştur + kanıtlanmış parametrelerle yapılandır"
        run: |
          set -euo pipefail
          NDK_TOOLCHAIN="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="${NDK_TOOLCHAIN}:${PATH}"

          # NDK toolchain derleyicisini doğrula
          CLANG_BIN="${NDK_TOOLCHAIN}/aarch64-linux-android${CROSS_API}-clang"
          if [ ! -x "${CLANG_BIN}" ]; then
            echo "::error::NDK clang bulunamadı: ${CLANG_BIN}"
            echo "Mevcut clang binary'leri:"; ls -1 "${NDK_TOOLCHAIN}/aarch64-linux-android"*-clang 2>/dev/null || true
            exit 1
          fi
          echo "NDK clang: ${CLANG_BIN}"

          # ccache yapılandır
          ccache --set-config=max_size=1G
          ccache --set-config=compression=true
          ccache --zero-stats

          # Meson cross-file manuel üret (Turnip md §6.4 Droid-Deck cross-file şablonu)
          # NDK r26d'de build/meson/ built-in cross-file yoktur; toolchain bin'den üretilir.
          CROSS="${RUNNER_TEMP}/android-aarch64-sm8650.ini"
          cat > "${CROSS}" << CROSSEOF
          [binaries]
          c = ['ccache', '${NDK_TOOLCHAIN}/aarch64-linux-android${CROSS_API}-clang']
          cpp = ['ccache', '${NDK_TOOLCHAIN}/aarch64-linux-android${CROSS_API}-clang++']
          ar = '${NDK_TOOLCHAIN}/llvm-ar'
          strip = '${NDK_TOOLCHAIN}/llvm-strip'
          c_ld = 'lld'
          cpp_ld = 'lld'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          CROSSEOF

          echo "Cross-file oluşturuldu: ${CROSS}"
          cat "${CROSS}"

          # ISA hedefleme:
          # -march=armv9.2-a: CPU/GPU md §2.1 (X4+A720+A520 tümü ARMv9.2-A, AArch64-only)
          #                    imli FEAT seti: DotProd, FP16, BF16, I8MM, LSE, LRCPC2 vb.
          # -mtune=cortex-x4: CPU/GPU md §2.3 (TuneX4: FuseAES, FuseAdrpAdd,
          #                    FuseCmpCSel, FuseCmpCSet, ALULSLFast, AvoidLDAPUR)
          #                    Yalnız zamanlama sezgisi — doğruluk riski yok (Varsayım V4)
          ARCH_ARGS="-march=armv9.2-a -mtune=cortex-x4"

          # Turnip md §6.4 kanıtlanmış CXXFLAGS + ölü kod ayıklama
          C_ARGS="${ARCH_ARGS} -fno-unwind-tables -fno-asynchronous-unwind-tables -ffunction-sections -fdata-sections"
          CPP_ARGS="${ARCH_ARGS} -fno-exceptions -fno-unwind-tables -fno-asynchronous-unwind-tables -ffunction-sections -fdata-sections"
          LINK_ARGS="-Wl,--gc-sections -Wl,-O2"
          CPP_LINK_ARGS="${LINK_ARGS} -static-libstdc++"

          # LTO (varsayılan KAPALI — dokümanda kanıt yok; Varsayım V5)
          LTO_ARGS=()
          if [ "${ENABLE_LTO}" = "true" ]; then
            LTO_ARGS=(-Db_lto=true -Db_lto_mode=thin)
            echo "::warning::Thin LTO AÇIK (Varsayım — cihaz testi olmadan performans iddiası üretilmez)"
          fi

          meson setup "${RUNNER_TEMP}/mesa-build" "${RUNNER_TEMP}/mesa-src" \
            --cross-file "${CROSS}" \
            --wrap-mode=nofallback \
            -Dbuildtype=release \
            -Dstrip=true \
            -Db_ndebug=if-release \
            -Dplatforms=android \
            -Dplatform-sdk-version="${PLATFORM_SDK_VERSION}" \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-beta=true \
            -Dfreedreno-kmds=kgsl \
            -Degl=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dllvm=disabled \
            -Dosmesa=disabled \
            -Dxmlconfig=disabled \
            -Dvideo-codecs= \
            -Dzstd=disabled \
            -Dvalgrind=disabled \
            -Dc_args="${C_ARGS}" \
            -Dcpp_args="${CPP_ARGS}" \
            -Dc_link_args="${LINK_ARGS}" \
            -Dcpp_link_args="${CPP_LINK_ARGS}" \
            "${LTO_ARGS[@]}"

          echo "::group::Meson yapılandırma özeti"
          meson configure "${RUNNER_TEMP}/mesa-build" | head -80
          echo "::endgroup::"

          # Meson setup sonrası kaynak saflığı denetimi
          if [ -n "$(git -C "${RUNNER_TEMP}/mesa-src" status --porcelain)" ]; then
            echo "::error::Meson setup sonrasında Mesa kaynak ağacı kirli — saflık ihlali!"
            git -C "${RUNNER_TEMP}/mesa-src" status --porcelain
            exit 1
          fi
          echo "Meson sonrası kaynak saflığı: TAMAM"

      # -----------------------------------------------------------------------
      # 11) Derleme (yalnız hedef SO — daha hızlı)
      # -----------------------------------------------------------------------
      - name: "Derle: ninja → libvulkan_freedreno.so"
        run: |
          set -euo pipefail
          export PATH="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin:${PATH}"
          ninja -C "${RUNNER_TEMP}/mesa-build" src/freedreno/vulkan/libvulkan_freedreno.so
          ccache --show-stats
          echo "Derleme tamamlandı."

      # -----------------------------------------------------------------------
      # 12) Çıktıyı konumlandır
      # -----------------------------------------------------------------------
      - name: "Çıktı: libvulkan_freedreno.so konumlandırma"
        run: |
          set -euo pipefail
          SO="$(find "${RUNNER_TEMP}/mesa-build" -type f -name 'libvulkan_freedreno.so' | head -n1)"
          if [ -z "${SO}" ]; then
            echo "::error::libvulkan_freedreno.so üretilmedi."
            echo "Build ağacındaki .so dosyaları:"
            find "${RUNNER_TEMP}/mesa-build" -name '*.so' | head -20
            exit 1
          fi
          echo "Üretilen sürücü: ${SO} ($(stat -c '%s bayt' "${SO}"))"
          ls -lh "${SO}"
          echo "SO_PATH=${SO}" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # 13) Binary doğrulama — Turnip md §5.2 paket doğrulama tablosu
      #     AArch64 + DYN + bionic-only + ICD sembolü + Linux WSI dışlama
      # -----------------------------------------------------------------------
      - name: "Doğrulama: AArch64 + DYN + bionic-only + ICD + WSI temizliği"
        run: |
          set -euo pipefail
          SO="${SO_PATH}"
          FAIL=0

          # [1/6] file -b AArch64 kontrolü
          FILE_OUT="$(file -b "${SO}")"
          echo "file -b     : ${FILE_OUT}"
          if ! echo "${FILE_OUT}" | grep -q "ARM aarch64"; then
            echo "::error::Doğrulama[1/6] HATA: file -b AArch64 değil."; FAIL=1
          fi

          ELF_HEADER="$(readelf -h "${SO}")"

          # [2/6] ELF Machine AArch64
          if ! echo "${ELF_HEADER}" | grep -Eq 'Machine:[[:space:]]*AArch64'; then
            echo "::error::Doğrulama[2/6] HATA: ELF Machine AArch64 değil."; FAIL=1
          fi

          # [3/6] ELF Type DYN
          if ! echo "${ELF_HEADER}" | grep -Eq 'Type:[[:space:]]*DYN'; then
            echo "::error::Doğrulama[3/6] HATA: ELF tipi DYN değil."; FAIL=1
          fi

          # [4/6] bionic libc.so zorunlu + allowlist kontrolü
          NEEDED="$(readelf -d "${SO}" | awk '/\(NEEDED\)/{print $NF}' | tr -d '[]')"
          echo "NEEDED libs : ${NEEDED:-yok}"
          if ! echo "${NEEDED}" | grep -qx 'libc.so'; then
            echo "::error::Doğrulama[4/6] HATA: bionic libc.so bağımlılığı yok (Turnip md §5.2)."; FAIL=1
          fi
          # İzin verilen bionic kütüphaneleri (allowlist)
          ALLOWED_REGEX='^(libc\.so|libm\.so|libdl\.so|liblog\.so|libnativewindow\.so|libsync\.so|libandroid\.so)$'
          for lib in ${NEEDED}; do
            if ! echo "${lib}" | grep -Eq "${ALLOWED_REGEX}"; then
              echo "::error::Doğrulama[4/6] HATA: İzin verilmeyen kütüphane: ${lib} (glibc/libc++_shared yasak)"; FAIL=1
            fi
          done

          DYN_SYMS="$(readelf --dyn-syms -W "${SO}")"

          # [5/6] Vulkan ICD giriş noktası
          if ! echo "${DYN_SYMS}" | grep -q 'vk_icdGetInstanceProcAddr'; then
            echo "::error::Doğrulama[5/6] HATA: vk_icdGetInstanceProcAddr dışa aktarılmıyor — sürücü ICD olarak yüklenemez."; FAIL=1
          fi

          # [6/6] Linux masaüstü WSI sembol sızıntısı
          if echo "${DYN_SYMS}" | grep -Eq 'vkCreateWaylandSurfaceKHR|vkCreateXcbSurfaceKHR|vkCreateXlibSurfaceKHR'; then
            echo "::error::Doğrulama[6/6] HATA: Linux masaüstü WSI sembolleri Android sürücüsüne sızmış."; FAIL=1
          fi

          # Android nota (bilgi amaçlı)
          echo "Android nota: $(readelf -n "${SO}" 2>/dev/null | grep -i 'android\|api' | head -n3 || echo 'yok')"

          if [ "${FAIL}" -ne 0 ]; then
            echo "::error::Binary doğrulama BAŞARISIZ — hatalı çıktı paketlenmiyor."
            exit 1
          fi
          echo "Binary doğrulama TAMAM: AArch64 + DYN + bionic-only + ICD + WSI temiz ✓"

      # -----------------------------------------------------------------------
      # 14) Paketleme — AdrenoTools uyumlu zip + meta.json + BUILD-INFO + SHA256
      #     Turnip md §5.2 alan tablosuna birebir uyum
      # -----------------------------------------------------------------------
      - name: "Paketle: AdrenoTools zip + meta.json + BUILD-INFO + SHA256SUMS"
        id: package_driver
        run: |
          set -euo pipefail
          PKG_DIR="${RUNNER_TEMP}/adpkg-bundle"
          ARTIFACTS_DIR="${RUNNER_TEMP}/artifacts"
          mkdir -p "${PKG_DIR}" "${ARTIFACTS_DIR}"

          cp "${SO_PATH}" "${PKG_DIR}/libvulkan_freedreno.so"

          # meta.json — Turnip md §5.2 zorunlu alanlar
          cat > "${PKG_DIR}/meta.json" << EOF
          {
            "schemaVersion": 1,
            "name": "Turnip Mesa ${MESA_VERSION_CLEAN} (Official Upstream - A750)",
            "description": "100% Unpatched Upstream Mesa (${MESA_TAG} @ ${MESA_COMMIT_SHORT}) built ${BUILD_DATE} for Snapdragon 8 Gen 3 / Adreno 750 (FD750, 0x43051401)",
            "author": "turnip-driver-a750 CI (source: gitlab.freedesktop.org/mesa/mesa)",
            "packageVersion": "1",
            "vendor": "Mesa",
            "driverVersion": "Mesa ${MESA_VERSION_CLEAN} (${MESA_COMMIT_SHORT})",
            "minApi": ${ADPKG_MIN_API},
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF

          # meta.json şema doğrulaması (jq)
          jq -e '.schemaVersion == 1 and .minApi == 29 and .libraryName == "libvulkan_freedreno.so"' \
            "${PKG_DIR}/meta.json" > /dev/null \
            || { echo "::error::meta.json şema doğrulaması BAŞARISIZ"; exit 1; }
          echo "meta.json şema doğrulaması: TAMAM"

          # BUILD-INFO.txt — izlenebilirlik
          cat > "${PKG_DIR}/BUILD-INFO.txt" << EOF
          Driver         : Mesa Turnip (libvulkan_freedreno.so)
          Target SoC/GPU : Qualcomm Snapdragon 8 Gen 3 (SM8650) / Adreno 750 (FD750, 0x43051401)
          Upstream Repo  : ${MESA_REPO}
          Upstream Tag   : ${MESA_TAG}
          Upstream SHA   : ${MESA_COMMIT}
          Build Date UTC : ${BUILD_DATE}
          NDK Version    : ${NDK_VERSION} (cross API ${CROSS_API}, platform SDK ${PLATFORM_SDK_VERSION})
          ISA Targeting  : -march=armv9.2-a -mtune=cortex-x4 (CPU/GPU md §2.1-§2.3)
          Optimization   : release(-O3) + NDEBUG + gc-sections + lld-O2 + unwind-trim + static-libstdc++
          LTO            : ${ENABLE_LTO}
          Patches Applied: NONE — 100% pure upstream
          Runtime Env    : NOT embedded (TU_DEBUG/TU_AUTOTUNE_ALGO/TU_GMEM/FD_DEV_FEATURES absent)
          Workflow Run   : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          # Zip (maksimum sıkıştırma)
          cd "${PKG_DIR}"
          zip -9 -r "${ARTIFACTS_DIR}/${ARTIFACT_BASE}.adpkg.zip" \
            libvulkan_freedreno.so meta.json BUILD-INFO.txt

          # SHA256SUMS
          cd "${ARTIFACTS_DIR}"
          sha256sum "${ARTIFACT_BASE}.adpkg.zip" > SHA256SUMS.txt

          echo "--- Artifacts ---"
          ls -lh "${ARTIFACTS_DIR}"
          echo "--- Zip içeriği ---"
          unzip -l "${ARTIFACTS_DIR}/${ARTIFACT_BASE}.adpkg.zip"
          echo "--- SHA256 ---"
          cat "${ARTIFACTS_DIR}/SHA256SUMS.txt"

          echo "artifact_dir=${ARTIFACTS_DIR}" >> "$GITHUB_OUTPUT"
          echo "artifact_base=${ARTIFACT_BASE}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 15) Artifact yükleme
      # -----------------------------------------------------------------------
      - name: "Artifact: yükle (Turnip-upstream-<tag>-<sha>-<tarih>)"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ env.ARTIFACT_BASE }}
          path: ${{ steps.package_driver.outputs.artifact_dir }}/*
          if-no-files-found: error
          retention-days: 30

      # -----------------------------------------------------------------------
      # 16) GitHub Step Summary (her durumda çalışır)
      # -----------------------------------------------------------------------
      - name: "Özet: GitHub Step Summary"
        if: always()
        run: |
          {
            echo "## Turnip A750 — Upstream Derleme Özeti"
            echo ""
            echo "| Alan | Değer |"
            echo "|---|---|"
            echo "| Mesa kaynağı | ${MESA_TAG:-bilinmiyor} |"
            echo "| Mesa commit  | ${MESA_COMMIT:-bilinmiyor} |"
            echo "| NDK          | ${NDK_VERSION:-bilinmiyor} |"
            echo "| LTO          | ${ENABLE_LTO:-false} |"
            echo "| ISA          | -march=armv9.2-a -mtune=cortex-x4 |"
            echo "| Yama         | Yok — %100 saf upstream |"
            echo "| Doğrulama    | AArch64 + DYN + bionic-only + ICD + WSI |"
            echo "| Artifact     | ${ARTIFACT_BASE:-üretilmedi} |"
            echo "| Sonuç        | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
